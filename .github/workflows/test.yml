name: Test

# 在真正的 Windows 上跑 Go 测试（云端开发时只能借 wine 跑）。前端交互测试见 tools/ui-dev。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27" # 和 release.yml 用同一个版本，见那里的说明
          check-latest: true
      # 3.1.2 起全仓 vet 没有任何提醒，这一步守着它：再冒出来的就是真该看的
      - name: go vet
        run: go vet ./...
      - name: Go 测试
        run: go test ./...
