<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 首页大卡的三种写法</title>
<script>
const STAR = "M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z";
window.EXTRA_ICONS = {
  console: '<rect x="2" y="3" width="12" height="10" rx="1.6"/><path d="M4.8 6.5l1.8 1.5-1.8 1.5M8 10h3"/>',
  star: `<path d="${STAR}"/>`, starOn: `<path d="${STAR}" fill="currentColor"/>`,
  user: '<circle cx="8" cy="5.6" r="2.6"/><path d="M3 13.6c.6-2.5 2.6-3.9 5-3.9s4.4 1.4 5 3.9"/>',
};
</script>
<script src="kit.js"></script>
<script src="pixel12-old.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); }
  .page { max-width: 1160px; margin: 0 auto; padding: 28px 40px 60px; }
  .row-h { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 12px; }
  .row-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .row-h .rec { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-full); background: var(--accent-subtle); color: var(--accent-text); }
  .row-h span.d { font-size: 12.5px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .cap-l { font-size: 11.5px; color: var(--faint); margin: 0 0 6px 4px; }

  .card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--elev-1); display: flex; flex-direction: column; min-height: 200px; position: relative; overflow: hidden; }
  .pad { padding: 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .top { display: flex; align-items: center; gap: 12px; }
  .nm { font-size: 15px; font-weight: 600; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sub .d { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .ok { color: var(--success-text); } .ok .d { background: var(--success); }
  .warm { color: var(--warning-text); } .warm .d { background: var(--warning); }
  .bad { color: var(--danger-text); } .bad .d { background: var(--danger); }
  .off .d { background: var(--faint); }
  .chip { font-size: 11.5px; padding: 1px 8px; border-radius: var(--r-full); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px 3px 8px; border-radius: var(--r-full); white-space: nowrap; }
  .pill.ok { background: var(--success-subtle); } .pill.off { background: var(--surface-2); color: var(--faint); } .pill.warm { background: var(--warning-subtle); }
  .pill .d { width: 7px; height: 7px; border-radius: 2px; }
  .pin { width: 28px; height: 28px; display: grid; place-items: center; color: var(--warning); flex: none; margin-left: auto; }
  .k { font-size: 11.5px; color: var(--muted); }
  .v { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 28px; }
  .v small { font-size: 12px; color: var(--faint); font-weight: 400; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats > div { padding: 8px 10px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .acts { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--r-full); font-size: 13px; font-weight: 500; background: var(--control); border: 1px solid var(--border); white-space: nowrap; }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.go { background: var(--accent-subtle); color: var(--accent-text); border-color: transparent; }
  .btn.ic { width: 32px; padding: 0; }
  .btn.wide { flex: 1; }
  .sp { flex: 1; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 62%; background: var(--warning); border-radius: 3px; }
  .steps { display: flex; gap: 6px; font-size: 11.5px; color: var(--faint); }
  .steps b { color: var(--warning-text); font-weight: 500; }

  /* 玩家头像：按名字生成的像素脸，叠在一起 */
  .heads { display: flex; align-items: center; }
  .heads .h { width: 26px; height: 26px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px var(--surface); margin-right: -6px; flex: none; }
  .heads .h svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .heads.dim .h { opacity: .45; filter: grayscale(.6); }
  .who { font-size: 12px; color: var(--muted); margin-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 连接地址：B 的主角之一，朋友要的就是这一串 */
  .addr { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 12px; border-radius: var(--r-full); background: var(--surface-2); min-width: 0; flex: 1; }
  .addr .t { font-family: var(--mono); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr .l { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .addr .cp { margin-left: auto; width: 26px; height: 26px; border-radius: var(--r-full); display: grid; place-items: center; color: var(--muted); }
  .addr.pub .l { color: var(--accent-text); }
  .addr.dim { opacity: .55; }
  .err { font-size: 12.5px; color: var(--danger-text); background: var(--danger-subtle); padding: 8px 10px; border-radius: var(--r-sm); line-height: 18px; }

  /* C 封面 */
  .cover { height: 76px; position: relative; background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
  .cover::after { content: ""; position: absolute; inset: 0; opacity: .16;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .cover .pill { position: absolute; top: 12px; left: 12px; margin: 0; z-index: 1; backdrop-filter: blur(6px); }
  .cover .pin { position: absolute; top: 8px; right: 10px; z-index: 1; }
  .card.c .avwrap { position: absolute; top: 48px; left: 18px; z-index: 2; border-radius: var(--r-md); box-shadow: 0 0 0 4px var(--surface); }
  .card.c .pad { padding-top: 34px; gap: 10px; }
  .motd { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .px-avatar { --c: #7a8aa0; width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: var(--r-md);
               background: color-mix(in srgb, var(--c) 26%, var(--surface)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
  .px-avatar svg { width: 24px; height: 24px; display: block; }
  .px-avatar.lg { width: 48px; height: 48px; } .px-avatar.lg svg { width: 32px; height: 32px; }
  /* D：A 的内容 + 一条窄一点的封面，头像压在封面下沿 */
  .card.d .cover { height: 58px; }
  .card.d .cover .pill { top: 10px; }
  .card.d .cover .pin { top: 6px; }
  .dhead { display: flex; align-items: flex-end; gap: 12px; padding: 0 18px; margin-top: -22px; position: relative; z-index: 2; }
  .dhead .avwrap { border-radius: var(--r-md); box-shadow: 0 0 0 4px var(--surface); flex: none; }
  .dhead .nm { padding-bottom: 1px; }
  .card.d .pad { padding-top: 14px; }
  .notes { margin-top: 36px; font-size: 12.5px; color: var(--muted); line-height: 20px; max-width: 860px; }
</style>
</head>
<body>
<main class="page">
  <div class="row-h" style="margin-top:0"><h2 style="font-size:20px">首页大卡 · 三种写法</h2><span class="d">每行从左到右：开着、停着、启动中。宽度和首页的大卡一样。</span></div>
  <div id="rows"></div>
</main>
<script>
const S = {
  run: { name: "生存服 · 朋友", core: "paper", label: "Paper", mc: "1.21.4", motd: "§a生存服 §7· §e一起来玩！", players: ["小明", "阿狸", "Creeper233"], max: 20, up: "2 小时 13 分", upShort: "2:13", lan: "192.168.1.5:25565", port: 25565 },
  stop: { name: "机械动力整合包", core: "forge", label: "Forge", mc: "1.20.1", motd: "§6Create 机械动力 §f整合包", last: "昨天 21:40", lastShort: "昨天", hours: 36, lastPlayers: ["小明", "铁匠老王"], lan: "192.168.1.5:25566", port: 25566 },
  boot: { name: "原版快照测试", core: "vanilla", label: "原版", mc: "26.2", motd: "A Minecraft Server", sec: 12, lan: "192.168.1.5:25567", port: 25567 },
};
const I = (n) => `<i data-ic="${n}"></i>`;
const av = (s, sz = "lg") => MDPixelOld.avatar(s.core, sz);

// 按名字生成一张 8×8 的像素脸（离线也能有头像；正版服以后可以换成真皮肤）
function face(name) {
  let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
  const skin = ["#f0c8a0", "#e0ac7e", "#c68b59", "#8d5a3a", "#f6d7b8"][h % 5];
  const hair = ["#3b2a1e", "#6b4226", "#d9a441", "#1f1f24", "#a3442c", "#5b6b7f"][(h >> 3) % 6];
  const eye = ["#3a5fd1", "#2f8a4a", "#6b3fa0", "#2b2b2b"][(h >> 6) % 4];
  const px = []; const P = (x, y, c) => px.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) P(x, y, y < 2 || (y < 3 && (x === 0 || x === 7)) ? hair : skin);
  P(1, 4, "#fff"); P(2, 4, eye); P(5, 4, eye); P(6, 4, "#fff");
  P(3, 6, "#7a4a35"); P(4, 6, "#7a4a35");
  return `<span class="h" title="${name}"><svg viewBox="0 0 8 8">${px.join("")}</svg></span>`;
}
const heads = (names, dim) => `<span class="heads${dim ? " dim" : ""}">${names.map(face).join("")}</span>`;

// MOTD 的 § 颜色码
const MC = { 0: "#000", 1: "#00a", 2: "#0a0", 3: "#0aa", 4: "#a00", 5: "#a0a", 6: "#fa0", 7: "#aaa", 8: "#555", 9: "#55f", a: "#5f5", b: "#5ff", c: "#f55", d: "#f5f", e: "#ff5", f: "#fff" };
const motd = t => t.split("§").map((p, i) => i === 0 ? p : `<span style="color:${MC[p[0]] || "inherit"}">${p.slice(1)}</span>`).join("");

// —— A：数据为主 ——
const A = {
  run: s => `<div class="card"><div class="pad"><div class="top">${av(s)}<div style="min-width:0"><div class="nm">${s.name}</div><span class="chip">${s.label} ${s.mc}</span></div><span class="pill ok"><span class="d"></span>运行中</span></div>
    <div class="stats"><div><div class="k">在线</div><div class="v">${s.players.length}<small>/${s.max}</small></div></div><div><div class="k">已运行</div><div class="v">${s.upShort}</div></div><div><div class="k">端口</div><div class="v">${s.port}</div></div></div>
    <div class="acts"><span class="btn">${I("console")}控制台</span><span class="btn ghost">${I("stop")}停止</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span></div></div></div>`,
  stop: s => `<div class="card"><div class="pad"><div class="top">${av(s)}<div style="min-width:0"><div class="nm">${s.name}</div><span class="chip">${s.label} ${s.mc}</span></div><span class="pill off"><span class="d"></span>已停止</span></div>
    <div class="stats"><div><div class="k">上次玩</div><div class="v" style="font-size:17px">${s.lastShort}</div></div><div><div class="k">时长总计</div><div class="v">${s.hours}<small>h</small></div></div><div><div class="k">端口</div><div class="v">${s.port}</div></div></div>
    <div class="acts"><span class="btn go">${I("play")}启动</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span></div></div></div>`,
  boot: s => `<div class="card"><div class="pad"><div class="top">${av(s)}<div style="min-width:0"><div class="nm">${s.name}</div><span class="chip">${s.label} ${s.mc}</span></div><span class="pill warm"><span class="d"></span>启动中</span></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:6px"><div class="bar"><i></i></div><div class="steps"><span>准备 Java ✓</span><span>·</span><b>加载世界</b><span>·</span><span>就绪</span></div></div>
    <div class="acts"><span class="btn">${I("console")}控制台</span><span class="btn ghost">${I("stop")}停止</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span></div></div></div>`,
};

// —— B：玩家和连接为主 ——
const bTop = (s, sub, cls) => `<div class="top">${av(s)}<div style="min-width:0"><div class="nm">${s.name}</div><div class="sub ${cls}"><span class="d"></span>${sub}</div></div><span class="pin">${I("starOn")}</span></div>`;
const B = {
  run: (s, pub) => `<div class="card"><div class="pad">${bTop(s, "运行中 · " + s.up, "ok")}
    <div style="display:flex;align-items:center">${heads(s.players)}<span class="v" style="margin-left:14px">${s.players.length}<small> / ${s.max}</small></span><span class="who">${s.players.slice(0, 2).join("、")} 等在线</span></div>
    <div class="acts">${pub ? `<span class="addr pub"><span class="l">${I("globe")}</span><span class="t">frp-hk.openfrp.net:31234</span><span class="cp">${I("copy")}</span></span>` : `<span class="addr"><span class="l">局域网</span><span class="t">${s.lan}</span><span class="cp">${I("copy")}</span></span>`}<span class="btn ic" title="控制台">${I("console")}</span><span class="btn ghost ic" title="停止">${I("stop")}</span></div></div></div>`,
  stop: s => `<div class="card"><div class="pad">${bTop(s, "已停止 · " + s.lastShort + "玩过", "off")}
    <div style="display:flex;align-items:center">${heads(s.lastPlayers, true)}<span class="who" style="margin-left:14px">上次和 ${s.lastPlayers.join("、")} 一起 · 共 ${s.hours} 小时</span></div>
    <div class="acts"><span class="btn go wide">${I("play")}启动</span><span class="btn ghost ic" title="控制台">${I("console")}</span></div></div></div>`,
  boot: s => `<div class="card"><div class="pad">${bTop(s, "启动中 · " + s.sec + " 秒", "warm")}
    <div style="display:flex;flex-direction:column;gap:8px;padding-top:4px"><div class="bar"><i></i></div><div class="steps"><span>准备 Java ✓</span><span>·</span><b>加载世界</b><span>·</span><span>就绪</span></div></div>
    <div class="acts"><span class="addr dim"><span class="l">局域网</span><span class="t">${s.lan}</span><span class="cp">${I("copy")}</span></span><span class="btn ic" title="控制台">${I("console")}</span><span class="btn ghost ic" title="停止">${I("stop")}</span></div></div></div>`,
  fail: s => `<div class="card"><div class="pad">${bTop(s, "没能启动 · 10 分钟前", "bad")}
    <div class="err">端口 25566 被「生存服 · 朋友」占着。</div>
    <div class="acts"><span class="btn go wide">${I("play")}改成 25568 并启动</span><span class="btn ghost ic" title="控制台">${I("console")}</span></div></div></div>`,
  stopping: s => `<div class="card"><div class="pad">${bTop(s, "正在停止 · 保存世界", "warm")}
    <div style="display:flex;align-items:center">${heads(s.players.slice(0, 1), true)}<span class="who" style="margin-left:14px">已通知在线的人</span></div>
    <div class="acts"><span class="addr dim"><span class="l">局域网</span><span class="t">${s.lan}</span><span class="cp">${I("copy")}</span></span><span class="btn ic" title="控制台">${I("console")}</span><span class="btn ghost ic" title="强制停止">${I("x")}</span></div></div></div>`,
};

// —— C：封面 ——
const cCard = (s, pill, body, acts) => `<div class="card c" style="--c:${MDPixelOld.CORE_COLORS[s.core]}"><div class="cover">${pill}<span class="pin">${I("starOn")}</span></div><span class="avwrap">${av(s)}</span>
  <div class="pad"><div style="min-width:0"><div class="nm">${s.name}</div><div class="motd">${motd(s.motd)}</div></div>${body}<div class="acts">${acts}</div></div></div>`;
const C = {
  run: s => cCard(s, `<span class="pill ok"><span class="d"></span>运行中</span>`, `<div class="sub" style="gap:14px"><span>${I("user")} ${s.players.length}/${s.max}</span><span>${I("clock")} ${s.upShort}</span><span class="mono">:${s.port}</span></div>`,
    `<span class="btn">${I("console")}控制台</span><span class="btn ghost">${I("stop")}停止</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span>`),
  stop: s => cCard(s, `<span class="pill off"><span class="d"></span>已停止</span>`, `<div class="sub" style="gap:14px"><span>${I("clock")} ${s.lastShort}玩过</span><span>共 ${s.hours} 小时</span></div>`,
    `<span class="btn go">${I("play")}启动</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span>`),
  boot: s => cCard(s, `<span class="pill warm"><span class="d"></span>启动中</span>`, `<div class="bar" style="margin-top:4px"><i></i></div>`,
    `<span class="btn">${I("console")}控制台</span><span class="btn ghost">${I("stop")}停止</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span>`),
};

// —— D：A 的内容 + C 的封面 ——
const dCard = (s, pill, body, acts) => `<div class="card d" style="--c:${MDPixelOld.CORE_COLORS[s.core]}"><div class="cover">${pill}<span class="pin">${I("starOn")}</span></div>
  <div class="dhead"><span class="avwrap">${av(s)}</span><div style="min-width:0"><div class="nm">${s.name}</div><div class="sub">${s.label} · ${s.mc}</div></div></div>
  <div class="pad">${body}<div class="acts">${acts}</div></div></div>`;
const port = s => `<div><div class="k">端口</div><div class="v" style="display:flex;align-items:center;gap:6px">${s.port}<span style="color:var(--faint)">${I("copy")}</span></div></div>`;
const D = {
  run: s => dCard(s, `<span class="pill ok"><span class="d"></span>运行中</span>`,
    `<div class="stats"><div><div class="k">在线</div><div class="v">${s.players.length}<small>/${s.max}</small></div></div><div><div class="k">已运行</div><div class="v">${s.upShort}</div></div>${port(s)}</div>`,
    `<span class="btn">${I("console")}控制台</span><span class="btn ghost">${I("stop")}停止</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span>`),
  stop: s => dCard(s, `<span class="pill off"><span class="d"></span>已停止</span>`,
    `<div class="stats"><div><div class="k">上次玩</div><div class="v" style="font-size:17px">${s.lastShort}</div></div><div><div class="k">时长总计</div><div class="v">${s.hours}<small>h</small></div></div>${port(s)}</div>`,
    `<span class="btn go">${I("play")}启动</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span>`),
  boot: s => dCard(s, `<span class="pill warm"><span class="d"></span>启动中</span>`,
    `<div style="display:flex;flex-direction:column;gap:8px;padding:6px 0 18px"><div class="bar"><i></i></div><div class="steps"><span>准备 Java ✓</span><span>·</span><b>加载世界</b><span>·</span><span>就绪</span></div></div>`,
    `<span class="btn">${I("console")}控制台</span><span class="btn ghost">${I("stop")}停止</span><span class="sp"></span><span class="btn ghost ic">${I("more")}</span>`),
};

const row = (title, desc, cards, rec, labels = ["开着", "停着", "启动中"]) =>
  `<div class="row-h"><h2>${title}</h2>${rec ? '<span class="rec">我推荐</span>' : ""}<span class="d">${desc}</span></div>
   <div class="grid">${cards.map((c, i) => `<div><div class="cap-l">${labels[i]}</div>${c}</div>`).join("")}</div>`;

KIT_READY.then(() => {
  document.getElementById("rows").innerHTML =
    row("D · A 的内容 + C 的封面", "作者选的方向。这一行是第一次合起来的样子，后来又照作者的意见改过（状态挪到右下角、两格数字、复制地址、停止用危险色），最新的看 home.html。", [D.run(S.run), D.stop(S.stop), D.boot(S.boot)], false) +
    row("A · 数据为主", "三格数字一样大，状态是右上角的胶囊。整齐，但哪一格都不比别的重要。", [A.run(S.run), A.stop(S.stop), A.boot(S.boot)]) +
