<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 工具箱</title>
<!--
  工具箱草图（11-26 子代理照《界面重构临时规范》和首页、向导两页的做法画的第一稿，作者还没逐处看过）。
  一个文件三页，?tool=home|skin|mrpack 切；入口页点卡片也能进，页内换页不刷新（地址跟着改）。

  外壳：标题栏、底部胶囊照 home.html 抄（胶囊里「工具箱」那项是选中的样子），版心 1080，底边留 86。
    三页都留着胶囊（任务说明定的外壳）；工具页的「上一步」「下一步」照向导的样子（44 高胶囊、中线和胶囊对齐、左右贴版心），
    分在胶囊两边。向导里钉在正中的第几步小点这里放不下（正中是胶囊），没画，第几步靠标题换。
    回入口：左下「上一步」（同向导第一步的「上一步」回首页），或点胶囊里选中的「工具箱」（MASTER 11.6：点当前项回这一页的起点）。

  入口页：一句标题「工具箱」，下面两张卡（照向导第一步玩法大卡：外 26、内边距 8、封面 18 带棋盘格），整组在胶囊上面的空间里居中再往上提一点
    （同首页空状态的做法）。只有两个工具，卡片不撑满 1080；卡上只写名字和程序里原有的标签（「客户端资源包」「.mrpack 分享包」），
    程序里那两句长说明进悬停。封面色借核心头像的固定色：皮肤包用原版色，整合包用 NeoForge 色（同向导「原版」「模组」两张玩法卡）。

  离线皮肤包（?tool=skin）：一屏，不分步。理由：版本、分配方式一改，每个人落到哪个默认皮肤马上跟着变，分成几步就看不到这层联动。
    程序里三段（版本与分配、皮肤列表、槽位预演与生成）收成一个大面板：左栏「资源包设置」，右栏「皮肤列表」，底下一条「存到本机文件夹 / 生成结果」。
    程序里预演是一张单独的表，把每行的槽位、UUID 又列一遍（一个值说了两次）；这里并进皮肤列表的每一行：行右边就是这个人落到的默认皮肤，
    路径和离线 UUID 在悬停里；撞进同一个默认皮肤的几行直接在行上标红、点「保留」二选一（程序是表格上面一张警告卡里的一排按钮）。
    槽位是照 internal/toolbox/skinpack.go 真算的（MD5「OfflinePlayer:玩家名」→ UUID v3 → Java UUID.hashCode → floorMod 18 或 2），
    示例名 lisi 和 xiaohong 是真撞在 Makena · 经典上的，不是硬标的。
  导出 Modrinth 整合包（?tool=mrpack）：分步，照向导。理由：「自己挑模组」那块要向导第二步那样整个面板宽（左逛右清单），和设置、预览挤不进一屏。
    第 1 步「配置整合包信息」：左栏名称、版本号、简介；右栏顶上两段选来源（自己挑模组 / 从已有服务器导出），下面跟着换：加载器、游戏版本、加载器版本，
      或者模组服务器列表加「一并打包 config/」。第 2 步「挑选要放进整合包的模组」照向导第二步（只有自己挑模组时有）。
    最后一步「确认导出清单」：进来自动预览（程序要点「预览导出清单」），左边在线下载的，右边打进 overrides 的和打包提醒，底下一条存到文件夹 / 生成结果。
    从已有服务器导出时没有挑模组那步，两步，同向导原版少一步的做法。

  皮肤包这一页里各块：
    左栏：游戏版本（输入框 + 4 个快捷预设；标签右边「18 个默认槽位」，1.19.2 以前是 2 个，整句说明和 pack_format 在悬停里；读了服务器以后框下面一句「已改成「X」的版本」）、
      分配方式（40 高两段：按玩家名 / 按顺序替换）、资源包名称、资源包描述（选填；淡字「留空自动生成」，程序留空时写的那句在悬停里）。
    右栏：皮肤列表（「n / 18」、从服务器读取、加一行；每行：脸、玩家名（平时是字，点进去才是框）、文件名和尺寸（64×32 写「自动扩成 64×64」）、落到的默认皮肤；
      按顺序替换时那块能点，弹出 2 × 9 的格子挑位置，上面一排「自动」三选一，代替程序的「手臂模型」「目标槽位」两个下拉）；底下拖放区。
    底下一条：同时存到本机文件夹（远程打开时灰着、悬停说原因；程序是整个藏起来）；生成以后换成结果：文件名、大小、贴图数、pack_format、resource-pack-sha1 和复制。
  整合包每一步：
    第 1 步左栏名称、版本号、简介；右栏「模组来源」两段，下面跟着逐项换：加载器（三段）、游戏版本（输入框 + 4 个预设）、加载器版本（选填），
      或者模组服务器（一行一个，选中框滑过去；Mohist、Taiyitist 右下角一句「按 Forge 导出，不含插件」，整句在悬停里）和「一并打包 config/」。
      没有模组服务器时「从已有服务器导出」那段灰着、悬停说原因；读不出存好的草稿时左栏顶上一条危险色，右边「重新读取」（程序的长说明进悬停）。
    第 2 步照向导第二步：卡片只标例外，口径是朋友的客户端（照程序 envTag）：「仅客户端」「仅服务端」；清单底下「自动带出必装前置」开关。
      清单空着点「下一步」会拦下（后端导出空清单本来就报错「没有可打包进去的模组或配置文件」）。清单的名字照程序和 MASTER 叫「待装清单」。
    最后一步：封面条写名称、版本号，下面一行是游戏版本和加载器（或者从哪台服务器导出）；左边在线下载的，每行右边是装在哪一边（仅客户端、客户端+服务端、客户端可选……，
      说明在悬停里）；右边打进 overrides 的（本地 jar、config 文件），下面「打包提醒」照程序的原话、两行截断、整句在悬停里。程序第二行是包里的路径（mods/文件名.jar），
      草图不知道 Modrinth 上真的文件名，放的是简介。
  第几步的小点没画（胶囊占着正中）。点了卡片进来，「上一步」「下一步」从下面浮上来；回入口时沉下去。

  和程序现在不一样的（改程序时要动的）：
    · 所有系统控件换成自己画的：版本的 datalist 换成输入框加一排快捷预设（程序 12 个预设，这里各挑了 4 个）；服务器、手臂、槽位、加载器的 select
      分别换成带头像的行、弹出的格子、三段的分段选；勾选式开关换成开关在字左边；预演和预览的 table 换成列表行。
    · 拦下一步照规范：生成键一直能点，点了把出问题的那一行标红、晃一下、光标落过去、底下那条说一句；程序是把生成键灰掉、旁边一行小字。
    · 皮肤缩略图只画脸（从 PNG 里裁出 8×8 的脸放大）；程序是把整张 64×64 的皮肤贴图缩成 40 见方，看不出是谁。
    · 皮肤列表底下的拖放区能一次拖进好几张 PNG，一张一行；程序是每行自己点「选择皮肤 PNG」。
    · 生成以后再改任何东西，底下那条回到「存到本机文件夹」、右下回到「生成」；程序是旧结果一直挂着，直到下一次生成。
    · 整合包：前置照向导第二步，加一个就把它要的前置放进清单、标「前置」；程序是导出时才按「自动带出必装前置」补，清单里看不到。
      所以「自动带出必装前置」挪到清单那一栏，开关一动，清单里的前置跟着进出。
    · 整合包的预览进最后一步就自动做（程序要点「预览导出清单」）。
    · 结果里的长说明（皮肤包的 notice、朋友怎么导入整合包）收进「下载」的悬停。
  要后端补的：一样。整合包卡片上的「仅服务端」要看 Modrinth 的 client_side，可 internal/modcart/modrinth.go 的搜索结果 Hit 只带了 server_side
    （Modrinth 的 /search 本身返回 client_side，加一个字段就行；向导第二步卡片上的「需客户端」「仅服务端」也靠它）。清单里的项（ServerSide、ClientSide）两个都有。
    别的都是现有接口：/api/toolbox/*、/api/instances、/api/instances/{name}/players、/api/app 的 local、/api/pickdir、/api/modcart（cart=toolbox）和 /api/modcart/deps
    （加一个就把前置放进清单，前端加完调一次 deps，同向导第二步的做法）。

  草图里的数据：服务器列表抄 home.html；读进来的玩家名、服务器里的模组、config 文件名、生成结果的大小和 SHA-1 都是编的示例；
    模组卡片用 modrinth-sample.js（向导第二步那份：NeoForge 26.1，取的时候带了 server_side!=unsupported，可样本里还是有 2 个服务端标 unsupported 的，
    Zoomify 和 Pick Up Notifier，照实标「仅客户端」）；程序里工具箱这份清单会把只在客户端用的也列出来（接口带 ClientOK），排位会不一样；草稿当作读回来是 NeoForge 26.1（程序第一次打开是 Fabric 1.20.1），这样卡片和标题对得上。
    换成别的加载器、版本，卡片不跟着换（同向导第二步换核心时的做法）。加载器的推荐版本号草图里不知道，照实写「官方推荐」。
  标题栏左边「草图」那一排是草图专用的状态切换，定了就删（地址参数也行：?tool=skin&state=demo|clash|empty|many|done，
    ?tool=mrpack&step=1|2|3、&state=inst|nomods|drafterr|done，&local=0 看远程打开）。草图里选文件、选文件夹、下载都不真弹窗：
    点空着的皮肤格子给一张示例脸，拖放区点一下加两行，存到文件夹点一下换成示例文件夹，整合包的拖放区点一下加一个示例 jar。
-->


<script>
// 程序图标里没有的：工具箱、窗口三键（照 home.html），减号（照 wizard.html）；画法同程序图标（16 格、1.3 粗、圆头）
window.EXTRA_ICONS = {
  toolbox: '<path d="M5.5 4V2.8A.8.8 0 016.3 2h3.4a.8.8 0 01.8.8V4"/><rect x="2" y="4" width="12" height="9.5" rx="1.6"/><path d="M2 8h12M6.5 8v1.6h3V8"/>',
  winMin: '<path d="M4 8h8"/>', winMax: '<rect x="4" y="4" width="8" height="8" rx="1"/>', winClose: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  minus: '<path d="M3.5 8h9"/>',
  // 程序和别的草图里都没有的（子代理补的，照程序 download 那个倒过来画）：上传，用在皮肤缩略图空着时和拖放区
  upload: '<path d="M8 10.5V3M4.7 6.2L8 3l3.3 3.2M3 13h10"/>',
};
</script>
<script src="kit.js"></script>
<script src="pixel16.js"></script>
<script src="modrinth-sample.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }
  /* 标题栏：照 home.html（字标那版，标题栏里只留小图标）和 wizard.html */
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: sticky; top: 0; z-index: 5;
        background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .tb img { width: 16px; height: 16px; image-rendering: pixelated; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }

  /* 版心 1080、居中；底边留 86 给胶囊（同首页、向导） */
  .page { max-width: 1160px; margin: 0 auto; padding: 0 40px 86px; min-height: calc(100vh - 40px); box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; }
  /* 一句陈述式标题，居中（照向导 .q） */
  .q { margin: 44px 0 48px; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -.01em; text-align: center; }

  /* ---- 入口页 ---- */
  /* 只有两个工具：标题和两张卡整组在胶囊上面的空间里居中，再往上提 7vh（同首页空状态 .hero 往上提的做法），上面留白大、下面不空出一大截 */
  .page.v-home { justify-content: center; padding-bottom: calc(86px + 7vh); }
  .page.v-home .q { margin: 0 0 40px; }
  /* 两张卡照向导第一步的玩法大卡：外圆角 26、内边距 8，封面圆角 18（同心）带棋盘格；卡宽 340，不撑满 1080（梯形：标题窄、卡片一排宽） */
  .tools { display: grid; grid-template-columns: repeat(2, 340px); gap: 16px; }
  .tool { --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1); cursor: pointer;
          transition: transform .15s, box-shadow .15s; color: inherit; text-decoration: none; display: block; }
  .tool:hover { transform: translateY(-2px); box-shadow: var(--elev-2); }
  .cover { border-radius: 18px; display: grid; place-items: center; position: relative; overflow: hidden; background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
  .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .cover > * { position: relative; z-index: 1; }
  .tool .cover { height: 112px; }
  .tool .cover svg { display: block; }
  /* 封面里的图标用程序图标放大到 44（线宽跟着放大成约 3.6，和像素图标的粗细接近），颜色往正文色靠 */
  .tool .cover .ico.big { width: 44px; height: 44px; color: color-mix(in srgb, var(--text) 88%, var(--c)); }
  .tool .t { margin: 12px 0 2px; font-size: 16px; font-weight: 600; text-align: center; }
  .tool .s { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* ---- 底部胶囊：照 home.html（只放图标，40 的圆，悬停提示在上方） ---- */
  .cap { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 4px; padding: 5px;
         border-radius: var(--r-full); background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2);
         border: 1px solid var(--border); box-shadow: var(--elev-3); transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s; }
  .cap a { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border-radius: var(--r-full); color: var(--muted);
           text-decoration: none; position: relative; }
  .cap a .ico { width: 18px; height: 18px; }
  .cap a:hover { color: var(--text); background: var(--hover); }
  .cap a.on { color: var(--accent-text); background: var(--accent-subtle); }
  .cap a.home img { width: 20px; height: 20px; image-rendering: pixelated; }
  .cap a.ai { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
  .cap a.ai .ico { color: var(--accent-text); }
  .cap a.ai:hover { background: var(--control-hov); }
  .cap a.new { background: var(--accent-solid); color: var(--on-accent); }
  .cap a.new:hover { background: var(--accent-solid-hov); }
  .cap a[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px);
    padding: 5px 10px; border-radius: var(--r-sm); background: var(--overlay); border: 1px solid var(--border); box-shadow: var(--elev-2);
    color: var(--text); font-size: 12px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; }
  .cap a[data-tip]:hover::after, .cap a[data-tip]:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.leaving .cap { transform: translate(-50%, 160%); opacity: 0; }

  /* ---- 工具页底部的「上一步」「下一步」：照 wizard.html 的 .wnav / .wbtn，分在胶囊两边（胶囊不沉） ---- */
  .wnav { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 9; pointer-events: none; }
  .wnav .in { max-width: 1160px; margin: 0 auto; padding: 0 40px; height: 52px; display: flex; align-items: center; }
  .wnav .sp { flex: 1; }
  .wbtn { pointer-events: auto; height: 44px; padding: 0 18px; border-radius: var(--r-full); display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
          font: inherit; font-size: 13px; font-weight: 600; box-shadow: var(--elev-3); transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s; }
  .wbtn .ico { width: 16px; height: 16px; }
  .wbtn.next { justify-content: center; overflow: hidden; white-space: nowrap; padding-right: 14px; border: 0; color: var(--on-accent); background: var(--accent-solid); }
  .wbtn.next:hover { background: var(--accent-solid-hov); }
  .wbtn.next.plain { padding-right: 18px; }
  .wbtn .lbl { display: inline-flex; align-items: center; gap: 6px; }
  .wbtn.next.busy { cursor: default; }
  .wbtn.back { padding-left: 14px; color: var(--text); border: 1px solid var(--border);
               background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2); }
  .wbtn.back:hover { background: color-mix(in srgb, var(--overlay) 86%, var(--text) 6%); }
  .wbtn.back .ico { transform: rotate(180deg); }
  body.hidden-nav .wbtn { transform: translateY(180%); opacity: 0; pointer-events: none; }

  /* ---- 两个工具共用的件，照 wizard.html ---- */
  /* 大面板：外圆角 26、内边距 8；里面的栏圆角 18（26 − 8，同心），栏之间 8 */
  .panel { width: 100%; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); box-sizing: border-box; display: grid; gap: 8px; }
  .col { border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); padding: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 28px; flex: none; }
  .col h3 .sp { flex: 1; }
  .col h3 .cnt { font-family: var(--mono); color: var(--faint); font-weight: 500; }
  /* 细滚动条（照 wizard.html 的 .lwrap / .list / .thumb 和脚本里的 scrollbar()）：系统滚动条藏掉，右边 4 像素的细条，悬停或在滚才出来，能拖；上下还有没露出来的那一头淡出 28 */
  .lwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { position: relative; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1; scrollbar-width: none;
          --ft: 0px; --fb: 0px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%); }
  .list::-webkit-scrollbar { display: none; }
  .lwrap.can-up .list { --ft: 28px; } .lwrap.can-down .list { --fb: 28px; }
  .thumb { position: absolute; right: -6px; width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text) 38%, transparent);
           opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
  .lwrap:hover .thumb, .lwrap.scrolling .thumb, .thumb.drag { opacity: 1; }
  .thumb:hover, .thumb.drag { width: 6px; right: -7px; background: color-mix(in srgb, var(--text) 55%, transparent); }

  /* 表单一行：字 18 + 间距 6 + 框 40 */
  .fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fld > .lb { font-size: 12.5px; line-height: 18px; color: var(--muted); font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
  .fld > .lb .sp { flex: 1; }
  .fld > .lb .aside { font-size: 12px; font-weight: 400; color: var(--faint); cursor: default; }
  .inp { height: 40px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); padding: 0 12px; box-sizing: border-box; width: 100%;
         font: inherit; font-size: 14px; color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; }
  .inp.mono { font-family: var(--mono); font-size: 13.5px; }
  .inp::placeholder { color: var(--faint); }
  .inp:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .inp.bad { border-color: color-mix(in srgb, var(--danger-text) 70%, var(--border)); }
  .fnote { font-size: 12px; line-height: 18px; color: var(--faint); display: flex; align-items: center; gap: 5px; min-height: 18px; }
  .fnote:empty { display: none; }
  .fnote .ico { width: 13px; height: 13px; flex: none; }
  .fnote.bad { color: var(--danger-text); }
  /* 快捷预设：28 高胶囊（照向导第三步内存那排） */
  .mpre { display: flex; gap: 6px; flex-wrap: wrap; }
  .mp { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--border); background: none; color: var(--muted); font: inherit; font-family: var(--mono); font-size: 12px; font-weight: 500;
        cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .mp:hover:not(.on) { color: var(--text); background: var(--hover); }
  .mp.on { background: var(--accent-subtle); color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  /* 分段选：表单里取值的 40 高、圆角 10，选中块离外框 4、圆角 6，滑过去（照向导） */
  .seg { position: relative; display: flex; padding: 3px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); box-sizing: border-box; height: 40px; flex: none; }
  .seg span { flex: 1; position: relative; z-index: 1; display: grid; place-items: center; font-size: 13px; color: var(--muted); border-radius: 6px; cursor: pointer; transition: color .2s, opacity .2s; white-space: nowrap; }
  .seg span:hover { color: var(--text); }
  .seg span.on { color: var(--accent-text); font-weight: 500; }
  .seg span.off { opacity: .45; cursor: default; }
  .seg span.off:hover { color: var(--muted); }
  .seg .sgl { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 6px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
              box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
              transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
  /* 开关：36 × 20，在字的左边 */
  .tg { display: flex; align-items: center; gap: 10px; cursor: pointer; width: fit-content; }
  .tg .t { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .sw { order: -1; width: 36px; height: 20px; border-radius: 10px; flex: none; position: relative; background: color-mix(in srgb, var(--text) 18%, transparent); transition: background .2s; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--text); transition: transform .26s cubic-bezier(.3, .7, .2, 1); }
  .tg.on .sw { background: var(--accent-solid); }
  .tg.on .sw::after { transform: translateX(16px); background: var(--on-accent); }
  /* 图标按钮 28 见方、圆角 4 */
  .ib { width: 28px; height: 28px; border-radius: 4px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; transition: background .2s, color .2s; }
  .ib:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib .ico { width: 15px; height: 15px; }
  .ib.done { color: var(--accent-text); }
  .ib.spinning .ico, .ico.spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 栏标题右边的小文字按钮（「从服务器读取」这种）：28 高胶囊，悬停出底色 */
  .tbtn { height: 28px; padding: 0 10px; border-radius: 14px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 500;
          display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background .2s, color .2s; }
  .tbtn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .tbtn .ico { width: 14px; height: 14px; }
  /* 拖放区：虚线框 44 高、圆角 10（照向导第二步） */
  .drop { flex: none; margin-top: 8px; height: 44px; border-radius: 10px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center;
          gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s, opacity .2s; }
  .drop:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .drop .ico { width: 15px; height: 15px; }
  .drop.off { opacity: .45; cursor: default; }
  .drop.off:hover { color: var(--muted); border-color: var(--border); }
  /* 吸在面板底部的一条：52 高、圆角 18（同向导第三步 EULA、第四步「谁能进」）；里面离边 6 的框 40 高、圆角 12（18 − 6） */
  .ostrip { grid-column: 1 / -1; height: 52px; border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); padding: 0 20px 0 6px;
            display: flex; align-items: center; gap: 12px; min-width: 0; transition: box-shadow .2s; }
  .ostrip > * { flex: none; }
  .ostrip .sp { flex: 1; }
  .ostrip .msg { font-size: 12px; color: var(--danger-text); opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .ostrip .msg.show { opacity: 1; }
  .ostrip.bad { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger-text) 60%, transparent); }
  /* 存到本机文件夹：同向导的路径框，点了选文件夹（草图里不真弹窗）；空着时只写一句，选了以后右边一个 × 清掉 */
  .pathf { height: 40px; width: 440px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 5px 0 12px; border-radius: 12px; box-sizing: border-box; cursor: pointer;
           background: var(--field); border: 1px solid var(--border); transition: border-color .2s; }
  .pathf .ib { border-radius: 6px; } /* 右边的 × 离框外沿 6（边框 1 加内边距 5），圆角 12 − 6 = 6，同心 */
  .pathf:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .pathf > .ico { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .pathf .ph { flex: 1; font-size: 13px; color: var(--faint); white-space: nowrap; }
  .pathf b { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 生成结果（换掉存到文件夹那块）：勾、文件名、几样事实、SHA-1 和复制 */
  .res { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto !important; padding-left: 8px; }
  .res .ok { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; background: var(--success-subtle); color: var(--success-text); flex: none; }
  .res .ok .ico { width: 15px; height: 15px; }
  .res .fn { font-family: var(--mono); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .res .facts { font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
  .res .sp { flex: 1; }
  .res .hk { font-size: 12px; color: var(--faint); white-space: nowrap; flex: none; }
  .res .hv { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
  /* 弹出的小面板（版本、服务器、槽位这些原来是 select 的）：浮层底、细边、--elev-3，圆角 16、内边距 6，里面的行圆角 10（16 − 6，同心） */
  .pop { position: fixed; z-index: 60; background: var(--overlay); border: 1px solid var(--border); box-shadow: var(--elev-3); border-radius: 16px; padding: 6px; box-sizing: border-box;
         display: flex; flex-direction: column; opacity: 0; transform: translateY(-4px); transition: opacity .12s, transform .12s; }

  .prow { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 6px; border-radius: 10px; cursor: pointer; flex: none; font-size: 13.5px; font-weight: 500; }

  .prow .m { flex: 1; min-width: 0; }

  .prow .k { font-size: 12px; color: var(--muted); font-weight: 400; font-family: var(--mono); white-space: nowrap; }
  .prow svg.px { width: 32px; height: 32px; flex: none; display: block; }

  /* ---- 离线皮肤包：面板 520 高（同向导第二步，170 到 690），左栏设置 344 宽，右栏皮肤列表，底下一条 ---- */
  .skp { height: 520px; grid-template-columns: 344px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 52px; }

  /* 右栏照向导第二步的栏：左右和底边内边距 8，行贴着栏边 8、圆角 10（18 − 8，同心）；标题往里缩 12，字离栏边 20，和左栏一样 */
  .skp .lst { padding: 14px 8px 8px; }
  .skp .lst h3 { padding: 0 4px 0 12px; margin-bottom: 6px; }
  .skp .lst .thumb { right: -6px; }
  /* 皮肤一行：52 高；缩略图 40 离行边 6、圆角 4（10 − 6，同心）；名字平时是字、悬停出底色、点进去才出框（同向导第三步的名称）；右边是落到的默认皮肤 */
  .srow { position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 6px; border-radius: 10px; flex: none; transition: opacity .2s, background .15s; }
  .srow:hover { background: var(--hover); }
  .srow.skip > :not(.slotw):not(.x) { opacity: .45; }
  .sth { width: 40px; height: 40px; border-radius: 4px; flex: none; display: grid; place-items: center; cursor: pointer; overflow: hidden; position: relative;
         background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--faint); transition: box-shadow .2s, color .2s; }
  .sth svg.face { width: 40px; height: 40px; display: block; }
  .sth.empty { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 22%, transparent); }
  .sth.empty:hover { color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
  .sth.bad { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--danger-text) 75%, transparent); color: var(--danger-text); }
  .sth .ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .55); color: #fff; opacity: 0; transition: opacity .2s; }
  .sth:not(.empty):hover .ov { opacity: 1; }
  .sth .ico { width: 16px; height: 16px; }
  .stx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pn { height: 26px; width: 100%; max-width: 260px; margin-left: -7px; padding: 0 6px; border-radius: 6px; border: 1px solid transparent; background: transparent; outline: none; box-sizing: border-box;
        font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text); transition: background .15s, border-color .15s, box-shadow .15s; }
  .pn::placeholder { color: var(--faint); font-weight: 500; }
  .pn:hover { background: var(--hover); }
  .pn:focus { background: var(--field); border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .pn.bad { background: var(--field); border-color: color-mix(in srgb, var(--danger-text) 70%, var(--border)); }
  .fm { font-size: 12px; line-height: 16px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
  .fm.bad { color: var(--danger-text); font-family: var(--font); }
  .fm .lg { font-family: var(--font); color: var(--muted); }
  /* 落到的默认皮肤：28 高胶囊；撞进同一个的标危险色（会拦生成），旁边「保留」二选一 */
  .slotw { display: flex; align-items: center; gap: 6px; flex: none; }
  .slot { height: 28px; padding: 0 11px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap;
          background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); cursor: default; }
  .slot small { font-size: 11.5px; font-weight: 400; color: var(--muted); }
  .slot.none { background: none; color: var(--faint); font-weight: 400; padding: 0 4px; }
  .slot.clash { background: var(--danger-subtle); color: var(--danger-text); }

  .slot.skipped { background: none; color: var(--faint); box-shadow: inset 0 0 0 1px var(--border); font-weight: 400; }

  .slot .ico { width: 13px; height: 13px; opacity: .7; }
  .slot .au { color: var(--faint); font-weight: 400; }
  .keep { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--border); background: none; color: var(--text); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;

  .srow .x { width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; color: var(--faint); cursor: pointer; opacity: 0; flex: none; border: 0; background: none; padding: 0; }

  .srow .x .ico { width: 13px; height: 13px; }
  /* 按顺序替换时挑槽位的弹出格子：上面一排「自动」三选一（手臂不限 / 经典 / 纤细），下面两排九个角色；格子 28 高胶囊 */
  .sgrid { display: grid; grid-template-columns: 40px repeat(9, auto); gap: 4px; align-items: center; padding: 2px 4px 4px; }
  .sgrid .rl { font-size: 12px; color: var(--faint); }

        cursor: pointer; position: relative; white-space: nowrap; transition: background .15s, color .15s; }

  .sc.used::after { content: ""; position: absolute; right: 4px; top: 4px; width: 5px; height: 5px; border-radius: 2px; background: var(--faint); }

  /* ---- 导出 Modrinth 整合包 ---- */
  /* 第 1 步：两栏，左「整合包信息」，右「模组来源」（顶上两段选，下面跟着换）。面板定高 372，换来源时不跳 */
  .mp1 { height: 372px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }

  /* 读不出草稿：一块危险色的底，右边「重新读取」 */

  /* 模组服务器：一行一个，同向导第一步核心那列（44 高、圆角 10、选中框单独一块滑过去） */
  .srvw { flex: 1; }
  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 6px; border-radius: 10px; cursor: pointer; flex: none; font-size: 14px; font-weight: 500; }

  .row.on { color: var(--accent-text); font-weight: 600; }
  .row svg { width: 32px; height: 32px; display: block; flex: none; }
  .row .sp { flex: 1; }
  .row .k { font-size: 12px; color: var(--faint); font-weight: 400; font-family: var(--mono); }
  .row.on .k { color: var(--accent-text); }
  .hl { position: absolute; left: 0; right: 0; top: 0; height: 44px; border-radius: 10px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
        transition: transform .32s cubic-bezier(.3, .7, .2, 1), height .32s cubic-bezier(.3, .7, .2, 1); }
  .srvw .list { padding-right: 10px; margin-right: -4px; }
  .srvw .hl { right: 10px; } /* 和行一样宽：右边那 10 像素留给细滚动条 */
  .cfgrow { display: flex; align-items: center; gap: 12px; min-height: 28px; flex: none; }
  .cfgrow .fnote { margin-left: auto; color: var(--warning-text); }
  /* 第 2 步：照 wizard.html 第二步（左边逛、右边清单），面板 520 高 */
  .addon { display: flex; gap: 8px; height: 520px; }
  .addon > .col { min-width: 0; padding: 14px 8px 8px; }
  .addon .col h3 { padding: 0 6px; }
  .addon .list { margin: 0; padding: 0; overflow-x: hidden; }
  .addon .thumb { right: -6px; }
  .addon .browse { flex: 2.6 1 0; }
  .addon .cart { flex: 1 1 0; }
  .findin { height: 32px; border-radius: 16px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border);
            width: 170px; box-sizing: border-box; font-weight: 400; }
  .findin input { all: unset; flex: 1; min-width: 0; font-size: 12px; color: var(--text); }
  .findin input::placeholder { color: var(--faint); }

  .chips { position: relative; display: flex; gap: 5px; margin: 0 0 12px; padding: 0 6px; overflow-x: auto; scrollbar-width: none; flex: none; --fl: 0px; --fr: 0px;
           -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
           mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); }
  .chips::-webkit-scrollbar { display: none; }
  .chips.can-l { --fl: 28px; } .chips.can-r { --fr: 28px; }
  .chip { position: relative; z-index: 1; height: 28px; padding: 0 10px; border-radius: 14px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer;
          white-space: nowrap; flex: none; box-shadow: inset 0 0 0 1px var(--border); transition: color .2s, background .2s, box-shadow .2s; }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--accent-text); box-shadow: none; }
  .chl { position: absolute; left: 0; top: 0; height: 28px; border-radius: 14px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
         box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);

<script>
const QS = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let view = ["home", "skin", "mrpack"].includes(QS.get("tool")) ? QS.get("tool") : "home";

// ---- 入口页 ----
// 名字、标签、悬停里的整句都照程序 toolbox.js 的 TOOLS
const TOOLS = [
  { id: "skin", title: "离线皮肤包生成", tag: "客户端资源包", ico: "player", c: "vanilla",
    desc: "把离线服里朋友们的皮肤 PNG 打包成客户端资源包，按玩家名离线 UUID 命中各自默认皮肤，或者按顺序替换。" },
  { id: "mrpack", title: "导出 Modrinth 整合包", tag: ".mrpack 分享包", ico: "package", c: "neoforge",
    desc: "把模组和配置打包成标准 .mrpack 发给朋友，可以从已有的模组服务器直接导出，也可以自己现挑模组，前置由 MineDeck 找齐。" },
];
function homeView() {
  return `<h1 class="q">工具箱</h1><div class="tools">${TOOLS.map(t =>
    `<a class="tool" href="?tool=${t.id}" data-tool="${t.id}" style="--c:${MDPixel16.CORE_COLORS[t.c]}" title="${esc(t.desc)}">`
    + `<div class="cover">${KIT.icon(t.ico, "big")}</div><div class="t">${esc(t.title)}</div><div class="s">${esc(t.tag)}</div></a>`).join("")}</div>`;
}

// ---- 换页 ----
function render() {
  const page = document.getElementById("page");
  page.className = "page v-" + view;
  page.innerHTML = view === "home" ? homeView() : view === "skin" ? skinView() : mrpackView();
  KIT.hydrate(page);
  document.getElementById("next").title = ""; // 生成以后「下载」上的悬停，换页先清掉，生成过的页面自己再设
  after();
  paintSim();
  navLabel();
  document.body.classList.toggle("hidden-nav", view === "home");
}
function after() {
  if (view === "skin") afterSkin?.();
  if (view === "mrpack") afterMrpack?.();
}
// 页内换页：整页往走的方向挪 16 像素淡掉（0.14 秒），新的从另一边挪进来（0.26 秒），同向导换步
let stepping = false;
function swapPage(fn, dir) {
  if (stepping) return;
  stepping = true;
  const page = document.getElementById("page");
  const out = page.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-16 * dir}px)` }], { duration: 140, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" });
  out.onfinish = () => {
    fn(); render(); out.cancel();
    page.animate([{ opacity: 0, transform: `translateX(${16 * dir}px)` }, { opacity: 1, transform: "none" }], { duration: 260, easing: "cubic-bezier(.2, .7, .2, 1)" })
      .onfinish = () => { stepping = false; };
  };
}
function goView(v) {
  if (v === view) { if (v !== "home") return; }
  const dir = v === "home" ? -1 : 1;
  swapPage(() => {
    view = v;
    const q = new URLSearchParams(location.search); q.set("tool", v); ["step", "state"].forEach(k => q.delete(k));
    history.replaceState(null, "", "?" + q.toString());
  }, dir);
}
// 右下主按钮的字和宽度：换字时旧字 0.09 秒淡掉，按钮宽度按整像素走到新的，新字淡进来（照 wizard.html 的 navLabel）
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d; } return Y(Math.min(1, Math.max(0, t))); };
}
const EASE_SLIDE = bezier(.3, .7, .2, 1);
const tweens = {};
function tweenPx(key, dur, ease, frame, done) {
  const id = tweens[key] = (tweens[key] || 0) + 1, t0 = performance.now();
  const tick = now => { if (tweens[key] !== id) return; const p = Math.min(1, (now - t0) / dur); frame(ease(p)); if (p < 1) requestAnimationFrame(tick); else done?.(); };
  requestAnimationFrame(tick);
}
let navTok = 0;
function nextLabel() {
  if (view === "skin") return skinNext();
  if (view === "mrpack") return mrpackNext();
  return "";
}
function navLabel() {
  const b = document.getElementById("next"), want = nextLabel();
  if (b.dataset.label === want) return;
  const first = !b.dataset.label, tok = ++navTok;
  b.dataset.label = want;
  const swap = () => {
    if (tok !== navTok) return;
    const w0 = b.offsetWidth;
    b.style.width = ""; b.classList.toggle("plain", !want.includes("data-ic=\"chevronRight\"")); b.innerHTML = `<span class="lbl">${want}</span>`; KIT.hydrate(b);
    if (first || document.body.classList.contains("hidden-nav")) return;
    const w1 = b.offsetWidth;
    b.querySelector(".lbl").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 60, easing: "cubic-bezier(.2, .7, .2, 1)", fill: "backwards" });
    if (w0 === w1) return;
    b.style.width = w0 + "px";
    tweenPx("nextw", 320, EASE_SLIDE, e => { b.style.width = Math.round(w0 + (w1 - w0) * e) + "px"; }, () => { if (tok === navTok) b.style.width = ""; });
  };
  const old = b.querySelector(".lbl");
  if (first || !old || document.body.classList.contains("hidden-nav")) return swap();
  old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" }).onfinish = swap;
}

// ---- 草图专用：右上角切状态 ----
function paintSim() {
  const box = document.getElementById("sim");
  const items = view === "skin" ? skinSim?.() : view === "mrpack" ? mrpackSim?.() : [];
  box.innerHTML = items && items.length ? `<span class="k">草图</span>` + items.map(x => x === "|" ? `<i class="sep"></i>` : `<span data-sim="${x[0]}"${x[2] ? ` class="on"` : ""}>${x[1]}</span>`).join("") : "";
}
document.getElementById("sim").addEventListener("click", e => { const x = e.target.closest("[data-sim]"); if (x) simPick(x.dataset.sim); });
function simPick(k) { if (view === "skin") skinSimPick?.(k); else if (view === "mrpack") mrpackSimPick?.(k); }

// ---- 事件 ----
document.getElementById("page").addEventListener("click", e => {
  const t = e.target.closest("[data-tool]");
  if (t) { e.preventDefault(); goView(t.dataset.tool); return; }
  if (view === "skin") skinClick?.(e);
  else if (view === "mrpack") mrpackClick?.(e);
});
document.querySelector('.cap [data-nav="toolbox"]').addEventListener("click", e => { e.preventDefault(); if (view !== "home") goView("home"); });
document.querySelector(".cap a.new").addEventListener("click", e => { e.preventDefault(); document.body.classList.add("leaving"); setTimeout(() => { location.href = "wizard.html"; }, 320); });
document.querySelector(".cap a.home").addEventListener("click", e => { e.preventDefault(); location.href = "home.html"; });
document.getElementById("back").addEventListener("click", () => { if (view === "skin") goView("home"); else if (view === "mrpack") mrpackBack(); });
document.getElementById("next").addEventListener("click", () => { if (view === "skin") skinGo(); else if (view === "mrpack") mrpackGo(); });

// ---- 两个工具共用的小件（照 wizard.html） ----
const EASE_IN = "cubic-bezier(.4, 0, 1, 1)", EASE_OUT = "cubic-bezier(.2, .7, .2, 1)";
// 拦下一步时晃一下（0.36 秒，−6、5、−3 像素）
const shakeEl = el => el?.animate([{ transform: "none" }, { transform: "translateX(-6px)" }, { transform: "translateX(5px)" }, { transform: "translateX(-3px)" }, { transform: "none" }],
  { duration: 360, easing: "cubic-bezier(.3, .7, .2, 1)" });
// 细滚动条：跟着列表算长短和位置，能拖；上下有没看到的就渐隐（照 wizard.html 的 scrollbar）
function scrollbar(w) {
  if (!w) return;
  const l = w.querySelector(".list"), t = w.querySelector(".thumb");
  const paint = () => {
    const ch = l.clientHeight, sh = l.scrollHeight, st = l.scrollTop;
    w.classList.toggle("fits", sh <= ch + 1);
    w.classList.toggle("can-up", st > 2);
    w.classList.toggle("can-down", st + ch < sh - 2);
    const h = Math.max(28, ch * ch / sh);
    t.style.height = h + "px";
    t.style.top = (sh > ch ? st / (sh - ch) * (ch - h) : 0) + "px";
  };
  if (w._paint) { w._paint(); return; }
  w._paint = paint;
  let idle = 0;
  l.addEventListener("scroll", () => { paint(); w.classList.add("scrolling"); clearTimeout(idle); idle = setTimeout(() => w.classList.remove("scrolling"), 700); }, { passive: true });
  t.addEventListener("pointerdown", e => {
    e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add("drag");
    const y0 = e.clientY, s0 = l.scrollTop, ratio = (l.scrollHeight - l.clientHeight) / (l.clientHeight - t.offsetHeight);
    const move = ev => { l.scrollTop = s0 + (ev.clientY - y0) * ratio; };
    const up = () => { t.classList.remove("drag"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); };
    t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
  });
  paint();
}
// 分段选的选中块挪到选中的那一格（照 wizard.html 的 placeSeg）
function placeSeg(el, animate) {
  const hl = el.querySelector(".sgl"), on = el.querySelector("span.on"); if (!hl || !on) return;
  if (!animate) hl.style.transition = "none";
  hl.style.transform = `translateX(${on.offsetLeft}px)`; hl.style.width = on.offsetWidth + "px";

    if (m.classList.contains("in") !== on) { m.classList.toggle("in", on); m.querySelector(".add").innerHTML = KIT.icon(on ? "check" : "plus"); }
  });
  const list = document.getElementById("alist"); if (!list) return;
  const gone = [...list.querySelectorAll(".crow:not(.out)")].filter(r => !keys.has(r.dataset.id));
  if (clear && gone.length) {
    let delay = 0, gap = 90;
    gone.forEach((r, i) => {
      r.classList.add("out");
      const a = r.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(40px)" }], { duration: 220, delay, easing: EASE_IN, fill: "forwards" });
      delay += gap; gap = Math.max(16, Math.round(gap * 0.75));
      if (i === gone.length - 1) a.onfinish = () => { gone.forEach(x => x.remove()); list.closest(".lwrap")._paint?.(); };
    });
  } else gone.forEach((r, i) => {
    r.classList.add("out"); const h = r.offsetHeight + "px";
    r.animate([{ opacity: 1, transform: "none", height: h, marginBottom: "0px", easing: EASE_IN }, { opacity: 0, transform: "translateX(32px)", height: h, marginBottom: "0px", offset: .55, easing: EASE_OUT },
      { opacity: 0, transform: "translateX(32px)", height: "0px", marginBottom: "-4px" }], { duration: 320, delay: i * 40, fill: "forwards" }).onfinish = () => { r.remove(); list.closest(".lwrap")._paint?.(); };
  });
  cartAll().forEach(p => {
    const key = p.local ? "local:" + p.local : p.id;
    if ([...list.querySelectorAll(".crow:not(.out)")].some(r => r.dataset.id === key)) return;
    list.insertAdjacentHTML("beforeend", crowHTML(p)); KIT.hydrate(list);
    const r = list.lastElementChild;
    r.animate([{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "none" }], { duration: 220, delay: p.by ? 60 : 0, easing: EASE_OUT, fill: "backwards" });
    r.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  cartMeta(); list.closest(".lwrap")._paint?.();
}
// 换类别、搜索：卡片一批换（照向导 regrid）
function regrid(dir = 0) {
  document.getElementById("atitle").innerHTML = atitle();
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.cat === acat));
  placeChipHL(true);
  regridList(document.getElementById("agrid"), gridHTML(), dir);
}
function placeChipHL(animate) {
  const hl = document.querySelector(".chl"), on = document.querySelector(".chip.on"); if (!hl || !on) return;
  if (!animate) hl.style.transition = "none";
  hl.style.transform = `translateX(${on.offsetLeft}px)`; hl.style.width = on.offsetWidth + "px";
  if (!animate) { void hl.offsetWidth; hl.style.transition = ""; }
}
function chipScroll(c) {
  const paint = () => { c.classList.toggle("can-l", c.scrollLeft > 2); c.classList.toggle("can-r", c.scrollLeft + c.clientWidth < c.scrollWidth - 2); };
  c.addEventListener("scroll", paint, { passive: true });
  c.addEventListener("wheel", e => { if (c.scrollWidth <= c.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; e.preventDefault(); c.scrollLeft += e.deltaY; }, { passive: false });
  paint();
}

// ---- 最后一步：确认导出清单 ----
// 服务器里 mods 文件夹的模组（编的：挑样本里的几个）；一个 Modrinth 上认不出的 jar 打进 overrides；config 文件名也是编的
const INST_MODS = ["jei", "jade", "appleskin", "geckolib", "architectury-api", "terrablender", "clumps", "simple-voice-chat", "ferrite-core", "modernfix", "worldedit"];
const INST_CFG = ["config/jei/jei-client.ini", "config/jade/jade.json", "config/appleskin-client.toml", "config/voicechat/voicechat-server.properties", "config/modernfix-mixins.properties"];
const ENV_CN = { required: "要装", optional: "可选", unsupported: "不装" };
// 环境：照程序 envTag 的口径（ss / cs 是 Modrinth 的 server_side / client_side）
function envOf(x) {
  if (x.ss === "unsupported") return ["仅客户端", "co", "服务端标成 unsupported，朋友的客户端装、服务器不装"];
  if (x.cs === "unsupported") return ["仅服务端", "", "客户端不装：朋友的启动器会跳过它"];
  if (x.cs === "required" && x.ss === "required") return ["客户端+服务端", "", "两边都要装"];
  return [`客户端${ENV_CN[x.cs] || "要装"}`, "", `Modrinth 上标的：客户端${ENV_CN[x.cs] || "要装"}，服务端${ENV_CN[x.ss] || "要装"}。启动器装整合包时，可选的会问朋友要不要装`];
}
function previewData() {
  if (MP.src === "draft") return {
    files: picked.map(p => ({ x: byId(p.id), by: p.by && byId(p.by) })),
    ov: locals.map(n => ({ n, path: "overrides/mods/" + n, note: LOCAL_NOTE })),
    warn: locals.length ? ["提示：放进 overrides/mods 的本地模组会完整打进压缩包，分享给多人前请留意原模组作者的分发许可协议。"] : [],
  };
  const s = MODSRV[MP.inst];
  const ov = [{ n: "custom-recipes-1.0.jar", path: "overrides/mods/custom-recipes-1.0.jar", note: "Modrinth 未收录（自定义、修改版或仅发布于其它平台），整包放进 overrides/mods" },
    ...(MP.cfg ? INST_CFG.map(p => ({ n: p, path: "overrides/" + p, note: "服务端 config 配置文件", cfg: true })) : [])];
  return { files: INST_MODS.map(id => ({ x: byId(id) })), ov, warn: [CORE_NOTE[s[1]],
    MP.cfg ? "这些配置文件看起来带着密码、令牌、密钥、数据库，或者是备份副本，没有打进包：config/discord-integration.toml。它们是服主自己的，发给朋友的包里不该有；确实要的话，请自己检查过内容再单独发。这只是尽量挑出来，打进包的配置文件都列在下面，发之前请看一眼" : "",
    "提示：放进 overrides/mods 的本地模组会完整打进压缩包，分享给多人前请留意原模组作者的分发许可协议。"].filter(Boolean) };
}
const frowHTML = f => { const [t, cls, tip] = envOf(f.x);
  return `<div class="frow">${tile(f.x)}<div class="m"><div class="n">${esc(f.x.n)}${f.by ? `<span class="ftag" title="${esc(f.by.n)} 的前置依赖">前置</span>` : ""}</div>`
    + `<div class="why" title="${esc(f.x.d)}">${esc(f.x.d)}</div></div><span class="env ${cls}" title="${esc(tip)}">${t}</span></div>`; }; // 程序这里第二行是包里的路径（mods/文件名.jar），草图不知道真的文件名，放简介
const orowHTML = o => `<div class="frow"><span class="mt jar">${KIT.icon(o.cfg ? "doc" : "package")}</span><div class="m"><div class="n">${esc(o.n.split("/").pop())}</div><div class="why" title="${esc(o.note)}">${esc(o.path)}</div></div></div>`;
const wrowHTML = w => `<div class="wrow" title="${esc(w)}"><i data-ic="warn"></i><span>${esc(w)}</span></div>`;
const skelRows = n => `<div class="frow skel"><span class="mt"></span><div class="m"><i></i><i></i></div></div>`.repeat(n);
function step3() {
  const core = exportCore(), mc = MP.src === "draft" ? MP.mc : MODSRV[MP.inst][2], lv = MP.src === "draft" && MP.lv.trim() ? MP.lv.trim() : "官方推荐版本";
  const sub = MP.sum.trim() || (MP.src === "draft" ? `Minecraft ${mc} · ${CORE_NAME[core]} ${lv}` : `从「${MODSRV[MP.inst][0]}」导出 · Minecraft ${mc} · ${CORE_NAME[core]}`);
  const cov = `<div class="mcov" style="--c:${MDPixel16.CORE_COLORS[core]}"><span class="av">${MDPixel16.svg(core, 32)}</span><div class="tt"><div class="nm">${esc(MP.name.trim() || "整合包")}<span class="v">${esc(MP.ver.trim() || "1.0.0")}</span></div>`
    + `<div class="sb" title="${esc(`写进 modrinth.index.json 的依赖：minecraft ${mc} · ${core === "fabric" ? "fabric-loader" : core} ${lv}`)}">${esc(sub)}</div></div></div>`;
  const left = `<div class="col"><h3><span title="写进 modrinth.index.json，朋友的启动器从 Modrinth 官方下载">在线下载</span><span class="cnt" id="fcnt"></span></h3>`
    + `<div class="lwrap"><div class="list" id="flist" style="gap:2px">${skelRows(6)}</div><i class="thumb"></i></div></div>`;
  const right = `<div class="col rcol"><h3><span title="整个打进压缩包，不用朋友另外下载">打进 overrides</span><span class="cnt" id="ocnt"></span></h3>`
    + `<div class="lwrap"><div class="list" id="olist" style="gap:2px">${skelRows(2)}</div><i class="thumb"></i></div></div>`;
  return `<div class="panel mp3">${cov}${left}${right}<div class="ostrip" id="mpstrip">${MP.result && MP.result !== true ? mStripDone() : mStripIdle()}</div></div>`;
}
const mStripIdle = () => `${pathBox(MP.dest)}<span class="sp"></span><span class="msg" id="mpmsg"></span>`;
function mStripDone() {
  const r = MP.result;
  return `<div class="res"><span class="ok"><i data-ic="check"></i></span><span class="fn" title="${esc(r.fileName + (r.saved ? "\n已存到 " + r.saved : ""))}">${esc(r.fileName)}</span>`
    + `<span class="facts">${r.size}${r.saved ? " · 已存到文件夹" : ""}</span><span class="sp"></span>` // 在线下载、overrides 各几项上面两栏标题里写着，这里不再说
    + `<span class="hk">SHA-1</span><span class="hv">${r.sha1}</span><button class="ib" data-act="copy" data-copy="${r.sha1}" title="复制"><i data-ic="copy"></i></button></div><span class="msg" id="mpmsg"></span>`;
}
// 进最后一步就预览（程序要点「预览导出清单」）：先出骨架行（程序那句「正在整理导出清单与 Modrinth 校验信息…」进悬停），0.6 秒后一行一行淡进来
function loadPreview(animate) {
  const f = document.getElementById("flist"), o = document.getElementById("olist"); if (!f) return;
  f.title = o.title = "正在整理导出清单与 Modrinth 校验信息…";
  const fill = () => {
    if (!document.getElementById("flist")) return;
    const d = previewData();
    f.removeAttribute("title"); o.removeAttribute("title");
    f.innerHTML = d.files.map(frowHTML).join(""); KIT.hydrate(f);
    o.innerHTML = (d.ov.length ? d.ov.map(orowHTML).join("") : `<div class="rnone">没有</div>`)
      + (d.warn.length ? `<div class="lh3">打包提醒<span class="cnt">· ${d.warn.length}</span></div>` + d.warn.map(wrowHTML).join("") : ""); KIT.hydrate(o);
    document.getElementById("fcnt").textContent = `· ${d.files.length}`; document.getElementById("ocnt").textContent = `· ${d.ov.length}`;
    if (animate) [f, o].forEach(l => inView(l, [...l.children]).forEach((c, i) => c.animate([{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "none" }], { duration: 220, delay: i * 22, easing: EASE_OUT, fill: "backwards" })));
    scrollbar(f.closest(".lwrap")); scrollbar(o.closest(".lwrap"));
    MP.loaded = true; MP.prev = d;
  };
  if (animate) setTimeout(fill, 600); else fill();
}
// 生成结果（假的）：文件名照程序（名称-版本号-时间.mrpack），大小和 SHA-1 是编的
function makeResult(animate) {
  const d = MP.prev || previewData(), stem = (MP.name.trim() || "整合包").replace(/[\\/:*?"<>|\s]+/g, "_"), ver = (MP.ver.trim() || "1.0.0").replace(/[\\/:*?"<>|\s]+/g, "_");
  const hex = [...(stem + ver + stamp())].reduce((a, c) => (a * 33 + c.charCodeAt(0)) >>> 0, 5381);
  let sha = ""; for (let i = 0, h = hex; i < 40; i++) { h = (h * 1103515245 + 12345) >>> 0; sha += (h >>> 27 & 15).toString(16); }
  MP.result = { fileName: `${stem}-${ver}-${stamp()}.mrpack`, size: (3.2 + d.files.length * 0.6 + d.ov.length * 41.5).toFixed(1) + " KB", dl: d.files.length, ov: d.ov.length, sha1: sha, saved: LOCAL && MP.dest ? MP.dest : "" };
  const strip = document.getElementById("mpstrip");
  if (animate) swapItems(strip, mStripDone(), 1, "X"); else { strip.innerHTML = mStripDone(); KIT.hydrate(strip); }
  navLabel();
  document.getElementById("next").title = "朋友拿到以后：在启动器里选「导入整合包」（Modrinth App、Prism、HMCL、PCL2 都有），选这个 .mrpack，启动器会建好对应版本和加载器、下载里面的模组。";
}

// ---- 接到外壳上 ----
mrpackView = () => {
  const t = STEPS()[MP.step];
  return `<h1 class="q">${t}</h1>` + (MP.step === 0 ? step1() : t === "挑选要放进整合包的模组" ? step2() : step3());
};
afterMrpack = () => {
  document.querySelectorAll(".mp1 .seg, #mpdet .seg").forEach(s => placeSeg(s, false));
  afterDet();
  const chips = document.querySelector(".chips"); if (chips) { chipScroll(chips); placeChipHL(false); }
  document.querySelectorAll(".addon .lwrap").forEach(scrollbar);
  document.getElementById("agrid")?.addEventListener("scroll", moreCards, { passive: true });
  cartMeta();
  if (document.getElementById("flist")) { loadPreview(!MP.result); if (MP.result) makeResult(false); }
};
mrpackNext = () => MP.busy ? `<i data-ic="spinner" class="spin"></i>生成中` : !isLast() ? `下一步<i data-ic="chevronRight"></i>` : MP.result ? `<i data-ic="download"></i>下载整合包` : "生成整合包";
function goStep(n) {
  const dir = n > MP.step ? 1 : -1;
  swapPage(() => { MP.step = n; if (!isLast()) MP.result = null; MP.loaded = false; }, dir);
}
mrpackBack = () => { closePop(); if (MP.step === 0) { MP.result = null; goView("home"); } else { MP.result = null; goStep(MP.step - 1); } };
mrpackGo = () => {
  if (MP.busy) return;
  if (MP.step === 0) {
    if (MP.src === "draft" && !parseMC(MP.mc)) { const i = document.getElementById("mpmc"); i.classList.add("bad"); shakeEl(i); i.focus(); return; }
    goStep(1); return;
  }
  if (!isLast()) { // 挑模组：清单空着导出不了（后端：没有可打包进去的模组或配置文件），拦下来
    if (!picked.length && !locals.length) { const m = document.getElementById("cmsg"); m.textContent = "清单里还没有模组"; m.classList.add("show"); shakeEl(document.querySelector(".cart .lwrap")); return; }
    goStep(MP.step + 1); return;
  }
  if (MP.result) return; // 「下载整合包」：草图里不真下载
  if (!MP.loaded) return; // 还在预览
  MP.busy = true; navLabel();
  setTimeout(() => { MP.busy = false; makeResult(true); }, 900);
};
mrpackClick = e => {
  const t = e.target;
  if (t.closest("a.ext")) return;
  const sp = t.closest("#mpsrc span"); if (sp) { pickSrc(sp.dataset.src, sp.parentElement, sp); return; }
  const co = t.closest("#mpcore span");
  if (co) { if (co.classList.contains("on")) return; MP.core = co.dataset.core; co.parentElement.querySelectorAll("span").forEach(x => x.classList.toggle("on", x === co)); placeSeg(co.parentElement, true); return; }
  const mc = t.closest("[data-mc]"); if (mc) { setMC(mc.dataset.mc); return; }
  const sv = t.closest("[data-srv]"); if (sv) { pickSrv(+sv.dataset.srv); return; }
  const ad = t.closest("[data-addon]"), un = t.closest("[data-unpick]"), ul = t.closest("[data-unlocal]"), ch = t.closest("[data-cat]");
  if (ad && !ad.classList.contains("skel")) { toggleAddon(ad.dataset.addon); return; }
  if (un) { toggleAddon(un.dataset.unpick); return; }
  if (ul) { locals = locals.filter(x => x !== ul.dataset.unlocal); syncAddons(); return; }
  if (ch && ch.dataset.cat !== acat) {
    const chips = [...document.querySelectorAll(".chip")], at = k => chips.findIndex(c => c.dataset.cat === k), dir = at(ch.dataset.cat) > at(acat) ? 1 : -1;
    acat = ch.dataset.cat; regrid(dir); ch.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" }); return;
  }
  if (t.closest("[data-clear]")) { picked = []; locals = []; syncAddons(true); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "cfg") { MP.cfg = !MP.cfg; a.classList.toggle("on", MP.cfg); }
  else if (act === "deps") toggleDeps(a);
  else if (act === "localjar") { locals.push(`example-mod-${locals.length + 1}.0.jar`); syncAddons(); } // 草图里不弹选文件的窗口，假装选了一个
  else if (act === "retry") { // 重新读取：转 0.6 秒，读出来了，表单换成存好的那份（假的），那条淡掉
    if (a.classList.contains("spinning")) return; a.classList.add("spinning");
    setTimeout(() => {
      MP.draftErr = false; MP.name = "周末联机包"; MP.ver = "1.2.0"; MP.sum = ""; MP.nameTouched = false;
      ["mpname", "mpver", "mpsum"].forEach((id, i) => { const el = document.getElementById(id); if (el) el.value = [MP.name, MP.ver, MP.sum][i]; });
      const dn = a.closest(".dnote"), h = dn.offsetHeight;
      dn.animate([{ opacity: 1, height: h + "px", marginBottom: "0px" }, { opacity: 0, height: "0px", marginBottom: "-16px" }], { duration: 260, easing: EASE_OUT, fill: "forwards" }).onfinish = () => dn.remove();
      paintSim();
    }, 600);
  }
  else if (act === "cleardir") { MP.dest = ""; a.closest(".pathf").outerHTML = pathBox(""); KIT.hydrate(document.getElementById("mpstrip")); }
  else if (act === "pickdir") { MP.dest = DEMO_DIR; a.outerHTML = pathBox(MP.dest); KIT.hydrate(document.getElementById("mpstrip")); }
  else if (act === "copy") copyFlash(a);
};
function setMC(v) {
  MP.mc = v; const i = document.getElementById("mpmc"); if (i && i.value !== v) i.value = v;
  i?.classList.toggle("bad", !parseMC(v));
  const n = document.getElementById("mpmcnote"); if (n) { n.innerHTML = mcNote(); KIT.hydrate(n); }
  document.querySelectorAll("#mpchips .mp").forEach(b => b.classList.toggle("on", b.dataset.mc === v.trim()));
}
document.getElementById("page").addEventListener("input", e => {
  if (view !== "mrpack") return;
  const t = e.target;
  if (t.id === "mpname") { MP.name = t.value; MP.nameTouched = true; }
  else if (t.id === "mpver") MP.ver = t.value;
  else if (t.id === "mpsum") MP.sum = t.value;
  else if (t.id === "mplv") MP.lv = t.value;
  else if (t.id === "mpmc") setMC(t.value);
  else if (t.id === "aq") { clearTimeout(aqTimer); aqTimer = setTimeout(() => { aq = t.value.trim(); regrid(); }, 180); }
});
mrpackSim = () => {
  return [...STEPS().map((t, i) => [`s${i}`, `第 ${i + 1} 步`, MP.step === i && !MP.result]), ["done", "已生成", !!MP.result], "|",
    ["inst", "从服务器导出", MP.src === "instance"], ["nomods", "没有模组服", MP.noMods], ["drafterr", "草稿读不出", MP.draftErr], ["remote", "远程打开", !LOCAL]];
};
mrpackSimPick = k => {
  if (k === "remote") LOCAL = !LOCAL;
  else if (k === "inst") { MP.src = MP.src === "instance" ? "draft" : "instance"; if (MP.src === "instance") MP.noMods = false; MP.step = 0; MP.result = null; if (!MP.nameTouched) MP.name = MP.src === "instance" ? MODSRV[MP.inst][0] : "我的整合包"; }
  else if (k === "nomods") { MP.noMods = !MP.noMods; if (MP.noMods) { MP.src = "draft"; if (!MP.nameTouched) MP.name = "我的整合包"; } MP.step = 0; MP.result = null; }
  else if (k === "drafterr") { MP.draftErr = !MP.draftErr; MP.step = 0; MP.result = null; }
  else if (k === "done") { MP.step = STEPS().length - 1; MP.result = MP.result ? null : true; }
  else if (k[0] === "s") { MP.step = +k.slice(1); MP.result = null; }
  render();
};
})();
</script>
<script>
KIT_READY.then(() => { render(); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.toggle("hidden-nav", view === "home"))); });
</script>
