<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 首页（服务器）</title>
<script>
// 程序里没有的图标：工具箱（照 index.html 里内联的）、窗口三键、星标、控制台
const STAR = "M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z";
window.EXTRA_ICONS = {
  toolbox: '<path d="M5.5 4V2.8A.8.8 0 016.3 2h3.4a.8.8 0 01.8.8V4"/><rect x="2" y="4" width="12" height="9.5" rx="1.6"/><path d="M2 8h12M6.5 8v1.6h3V8"/>',
  winMin: '<path d="M4 8h8"/>', winMax: '<rect x="4" y="4" width="8" height="8" rx="1"/>', winClose: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  console: '<rect x="2" y="3" width="12" height="10" rx="1.6"/><path d="M4.8 6.5l1.8 1.5-1.8 1.5M8 10h3"/>',
  star: `<path d="${STAR}"/>`, starOn: `<path d="${STAR}" fill="currentColor"/>`,
  // 赞赏浮层里的两家（照两家的标志画成线条图标）：支付宝是圆角方块里一个「支」，微信是一大一小两个对话气泡
  alipay: '<rect x="1.8" y="1.8" width="12.4" height="12.4" rx="3"/><path d="M4.4 5h7.2M8 3.4v3.4M4.8 7.2h5.8c-.9 2.6-3 4.4-5.2 4.4-1.1 0-1.7-.6-1.7-1.3 0-1.4 2.2-2 4.7-1.2 1.6.5 3 1.3 4.6 2.2"/>',
  wechat: '<path d="M10.95 6.6A5 4.3 0 1 0 2.17 8.76L1.6 11.3l1.9-1.58A5 4.3 0 0 0 6.6 10.27"/><path d="M14.02 12.51A4.2 3.6 0 1 0 12.9 13.32l1.7 1.08z"/>'
    + '<circle cx="4.3" cy="5.3" r=".75" fill="currentColor" stroke="none"/><circle cx="7.7" cy="5.3" r=".75" fill="currentColor" stroke="none"/>'
    + '<circle cx="9.3" cy="9.5" r=".7" fill="currentColor" stroke="none"/><circle cx="12.3" cy="9.5" r=".7" fill="currentColor" stroke="none"/>',
};
</script>
<script src="kit.js"></script>
<script src="pixel16.js"></script>
<script src="wordmark.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }

  /* 标题栏：和内容同一张底，不再是单独的一条深色 */
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: sticky; top: 0; z-index: 5;
        background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .tb .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .tb .brand img { width: 16px; height: 16px; image-rendering: pixelated; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }

  /* 内容 */
  /* 基准窗口 1280×800（16:10，逻辑像素）：第一次打开不出竖向滚动条，胶囊不压住「其他」。底边留白 = 胶囊 52 + 离底 18 + 间隔 16 = 86 */
  .page { max-width: 1160px; margin: 0 auto; padding: 12px 40px 86px; }
  .head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 28px; }
  .head h1 { font-size: 26px; line-height: 34px; font-weight: 600; letter-spacing: -.015em; margin: 0; }
  .head .sum { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .head .sum b { color: var(--text); font-weight: 600; }
  .head .sum .dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--success); margin-right: 6px; vertical-align: 1px; }
  .head .sp { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; width: 240px; height: 36px; padding: 0 12px; border-radius: var(--r-full);
            background: var(--field); border: 1px solid var(--border); color: var(--faint); font-size: 13px; }

  .sec { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; min-height: 32px; }
  .sec h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
  .sec .n { font-family: var(--mono); font-size: 13px; color: var(--faint); }
  .sec .hint { font-size: 12px; color: var(--faint); }
  .sec .sp { flex: 1; }

  /* 分段控件（32 高胶囊，换着看什么）：底槽同向导的分段（输入框的底和细边），选中的强调色底单独一块滑过去。
     原来是凹陷轨道加凸起的当前项、一下跳过去（同 MASTER 的 .seg）；11-26 作者定「没统一的都统一」，改成和向导一样（选中框一律滑） */
  .seg { position: relative; display: flex; gap: 2px; padding: 3px; height: 32px; box-sizing: border-box; border-radius: var(--r-full); background: var(--field); border: 1px solid var(--border); }
  .seg .sgl { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: var(--r-full); background: var(--accent-subtle); pointer-events: none;
              transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
  .seg button { position: relative; z-index: 1; border: 0; background: none; height: 24px; padding: 0 12px; border-radius: var(--r-full); font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: var(--accent-text); }
  .seg .ico { width: 14px; height: 14px; }

  /* 上面三张大卡 */
  .live { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 36px; }
  .lc { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--elev-1); padding: 18px; display: flex; flex-direction: column; gap: 16px; min-height: 196px; }
  .lc .top { display: flex; align-items: center; gap: 12px; }
  .lc .nm { font-size: 15px; font-weight: 600; line-height: 22px; }
  .meta { font-size: 12px; color: var(--muted); }
  .st { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--success-text); white-space: nowrap; }
  .st i { width: 8px; height: 8px; border-radius: 2px; background: var(--success); box-shadow: 0 0 0 3px var(--success-subtle); }
  .st.warm { color: var(--warning-text); } .st.warm i { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-subtle); }
  .st.off { color: var(--faint); } .st.off i { background: var(--faint); box-shadow: none; }
  .lc .big { display: flex; align-items: baseline; gap: 22px; }
  .lc .big .v { font-size: 22px; font-weight: 600; font-family: var(--mono); letter-spacing: -.02em; }
  .lc .big .v small { font-size: 13px; color: var(--faint); font-weight: 400; }
  .lc .big .k { font-size: 12px; color: var(--muted); }
  .addr { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; color: var(--text); padding: 4px 10px; border-radius: var(--r-full); background: var(--surface-2); }
  .addr .ico { color: var(--faint); width: 14px; height: 14px; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 62%; background: var(--warning); border-radius: 3px; }
  .lc .acts { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--r-full); font-size: 13px; font-weight: 500;
         background: var(--control); color: var(--text); border: 1px solid var(--border); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.go { background: var(--accent-subtle); color: var(--accent-text); border-color: transparent; }
  .lc .acts .more { margin-left: auto; }

  /* 大卡第四版：A 的三格数字 + C 的核心色封面（作者 11-25 选的） */
  .lc { padding: 0; gap: 0; overflow: hidden; position: relative; }
  .lc .cover { height: 58px; position: relative; background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
  .lc .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .lc .cover .st { position: absolute; top: 10px; left: 12px; margin: 0; z-index: 1; padding: 3px 10px 3px 8px; border-radius: var(--r-full); backdrop-filter: blur(6px);
                   background: color-mix(in srgb, var(--surface) 70%, transparent); }
  .lc .cover .st i { box-shadow: none; }
  .lc .cover .pin { position: absolute; top: 6px; right: 8px; z-index: 1; }
  .lc .dhead { display: flex; align-items: flex-end; gap: 12px; padding: 0 18px; margin-top: -22px; position: relative; z-index: 2; }
  .lc .dhead .px-avatar { box-shadow: 0 0 0 4px var(--surface); }
  .lc .inner { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats > div { padding: 8px 10px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .stats .k { font-size: 11.5px; color: var(--muted); }
  .stats .v { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 28px; display: flex; align-items: center; gap: 6px; }
  .stats .v small { font-size: 12px; color: var(--faint); font-weight: 400; }
  .stats .v .ico { color: var(--faint); width: 14px; height: 14px; }
  .steps { display: flex; gap: 6px; font-size: 11.5px; color: var(--faint); }
  .steps b { color: var(--warning-text); font-weight: 500; }

  /* 第五版（作者 11-25 的意见）：三种状态一样高；状态挪到右下角；只留两格数字，在线人数绿色；
     卡上一个复制连接地址的图标；停止用危险色，醒目一点；「···」和星标一起放在封面右上角 */
  .lc { height: 228px; min-height: 0; }
  .lc .cover .tools { position: absolute; top: 6px; right: 8px; z-index: 1; display: flex; gap: 2px; }
  .lc .cover .tools .pin, .lc .cover .tools .mini { position: static; }
  .mini { width: 28px; height: 28px; border-radius: var(--r-full); display: grid; place-items: center; color: var(--muted);
          background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .mini:hover { color: var(--text); }
  .lc .cover .pin:not(.on) { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .stats { grid-template-columns: repeat(2, 1fr); height: 62px; }
  .stats .v.ok { color: var(--success-text); }
  .boot { height: 62px; padding: 9px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .lc .acts { margin-top: 0; }
  .btn.stop { background: var(--danger-subtle); color: var(--danger-text); border-color: transparent; }
  .btn.ic { width: 32px; padding: 0; justify-content: center; }
  .lc .stbr { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .lc .stbr i { width: 7px; height: 7px; border-radius: 2px; }
  .stbr.ok { color: var(--success-text); } .stbr.ok i { background: var(--success); box-shadow: 0 0 0 3px var(--success-subtle); }
  .stbr.warm { color: var(--warning-text); } .stbr.warm i { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-subtle); }
  .stbr.off { color: var(--faint); } .stbr.off i { background: var(--faint); }

  /* 第七版：同心圆角。卡片外圆角 R、内边距 p，贴着卡片边的东西圆角一律 R − p，圆弧和卡片的圆弧同一个圆心。
     R = 26、p = 8：封面、数字面板圆角 18；底下一排按钮高 36，胶囊圆角正好 18；封面里的两个圆按钮直径 30、离封面边 3，
     半径 15 + 3 = 18，又和封面同心。?guides=1 打开辅助线看圆心。 */
  .lc { --R: 26px; --p: 8px; --ri: calc(var(--R) - var(--p)); border-radius: var(--R); padding: var(--p); height: auto; }
  .lc .cover { height: 64px; border-radius: var(--ri); overflow: hidden; }
  .lc .cover .tools { top: 3px; right: 3px; gap: 2px; }
  .lc .cover .pin, .lc .cover .mini { width: 30px; height: 30px; background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .lc .dhead { padding: 0 10px; margin-top: -24px; }
  .lc .dhead .px-avatar { width: 52px; height: 52px; box-shadow: 0 0 0 4px var(--surface); }
  .lc .dhead .px-avatar svg { width: 34px; height: 34px; }
  .lc .inner { padding: 10px 0 0; gap: 8px; }
  .stats { gap: 0; height: 60px; border-radius: var(--ri); background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .stats > div { background: none; border-radius: 0; padding: 9px 14px; }
  .stats > div + div { border-left: 1px solid var(--border); }
  .boot { height: 60px; border-radius: var(--ri); padding: 0 14px; }
  .lc .btn { height: 36px; border-radius: calc(36px / 2); padding: 0 14px; white-space: nowrap; flex: none; }
  .lc .btn.ic { width: 36px; padding: 0; }
  .lc .stbr { height: 36px; padding: 0 14px; border-radius: 18px; }
  .stbr.ok { background: var(--success-subtle); } .stbr.warm { background: var(--warning-subtle); } .stbr.off { background: var(--surface-2); }
  .stbr i { box-shadow: none !important; }

  /* 小块也同心：外圆角 20、内边距 8，头像和按钮圆角 12 */
  .rc { --R: 20px; --p: 8px; border-radius: var(--R); padding: var(--p) 10px var(--p) var(--p); gap: 12px; }
  .rc .px-avatar.sm { width: 38px; height: 38px; border-radius: calc(var(--R) - var(--p)); }
  .rc .px-avatar.sm svg { width: 32px; height: 32px; }
  .rc .play { width: 38px; height: 38px; border-radius: calc(var(--R) - var(--p)); margin-right: -2px; }

  /* 第八版：头像和名字放进封面条（封面高 60，头像 44 离封面边 8，圆角 18 − 8 = 10，和封面同心；右边星标和「···」
     合成一块同样 44 高、圆角 10 的工具块）；底下一排改成 控制台、状态 | 停止或启动、链接；进度条的轨道看得见 */
  .lc .cover { height: 60px; padding: 8px; display: flex; align-items: center; gap: 12px; }
  .lc .cover > * { position: relative; z-index: 1; }
  .lc .cover .px-avatar { width: 44px; height: 44px; border-radius: calc(var(--ri) - 8px); box-shadow: inset 0 1px 0 rgb(255 255 255 / .08); }
  .lc .cover .px-avatar svg { width: 32px; height: 32px; }
  /* 服务器自己的图标（server-icon.png，64×64）铺满瓦片，不要核心色底；16 格的核心头像按 32 显示才锐利（11-26 定） */
  .px-avatar.icon { background: #000; overflow: hidden; } .px-avatar.icon svg { width: 100% !important; height: 100% !important; }
  .lc .cover .title { min-width: 0; flex: 1; }
  .lc .cover .title .meta { color: color-mix(in srgb, var(--text) 70%, transparent); }
  .lc .cover .tools { position: relative; top: auto; right: auto; height: 44px; padding: 0 6px; gap: 0; align-items: center; border-radius: calc(var(--ri) - 8px);
                      background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .lc .cover .tools .pin, .lc .cover .tools .mini { width: 30px; height: 30px; background: none; }
  .lc .inner { padding-top: var(--p); }
  /* 第九版：中间不留空，控制台、状态、停止（启动）三个等宽铺满，链接固定 36 的圆贴在右下角 */
  .lc .acts .sp { display: none; }
  .lc .acts > :not(.ic) { flex: 1 1 0; min-width: 0; justify-content: center; margin-left: 0; }
  .lc .acts .stbr { border: 1px solid transparent; }
  .bar { background: color-mix(in srgb, var(--text) 14%, transparent); }

  /* 辅助线：把贴边元素的圆角补成整圆，看是不是和卡片的圆角同心 */
  body.guides .lc { outline: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); }
  body.guides .lc .cover, body.guides .stats, body.guides .boot, body.guides .lc .btn, body.guides .lc .stbr { outline: 1px dashed var(--accent); outline-offset: 0; }
  body.guides .lc::before, body.guides .lc::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; z-index: 5; }
  body.guides .lc::before { left: 0; bottom: 0; width: calc(var(--R) * 2); height: calc(var(--R) * 2); border: 1px dashed var(--danger); }
  body.guides .lc::after { left: var(--p); bottom: var(--p); width: calc(var(--ri) * 2); height: calc(var(--ri) * 2); border: 1px dashed var(--danger); }

  /* 星标（置顶）：一直显示，没钉的是空心灰星，钉住的是实心黄星（第六版：作者不要悬停才出现） */
  .pin { width: 28px; height: 28px; border-radius: var(--r-full); border: 0; background: none; display: grid; place-items: center; color: var(--faint); cursor: pointer; flex: none; }
  .pin.on { color: var(--warning); }
  .pin:hover { background: var(--hover); color: var(--warning); }

  /* 其余的小块 */
  .rest { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .rc { display: flex; align-items: center; background: color-mix(in srgb, var(--surface) 55%, var(--bg)); } /* 圆角和内边距用上面「小块也同心」那条（外 20、内边距 8）：以前这条写在后面把它盖掉了 */
  .rc:hover { background: var(--surface); box-shadow: var(--elev-1); }
  .rc .nm { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc .meta { color: var(--faint); }
  .rc .nm { line-height: 20px; } .rc .meta { line-height: 18px; } /* 两行字 38 高，和头像、启动键一样，小块正好 54 */
  .rc .meta.on { color: var(--success-text); display: flex; align-items: center; gap: 6px; }
  .rc .meta.on i { width: 6px; height: 6px; border-radius: 2px; background: var(--success); }
  .rc > div { min-width: 0; flex: 1; }
  .rc .play { width: 32px; height: 32px; border-radius: var(--r-full); display: grid; place-items: center; color: var(--accent-text); background: var(--accent-subtle); flex: none; }
  .rc .play.stop { color: var(--muted); background: var(--surface-2); }

  /* 像素头像（照 app.css 的 .px-avatar） */
  .px-avatar { --c: #7a8aa0; width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: var(--r-md);
               background: color-mix(in srgb, var(--c) 26%, var(--surface)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
  .px-avatar svg { width: 24px; height: 24px; display: block; }
  .px-avatar.lg { width: 48px; height: 48px; } .px-avatar.lg svg { width: 32px; height: 32px; }
  .px-avatar.sm { width: 34px; height: 34px; border-radius: var(--r-sm); } .px-avatar.sm svg { width: 22px; height: 22px; }

  /* 悬浮胶囊导航 */
  .cap { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 2px; padding: 5px;
         border-radius: var(--r-full); background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2);
         border: 1px solid var(--border); box-shadow: var(--elev-3); }
  .cap a { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-full); color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .cap a:hover { color: var(--text); background: var(--hover); }
  .cap a.on { color: var(--accent-text); background: var(--accent-subtle); }
  .cap a.home { padding: 0 12px; }
  .cap a.home img { width: 20px; height: 20px; image-rendering: pixelated; }
  .cap .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .cap a.ai { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
  .cap a.ai .ico { color: var(--accent-text); }
  .cap a.ai:hover { background: var(--control-hov); }
  .cap a.new { background: var(--accent-solid); color: var(--on-accent); margin-left: 4px; }
  .cap a.new:hover { background: var(--accent-solid-hov); }

  /* 胶囊只放图标（作者 11-26）：每个都是 40 的圆，字收进悬停提示和读屏名称里；提示在胶囊上方弹出 */
  .cap { gap: 4px; }
  .cap a { width: 40px; padding: 0; justify-content: center; position: relative; }
  .cap a .ico { width: 18px; height: 18px; }
  .cap a.home { padding: 0; }
  /* 作者 11-26：所有图标间距一样（不再有分隔线），AI 助手在设置里能关，新建固定在最右 */
  body.no-ai .cap a.ai { display: none; }
  .cap a.new { margin-left: 0; }
  /* 进新建向导时胶囊往下沉出屏幕；从向导回来时从下面浮上来 */
  .cap { transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s; }
  body.leaving .cap, body.entering .cap { transform: translate(-50%, 160%); opacity: 0; }
  .cap a[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px);
    padding: 5px 10px; border-radius: var(--r-sm); background: var(--overlay); border: 1px solid var(--border); box-shadow: var(--elev-2);
    color: var(--text); font-size: 12px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; }
  .cap a[data-tip]:hover::after, .cap a[data-tip]:focus-visible::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.nav-top .cap a[data-tip]::after { bottom: auto; top: calc(100% + 10px); }

  body.nav-top .cap a { height: 30px; width: 30px; font-size: 12.5px; }

  body.nav-top .page { padding-bottom: 60px; }

  /* 页头的几种写法（11-26 作者觉得「服务器」大标题 + 一行小字 + 最右边的搜索框太突兀）：?head=0 是原来的、a / b / c / d；作者定了 D，不带参数就是 D */
  .hv { display: none; }

  body:not(.head-0) .head { display: none; }
  .iconbtn { width: 36px; height: 36px; flex: none; border-radius: var(--r-full); display: grid; place-items: center; color: var(--muted);
             background: var(--control); border: 1px solid var(--border); }
  /* A：标题换成一句有用的话，搜索收成一个圆钮 */
  .ha { align-items: center; gap: 16px; margin-bottom: 26px; }
  .ha .line { font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; }
  .ha .line .ok { color: var(--success-text); }
  .ha .line .mut { color: var(--muted); font-weight: 500; }
  .ha .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ha .sp { flex: 1; }
  /* B：统计和搜索装进一条和卡片同款的圆角条（外圆角 20、内边距 8，里面的块圆角 12，同心） */
  .hb { align-items: center; gap: 8px; padding: 8px; border-radius: 20px; background: var(--surface); box-shadow: var(--elev-1); margin-bottom: 28px; }
  .hb .chip { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 12px; font-size: 13px; color: var(--muted);
              background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .hb .chip b { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: -.02em; }
  .hb .chip.ok b { color: var(--success-text); }
  .hb .chip .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--success); }
  .hb .sp { flex: 1; }
  .hb .find { display: flex; align-items: center; gap: 8px; width: 300px; height: 40px; padding: 0 14px; border-radius: 12px;
              background: var(--field); border: 1px solid var(--border); color: var(--faint); font-size: 13px; }
  /* 搜索框里原来常显一个「Ctrl F」键帽：11-26 作者定数字键不要、快捷键提示不常显，Ctrl+F、Ctrl+K、Ctrl+N 这几个程序里本来没有的也不做，都拿掉了 */
  /* C：页头整个拿掉。统计挪到标题栏左边（MineDeck 后面一行小字），搜索放进标题栏正中，页面一上来就是卡片 */
  .tb-stats, .tb-search { display: none; }
  body.head-c .tb-stats { display: flex; align-items: center; gap: 10px; margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--border);
                          height: 16px; font-size: 12px; color: var(--muted); }
  body.head-c .tb-stats b { color: var(--text); font-weight: 600; }
  body.head-c .tb-stats .dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--success); margin-right: 5px; vertical-align: 1px; }
  body.head-c .tb-search { display: flex; position: absolute; left: 50%; top: 7px; transform: translateX(-50%); width: 360px; height: 30px; align-items: center; gap: 8px;
                           padding: 0 12px; border-radius: var(--r-full); background: color-mix(in srgb, var(--text) 6%, var(--bg)); border: 1px solid var(--border);
                           color: var(--faint); font-size: 12.5px; }
  body.head-c .page { padding-top: 12px; }
  /* D（作者 11-26 的主意）：上半截一个块状的像素字标 MineDeck，下面紧跟 B 的概览条；标题栏里的 MineDeck 字就不要了，只留小图标 */
  /* 第二版（作者：概览条不用那么长、字再大一点、上面多留白）：字每格 7 像素，上面留 40；概览条不再铺满，跟着内容的宽度、在字底下居中 */
  .hd { flex-direction: column; align-items: center; gap: 36px; margin: 32px 0 24px; } /* 基准 1280×800 下排得下的上限：字上面 84（含标题栏 40），字和概览条之间 36 */
  .hd .mark svg { display: block; }
  /* 赞赏（作者 11-26：「minedeck 的右边能不能加一个间隔几秒钟跳动一下的赞赏 Icon」）：一颗和字标同样画法的像素心（wordmark.js 的「♥」），
     贴在字标右边、隔两格；绝对定位，不占字标的位置，字标照旧居中。每 4.2 秒跳一下：先高跳 9 像素、落地再小跳 3 像素，快起慢停；
     悬停不跳、往上抬 2 像素，悬停提示「赞赏」。点了打开什么还没定。「减少动态」时不跳 */
  .hd .mark { position: relative; }
  .hd .mark .tipme { position: absolute; left: 100%; top: 0; margin-left: 10px; padding: 0; border: 0; background: none; cursor: pointer;
                     animation: tipme-hop 4.2s infinite; transition: transform .2s cubic-bezier(.3, .7, .2, 1); }
  .hd .mark .tipme:hover { animation: none; transform: translateY(-2px); }
  @keyframes tipme-hop {
    0%, 84% { transform: none; animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
    88% { transform: translateY(-9px); animation-timing-function: cubic-bezier(.5, 0, .8, .3); }
    92% { transform: none; animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
    95% { transform: translateY(-3px); animation-timing-function: cubic-bezier(.5, 0, .8, .3); }
    98%, 100% { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .hd .mark .tipme { animation: none; } }
  /* 设置里关掉「爱心跳动」时（作者 11-26：设置里能让爱心不再跳）：草图用 ?hop=0 看 */
  body.no-hop .hd .mark .tipme { animation: none; }
  /* 赞赏的外挂标签（作者 11-26：像素心看着不明显，画个标签、用弯曲的虚线指向爱心，提示点击赞赏，带个 × 方便关掉）：
     心的右上方一个「点击赞赏」的小标签，一条弯的虚线带箭头指向心的右上；标签 28 高胶囊，× 是 20 的圆、离标签外沿 4（14 − 4 = 10，同心）。
     虚线和箭头用 SVG 画，位置按心和标签量出来，心跳的时候箭头指着心落地的位置。点 × 标签和虚线一起淡掉；
     程序里关了就记住、以后不再出（草图刷新又会出来）。标签自己不动，动的只有心 */
  .tipcall { position: absolute; z-index: 1; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 3px 0 12px; border-radius: 14px;
             background: var(--overlay); border: 1px solid var(--border); box-shadow: var(--elev-2); color: var(--text); font-size: 12.5px; font-weight: 500;
             white-space: nowrap; transition: opacity .16s, transform .16s; }
  .tipcall .x { width: 20px; height: 20px; border-radius: 10px; border: 0; padding: 0; background: none; color: var(--muted); display: grid; place-items: center;
                cursor: pointer; transition: background .15s, color .15s; }
  .tipcall .x:hover { background: var(--hover); color: var(--text); }
  .tipcall .x .ico { width: 12px; height: 12px; }
  .tipline { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; color: var(--muted); transition: opacity .16s; }
  .tipline path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .tipline .tl { stroke-dasharray: 3.5 4.5; }
  .tipcall.gone { opacity: 0; transform: translateY(-4px); pointer-events: none; }
  .tipline.gone { opacity: 0; }
  /* 字标上面那颗提示胶囊（?notices=1）点开的浮层盖住了心，虚线会从浮层右边漏出一截：浮层开着时标签和虚线先淡掉，收起再出来 */
  body:has(.ntc.open) .tipcall, body:has(.ntc.open) .tipline { opacity: 0; pointer-events: none; }
  body:has(.spm:not([hidden])) .tipcall, body:has(.spm:not([hidden])) .tipline { opacity: 0; pointer-events: none; }
  /* ---- 点爱心（或「点击赞赏」那个标签）弹出的赞赏浮层（作者 11-26）----
     照共用件 commons.html 的弹窗：遮罩从标题栏下面盖到底，面板在剩下那块的正中；大面板 26 / 8 加两栏（18），栏里的按钮圆角 10、离栏边 8（同心）。
     第一版把收款码缩小了直接摆着，作者看了说太丑，改成按钮加两家的线条图标：上面一行两个圆角正方形（支付宝、微信），大图标加名字；
     下面一行是支付宝的固定金额，圆角矩形，支付宝小图标加金额，按金额从小到大。第二版上面两个铺满、各 190 见方，下面一排 40 高、放不下要左右滑，
     作者说上面太大、下面太小，弹窗放宽一点让五个都放得下、不用滑：现在面板 544 宽，上面两个 136 见方、居中，下面五个等分一排、52 高（同规范里 52 高的条）。
     点哪个都弹一层看那张收款码的原图（按窗口放到最大），从按钮那里放大出来、关掉时缩回去；Esc 一次关一层。
     图是作者本人的收款码，只放在本机（QR_code/，.gitignore 了）；别的机器上打开没有图，大图那层换成文件名占位 */
  :root { --elev-4: 0 28px 64px -16px rgb(var(--shadow-rgb) / .32), 0 8px 20px -4px rgb(var(--shadow-rgb) / .10); --scrim: rgb(var(--shadow-rgb) / .32); }
  [data-theme="dark"] { --elev-4: 0 32px 72px -16px rgb(0 0 0 / .72), 0 8px 24px -4px rgb(0 0 0 / .40); --scrim: rgb(0 0 0 / .56); }
  .spm, .spz { position: fixed; left: 0; right: 0; top: 40px; bottom: 0; z-index: 40; display: grid; place-items: center; background: var(--scrim); }
  .spm { backdrop-filter: blur(2px); }
  .spm[hidden] { display: none; }
  .spm.enter { animation: sp-fade-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  .spm.enter > .spp { animation: sp-rise .26s cubic-bezier(.2, .7, .2, 1) both; }
  .spm.leave { animation: sp-fade-out .14s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
  .spm.leave > .spp { animation: sp-sink .14s cubic-bezier(.4, 0, 1, 1) both; }
  @keyframes sp-fade-in { from { opacity: 0; } }
  @keyframes sp-fade-out { to { opacity: 0; } }
  @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes sp-sink { to { opacity: 0; transform: translateY(6px); } }
  .spp { width: 544px; box-sizing: border-box; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-4); display: flex; flex-direction: column; gap: 8px; }
  .spp .spc { border-radius: 18px; padding: 8px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .spp .sph { display: flex; align-items: center; height: 28px; padding-left: 10px; }
  .spp .sph h3 { flex: 1; margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; }
  .spp .sph .x { width: 28px; height: 28px; border-radius: 10px; border: 0; padding: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
  .spp .sph .x:hover { background: var(--hover); color: var(--text); }
  .spp .sph .x .ico { width: 14px; height: 14px; }
  .spp .row1 { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
  /* 按钮的底和提示浮层里的行一样：半透明的面板底，圆角 10（离栏边 8，18 − 8） */
  .qb, .qa { border: 0; padding: 0; border-radius: 10px; font: inherit; color: var(--text); cursor: pointer; outline: none;
             background: color-mix(in srgb, var(--surface) 55%, transparent); transition: background .15s; }
  .qb:hover, .qa:hover { background: linear-gradient(var(--hover), var(--hover)), color-mix(in srgb, var(--surface) 55%, transparent); }
  .qb:focus-visible, .qa:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  /* 上面两个：136 见方的圆角正方形，正中一个大的线条图标（40；线宽按 16 的图标折算，看上去和小图标差不多细）加名字 */
  .qb { width: 136px; height: 136px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 14px; font-weight: 600; }
  .qb .ico { width: 40px; height: 40px; stroke-width: .6; }
  /* 下面一排：52 高的圆角矩形（同规范里 52 高的条），支付宝小图标加金额，几个就等分几份 */
  .sprow { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .qa { height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .qa .ico { width: 18px; height: 18px; stroke-width: 1.15; }
  /* 两家的图标用各自的品牌色（同核心头像的固定色，不跟主题走），一眼认得出是哪家 */
  .ic-ali { color: #1677ff; } .ic-wx { color: #07c160; }
  .qph { box-sizing: border-box; border: 1px dashed var(--border); display: grid; place-items: center; padding: 6px; font: 12px/1.5 var(--mono); color: var(--faint); text-align: center; word-break: break-all;
         background: var(--surface); }
  /* 看大图那一层：叠在浮层上面，再盖一层遮罩；点哪儿都关（或者 Esc、右上角 ×） */
  .spz { z-index: 50; cursor: zoom-out; }
  .spz.leave { pointer-events: none; }
  .spz .zimg { display: block; border-radius: 18px; box-shadow: var(--elev-4); transform-origin: 0 0; -webkit-user-drag: none; user-select: none; }
  .spz .x { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 18px; padding: 0; display: grid; place-items: center; cursor: pointer;
    color: var(--text); background: color-mix(in srgb, var(--overlay) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--border); box-shadow: var(--elev-3); }
  .spz .x .ico { width: 16px; height: 16px; }
  .tipcall { cursor: pointer; } /* 标签本身也能点开赞赏（× 除外） */
  .hd .hb { display: flex; width: auto; margin: 0; }
  .hd .hb .sp { flex: 0 0 4px; }
  .hd .hb .find { width: 240px; }
  body.head-d .tb .brand { font-size: 0; }
  body.head-d.mark-left .hd { align-items: flex-start; }
  /* 收藏超过 3 台（作者 11-26 的主意）：上面一排变成能左右滑的一条，两边渐隐。滑动的那条往两边各伸进页边 40 像素，
     三张卡照样是原来的宽度、不被渐隐盖住，渐隐只落在页边里露出来的半张邻卡上；滑到头那一边就不再渐隐、也没有箭头 */
  @property --fl { syntax: "<length>"; inherits: false; initial-value: 0px; }
  @property --fr { syntax: "<length>"; inherits: false; initial-value: 0px; }
  .car { position: relative; margin-bottom: 24px; }
  .car .track { margin-bottom: 0; }
  .car.scroll .track { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
    scroll-behavior: smooth;
    margin: -8px -40px -14px; padding: 8px 40px 14px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
    transition: --fl .2s ease, --fr .2s ease; }
  .car.scroll .track::-webkit-scrollbar { display: none; }
  .car.scroll .live { display: flex; gap: 16px; }
  .car.scroll .live > .lc { flex: 0 0 calc((100% - 32px) / 3); }
  /* 无极滑动（作者 11-26：不要吸附）：拖动和松手后的惯性都是一像素一像素地走，不对齐到整张卡 */
  .car.scroll .track.dragging { scroll-behavior: auto; cursor: grabbing; user-select: none; }
  /* 悬停时不换成手形（作者 11-26：鼠标移上去就是拖动的手、还没按住，像是和点卡片冲突）：平时是普通箭头，按住真拖起来（移动超过 4 像素）才变成抓住的手 */
  .car.scroll .track.dragging * { cursor: grabbing !important; }
  .car.can-left .track { --fl: 40px; } .car.can-right .track { --fr: 40px; }
  /* 「其他」（作者 11-26）：最多两行，一列一列往右排（第一列上 1 下 2，第二列上 3 下 4……），一屏四列，多了同样左右无极滑 */
  .car.scroll .rest { display: grid; grid-template-columns: none; grid-template-rows: repeat(2, auto); grid-auto-flow: column; grid-auto-columns: calc((100% - 36px) / 4); gap: 12px; }
  .rest-car { margin-bottom: 0; }
  .car-nav { position: absolute; top: 50%; z-index: 3; width: 36px; height: 36px; border-radius: 50%; display: none; place-items: center; padding: 0;
    transform: translateY(-50%); color: var(--text); cursor: pointer; opacity: 0; transition: opacity .15s;
    background: color-mix(in srgb, var(--overlay) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--border); box-shadow: var(--elev-3); }
  .car-nav.prev { left: -18px; } .car-nav.prev .ico { transform: rotate(180deg); }
  .car-nav.next { right: -18px; }
  .car.can-left .car-nav.prev, .car.can-right .car-nav.next { display: grid; }
  .car:hover .car-nav { opacity: 1; }
  /* 空首页（?empty=1，作者 11-26）：只有字标（比有服务器时大两档，每格 7）和一行小字，在胶囊上面的空间里居中再往上提一点 */
  .hero { display: none; }
  body.empty .page > :not(.hero) { display: none; }
  body.empty .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    min-height: calc(100vh - 40px - 12px - 86px); padding-bottom: 9vh; box-sizing: border-box; }
  /* 作者 11-26：上面加应用图标（16 格的图标按每格 7 像素放大，和字标同一个像素大小）；＋ 小一点、跟着字走；「探索一下本应用？」只是逗一下，不是链接 */
  .hero .hero-logo { width: 112px; height: 112px; image-rendering: pixelated; margin-bottom: -4px; }
  .hero p { margin: 0; font-size: 14px; line-height: 22px; color: var(--muted); text-align: center; }
  .hero .plus { width: 18px; height: 18px; margin: 0 5px; border-radius: 50%; display: inline-grid; place-items: center; vertical-align: -3px;
                background: var(--accent-solid); color: var(--on-accent); cursor: pointer; }
  .hero .plus .ico { width: 12px; height: 12px; }
  /* 对比页里嵌着看时不要胶囊和角落的说明 */
  body.embed .cap, body.embed .tip { display: none; }
  html:has(body.embed), body.embed { overflow: hidden; }

  .tip { position: fixed; left: 12px; bottom: 12px; max-width: 230px; font-size: 11.5px; line-height: 18px; color: var(--faint); }
  .tip a { color: var(--accent-text); }

let tipClosed = false;
const tipCallHTML = () => tipClosed ? "" : `<svg class="tipline" aria-hidden="true"><path class="tl"/><path class="ta"/></svg>`
  + `<div class="tipcall" role="note">点击赞赏<button class="x" title="不再提示"><i data-ic="x"></i></button></div>`;
// 量出心和标签的位置，画虚线：从标签左边中间出发，往左下弯过去，箭头落在心右上那一瓣旁边
function placeTipCall() {
  const mk = document.getElementById("hd-mark"), heart = mk.querySelector(".tipme"), call = mk.querySelector(".tipcall"), svg = mk.querySelector(".tipline");
  if (!heart || !call || !svg) return;
  const m = mk.getBoundingClientRect(), h = heart.getBoundingClientRect();
  const ht = h.top - m.top, hr = h.right - m.left;
  const cl = Math.round(hr + 64), ct = Math.round(ht - 18);
  call.style.left = cl + "px"; call.style.top = ct + "px";
  const cw = call.offsetWidth, ch = call.offsetHeight;
  const x0 = cl - 6, y0 = ct + ch / 2, x1 = Math.round(hr + 2), y1 = Math.round(ht + h.height * 0.36);
  svg.setAttribute("width", cl + cw); svg.setAttribute("height", Math.ceil(Math.max(ht + h.height, ct + ch)));
  const c2x = x1 + 30, c2y = y1 - 26;
  svg.querySelector(".tl").setAttribute("d", `M${x0} ${y0} C${x0 - 26} ${y0 + 2} ${c2x} ${c2y} ${x1} ${y1}`);
  // 箭头顺着曲线末端的方向，左右各一笔
  const L = Math.hypot(x1 - c2x, y1 - c2y), ux = (x1 - c2x) / L, uy = (y1 - c2y) / L, len = 7;
  const wing = a => [x1 - len * (ux * Math.cos(a) - uy * Math.sin(a)), y1 - len * (uy * Math.cos(a) + ux * Math.sin(a))].map(v => v.toFixed(1));
  const [l1, l2] = [wing(.5), wing(-.5)];
  svg.querySelector(".ta").setAttribute("d", `M${l1[0]} ${l1[1]} L${x1} ${y1} L${l2[0]} ${l2[1]}`);
}

});

  const dups = NT.dups.length ? `<div class="ncol"><h3>因重名没有列出来<span class="n">${NT.dups.length}</span><span class="ib" title="要两台都显示出来，改掉其中一台的名字：打开没列出来的那个文件夹里的 instance.json，把 &quot;name&quot; 改成别的名字后重开 MineDeck；\n或者先把列表里这台移出列表，再用别的名字接管回来，然后重开 MineDeck。"><i data-ic="info"></i></span></h3>`
    + NT.dups.map(d => `<div class="nrow"><div class="m"><div class="t mono">${ntEsc(d.dir)}</div><div class="s">和「${ntEsc(d.name)}」重名（<span class="mono">${ntEsc(d.kept)}</span>）</div></div></div>`).join("") + `</div>` : "";
  return `<div class="lwrap"><div class="list">${tasks}${left}${dups}</div><i class="thumb"></i></div>`;
}
// 细滚动条：照 wizard.html 的 scrollbar()（跟着列表算长短和位置，能拖；上下有没看到的就渐隐）
function thinBar(w) {
  const l = w.querySelector(".list"), t = w.querySelector(".thumb");
  const paint = () => {
    const ch = l.clientHeight, sh = l.scrollHeight, st = l.scrollTop;
    w.classList.toggle("fits", sh <= ch + 1); w.classList.toggle("can-up", st > 2); w.classList.toggle("can-down", st + ch < sh - 2);
    const h = Math.max(28, ch * ch / sh);
    t.style.height = h + "px"; t.style.top = (sh > ch ? st / (sh - ch) * (ch - h) : 0) + "px";
  };
  if (w._paint) { w._paint(); return; }
  w._paint = paint;
  let idle = 0;
  l.addEventListener("scroll", () => { paint(); w.classList.add("scrolling"); clearTimeout(idle); idle = setTimeout(() => w.classList.remove("scrolling"), 700); }, { passive: true });
  t.addEventListener("pointerdown", e => {
    e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add("drag");
    const y0 = e.clientY, s0 = l.scrollTop, ratio = (l.scrollHeight - l.clientHeight) / (l.clientHeight - t.offsetHeight);
    const move = ev => { l.scrollTop = s0 + (ev.clientY - y0) * ratio; };
    const up = () => { t.classList.remove("drag"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); };
    t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
  });
  paint();
}
let ntPill = null, ntPanel = null;
function placePanel() {
  if (!ntPanel || !ntPill) return;
  const r = ntPill.getBoundingClientRect(), top = Math.round(r.bottom + 8);
  ntPanel.style.left = Math.round(r.left + r.width / 2 - ntPanel.offsetWidth / 2) + "px";
  ntPanel.style.top = top + "px";
  ntPanel.style.maxHeight = (innerHeight - top - 86) + "px"; // 底边不压进胶囊（胶囊 52 + 离底 18 + 间隔 16）
  ntPanel.querySelector(".lwrap")._paint?.();
}
function openPanel() {
  if (ntPanel) return closePanel();
  ntPanel = Object.assign(document.createElement("div"), { className: "npanel enter", innerHTML: panelHTML() });
  ntPanel.setAttribute("role", "dialog"); ntPanel.setAttribute("aria-label", "后台任务和要处理的文件夹");
  document.body.appendChild(ntPanel); KIT.hydrate(ntPanel);
  ntPill.classList.add("open"); ntPill.setAttribute("aria-expanded", "true");
  placePanel(); thinBar(ntPanel.querySelector(".lwrap"));
}
function closePanel() {
  const p = ntPanel; if (!p) return;
  ntPanel = null; ntPill.classList.remove("open"); ntPill.setAttribute("aria-expanded", "false");
  p.classList.remove("enter"); p.classList.add("leave"); setTimeout(() => p.remove(), 90);
}
// 收起一条任务（同向导待装清单拿掉一个：往右划 32 像素淡掉，再收起）；它挪进折起来的那一行，那一行的字跟着换
function hideTask(id) {
  const row = ntPanel?.querySelector(`.nrow[data-task="${id}"]`), t = NT.look.find(x => x.id === id); if (!row || !t || row.classList.contains("out")) return;
  row.classList.add("out");
  const h = row.offsetHeight + "px";
  row.animate([
    { opacity: 1, transform: "none", height: h, marginBottom: "0px", easing: "cubic-bezier(.4, 0, 1, 1)" },
    { opacity: 0, transform: "translateX(32px)", height: h, marginBottom: "0px", offset: .55, easing: "cubic-bezier(.2, .7, .2, 1)" },
    { opacity: 0, transform: "translateX(32px)", height: "0px", marginBottom: "-6px", minHeight: "0px", paddingTop: "0px", paddingBottom: "0px" },
  ], { duration: 320, fill: "forwards" }).onfinish = () => { row.remove(); ntPanel?.querySelector(".lwrap")._paint?.(); };
  NT.look = NT.look.filter(x => x !== t); NT.done.unshift({ ...t, tone: "" });
  const f = ntPanel.querySelector("#nt-fold span"), open = ntPanel.querySelector("#nt-fold.open");
  if (f) f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" }).onfinish = () => {
    f.textContent = foldText(); f.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: "cubic-bezier(.2, .7, .2, 1)" }).finished.then(() => f.getAnimations().forEach(a => a.cancel()));
  };
  if (open) { const r = Object.assign(document.createElement("div"), { innerHTML: taskRow(NT.done[0]) }).firstElementChild; ntPanel.querySelector("#nt-fold").after(r); KIT.hydrate(r); }
  ntPill.innerHTML = pillHTML(); KIT.hydrate(ntPill);
}
// 折起来的已结束任务：点开一行一行从下面淡进来（规范第七节「清单加减」），再点收起
function toggleFold(btn) {
  const open = btn.classList.toggle("open"), col = btn.parentElement;
  if (open) {
    const rows = NT.done.map(t => Object.assign(document.createElement("div"), { innerHTML: taskRow(t) }).firstElementChild);
    rows.reverse().forEach(r => btn.after(r)); rows.reverse();
    KIT.hydrate(col);
    rows.forEach((r, i) => {
      r.classList.add("folded");
      r.animate([{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "none" }], { duration: 220, delay: i * 22, easing: "cubic-bezier(.2, .7, .2, 1)", fill: "backwards" });
    });
  } else col.querySelectorAll(".nrow.folded").forEach(r => r.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" }).onfinish = () => { r.remove(); ntPanel?.querySelector(".lwrap")._paint?.(); });
  setTimeout(() => ntPanel?.querySelector(".lwrap")._paint?.(), 0);
}
if (document.body.classList.contains("notices")) KIT_READY.then(() => {
  ntPill = Object.assign(document.createElement("button"), { className: "ntc", innerHTML: pillHTML() });
  ntPill.setAttribute("aria-haspopup", "dialog"); ntPill.setAttribute("aria-expanded", "false");
  document.querySelector(".hd").appendChild(ntPill); KIT.hydrate(ntPill);
  ntPill.addEventListener("click", openPanel);
  document.addEventListener("pointerdown", e => { if (ntPanel && !ntPanel.contains(e.target) && !ntPill.contains(e.target)) closePanel(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
  addEventListener("resize", placePanel);
  document.addEventListener("click", e => {
    if (!ntPanel || !ntPanel.contains(e.target)) return;
    const hd = e.target.closest("[data-hide]"), fold = e.target.closest("#nt-fold"), del = e.target.closest("[data-left]");
    if (hd) hideTask(hd.dataset.hide);
    else if (fold) toggleFold(fold);
    else if (del) { // 草图里不再画一份弹窗：跳到 commons.html 看这个危险确认框（配色这些参数带过去）
      const q = new URLSearchParams(location.search); ["notices", "mode", "enter"].forEach(k => q.delete(k)); q.set("part", "confirm"); q.set("open", "leftover");
      location.href = "commons.html?" + q.toString();
    }
  });
});
</script>
<script>
// ---- 点爱心弹出的赞赏浮层（作者 11-26）：样式那段的注释写了怎么排 ----
// 程序里是读收款码那个文件夹：alipay、wechatpay 是上面两个，其余的文件名就是金额，按数值从小到大排在下面（按字符串排 299 会跑到 33 前面）
const QR_DIR = "QR_code/";
const QR_MAIN = [{ f: "alipay.jpg", t: "支付宝", ic: "alipay", cls: "ic-ali", ar: 2 / 3 }, { f: "wechatpay.png", t: "微信", ic: "wechat", cls: "ic-wx", ar: 1 }];
const QR_AMT = ["520", "33", "9.9", "299", "99"].sort((a, b) => a - b).map(n => ({ f: n + ".jpg", t: n, ar: 2 / 3 }));
const qrBig = q => `<button class="qb" data-qr="${q.f}" data-ar="${q.ar}" title="显示收款码"><i data-ic="${q.ic}" class="${q.cls}"></i>${q.t}</button>`;
const qrAmt = q => `<button class="qa" data-qr="${q.f}" data-ar="${q.ar}" title="显示收款码"><i data-ic="alipay" class="ic-ali"></i>${q.t}</button>`;
let spm = null, spz = null;
const spReduce = matchMedia("(prefers-reduced-motion: reduce)");
function openSponsor() {
  if (!spm) {
    spm = Object.assign(document.createElement("div"), { className: "spm" });
    spm.hidden = true;
    spm.innerHTML = `<div class="spp" role="dialog" aria-label="赞赏">`
      + `<div class="spc"><div class="sph"><h3>赞赏</h3><button class="x" title="关闭"><i data-ic="x"></i></button></div>`
      + `<div class="row1">${QR_MAIN.map(qrBig).join("")}</div></div>`
      + `<div class="spc"><div class="sprow">${QR_AMT.map(qrAmt).join("")}</div></div></div>`;
    document.body.appendChild(spm); KIT.hydrate(spm);
    spm.addEventListener("click", e => {
      if (e.target === spm || e.target.closest(".sph .x")) return closeSponsor();
      const t = e.target.closest("[data-qr]"); if (!t) return;
      if (e.detail > 0) t.blur(); // 鼠标点的不留焦点框（不然按 Esc 关掉大图以后，那个按钮会像被选中了一样亮一圈）；用键盘按的照样留着
      zoomQR(t);
    });
  }
  if (!spm.hidden && !spm.classList.contains("leave")) return;
  clearTimeout(spm._t); spm.classList.remove("leave"); spm.hidden = false;
  spm.classList.remove("enter"); void spm.offsetWidth; spm.classList.add("enter");
}
function closeSponsor() {
  if (!spm || spm.hidden || spm.classList.contains("leave")) return;
  spm.classList.remove("enter"); spm.classList.add("leave");
  spm._t = setTimeout(() => { spm.hidden = true; spm.classList.remove("leave"); }, 140);
}
// 看收款码的原图：按窗口放到最大（上下各留 24，最高 680），从按的那个按钮的正中放大出来；关的时候缩回按钮
function zoomQR(btn) {
  if (spz) return;
  const ar = +btn.dataset.ar, src = QR_DIR + btn.dataset.qr;
  let h = Math.min(680, innerHeight - 40 - 48), w = h * ar;
  if (w > innerWidth - 96) { w = innerWidth - 96; h = w / ar; }
  spz = Object.assign(document.createElement("div"), { className: "spz" });
  spz.innerHTML = `<img class="zimg" src="${src}" alt="收款码" draggable="false" style="width:${Math.round(w)}px;height:${Math.round(h)}px">`
    + `<button class="x" title="关闭"><i data-ic="x"></i></button>`;
  // 别的机器上没有这些图（只在作者本机，.gitignore 了）：换成同样大小的文件名占位，不显示破图
  spz.querySelector("img").onerror = e => {
    const ph = Object.assign(document.createElement("div"), { className: "qph zimg", textContent: src });
    ph.style.cssText = e.target.style.cssText; e.target.replaceWith(ph);
  };
  document.body.appendChild(spz); KIT.hydrate(spz);
  const big = spz.querySelector(".zimg"), b = big.getBoundingClientRect();
  // 按钮和图的长宽比不一样：按能装进按钮的大小起步，正中对着按钮的正中
  spz._at = () => {
    const r = btn.getBoundingClientRect(), k = Math.min(r.width / b.width, r.height / b.height);
    return `translate(${r.left + r.width / 2 - k * b.width / 2 - b.left}px, ${r.top + r.height / 2 - k * b.height / 2 - b.top}px) scale(${k})`;
  };
  if (!spReduce.matches) {
    const bg = getComputedStyle(spz).backgroundColor; // 遮罩淡进来
    spz.animate([{ backgroundColor: "transparent" }, { backgroundColor: bg }], { duration: 220, easing: "cubic-bezier(.2, .7, .2, 1)" });
    big.animate([{ transform: spz._at() }, { transform: "none" }], { duration: 320, easing: "cubic-bezier(.3, .7, .2, 1)" });
    big.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 140, easing: "linear" });
  }
  spz.addEventListener("click", closeZoom);
}
function closeZoom() {
  const z = spz; if (!z || z.classList.contains("leave")) return;
  z.classList.add("leave");
  const done = () => { z.remove(); if (spz === z) spz = null; };
  if (spReduce.matches) return done();
  const big = z.querySelector(".zimg"), ease = "cubic-bezier(.4, 0, .2, 1)";
  z.animate([{ backgroundColor: getComputedStyle(z).backgroundColor }, { backgroundColor: "transparent" }], { duration: 220, easing: ease, fill: "forwards" });
  z.querySelector(".x").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: "forwards" });
  big.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, delay: 100, fill: "forwards" });
  big.animate([{ transform: "none" }, { transform: z._at() }], { duration: 220, easing: ease, fill: "forwards" }).onfinish = done;
}
// 点心、或者点「点击赞赏」那个标签（× 除外）都打开
document.addEventListener("click", e => {
  if (e.target.closest(".tipcall .x")) return;
  if (e.target.closest(".hd .mark .tipme, .tipcall")) openSponsor();
});
// Esc 一次关一层：先关大图，再关浮层
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (spz) closeZoom(); else closeSponsor();
});
</script>
