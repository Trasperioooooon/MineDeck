<!--
  后台任务 / 点「创建服务器」以后的进度页（11-27 夜里，子代理照临时规范画的第一稿，作者醒来逐页看）。样式 task.css（前缀 tk2-），脚本 task.js。
  程序现在的样子：internal/web/ui/app.js renderTaskPage（约 3308 行）和 TASK_KINDS（约 2999 行），没装上的文件是 pendingPanel（约 3100 行）；
  后端 internal/tasks/tasks.go（步骤、日志、进度、下载慢、告警、待决文件、取消），各种任务的步骤名在 inst/install.go、inst/adopt.go、inst/import.go、inst/import_server.go、
  transfer/export.go、transfer/import.go、ops/catalog/mc.go（换 Java）、ops/catalog/modcart.go（待装清单）、worldimport/service.go（换地图）。

  草图参数（右上角两条切换条都能点，草图专用，定了就删）：
    ?kind=create|pack|adopt|java|export|import|server|cart|map   新建、导入整合包、接管、换 Java、导出交接包、导入交接包、导入服务端、安装待装清单、换地图
        pack（导入整合包）在 Go 里和新建是同一类任务（kind 为空），多「下载整合包文件」「应用整合包覆盖」两步；「有文件没装上」只会出在它身上，所以单列一项。
    &st=running|slow|done|failed|cancelled|partial|lost|gone     进行中、下载慢、做完、失败、已取消、部分完成、连不上 MineDeck、任务不存在
        程序里切不出来的组合（换 Java 取消、新建的部分完成……）在切换条上灰掉、悬停说原因，硬写进地址时落到「进行中」。
    &play=1     不直接画那一帧，从第一步自动往下走到这个 st 的结尾（失败在出错那一步停、下载慢在那里卡一会儿再走）
    &enter=1    从向导的「创建服务器」进来：内容从右边挪进来，胶囊浮上来
    &cart=1     （配 kind=create&play=1）新建时挑过插件：建好以后接着装待装清单（程序是留在向导等建服跑完再跳）
    &dock=sink  底部第二种：胶囊沉着（同向导），进行中右下多一颗「回到主页」当出路；默认 float（胶囊浮起来）
    &why=idle   下载慢的另一种标题（「已经 40 多秒没有新进度」）；默认是「api.papermc.io 下载失败，已重试 3 次」，只有新建、导入交接包有这种（下服务端核心才报重试，别的只会是「多久没有新进度」）
    &leftover=1 失败以后半成品没删干净；&draft=0 没有草稿（刷新过、从首页浮层点进来：没有「返回修改」「重试」）；&local=0 从别的设备打开（没有「打开文件夹」）
    &theme=light 浅色

  从上到下（1280×800，页面本身不滚）：
    · 标题栏 40（同设置页：左边小图标、草图切换条，右边窗口三键）。
    · 一句标题（30 号，离标题栏 44，同向导的问话）：照程序页头的字，进行中「正在创建服务器」，做完「服务器已建好」，失败「服务器没有建好」，取消「已取消创建」。
      程序页头下面那句说明（「正在下载 Java 和服务端。」「Java、服务端与配置均已就绪」）进标题的悬停。
    · 一行 13 号淡字（20 高，空着也占着，换状态时面板不挪），放这一刻最要紧、会改变结果的那一句：进行中「请勿关闭程序」（取消中「正在取消，清理半成品，请勿关闭程序」）；
      取消「没有留下半成品」；换 Java、待装清单做完「下次启动这台服务器时生效」「新装的内容要重启服务器后才会生效」；导出做完是交接包的路径加复制、打开所在文件夹；
      换地图做完是程序给的那句结果；连不上时是「无法刷新任务进度，正在自动重试」加复制。程序页头上的「第 2 步 / 共 6 步」不要了（左边步骤已经是这个样子）。
    · 大面板 1080 × 544（外 26 / 内边距 8）：
        封面条 60（圆角 18，核心色底加棋盘格，头像 44、圆角 10）：这台服务器的名字，下面一行核心 · 版本，再加这一类任务的对象（接管的文件夹、交接包、压缩包、要装的 Java、待装清单几项、换成哪张地图）。
        一栏（圆角 18，数值照 detail-world.css 换地图的进度）：左边 220 宽的步骤（一行 32 高，图标 20：勾、转圈、红叉、取消的一横、没到的小方点；新打勾的弹一下），
        右边上面一行「这一项下的是什么 · 已下多少 / 一共多少 · 百分比」，下面 30 格经验条（16 高、格间距 2；一格 = 这一项的 1/30，换了一项清空重来，新亮的格子错开 24 毫秒弹一下，做完整条闪一下）；
        这一步没在下载时整条淡下去、停在上一项的样子。再下面一道线，日志（等宽 12 / 20、整行折行不截，⚠ 一行黄、❌ 一行红，在这一块里滚，细滚动条，人往上翻着的时候新行不把他拽回底下）。
        日志上面按需出一块：下载慢（36 高的黄块，「api.papermc.io 下载失败，已重试 3 次」，程序那句「下载慢或在重试……不需要重新开始」进悬停）、失败的原因（红块，原因、errHint，没删干净时多一行，右上角复制）。
        做完以后有要看的（没装上的文件、提示），日志上面出一颗 32 高的分段「没装上的文件 3 · 提示 1 · 日志」，换着看（选中块滑过去，内容横着逐项换）。
    · 底部（面板底边 714，离窗口底 86）：胶囊（52 高、离底 18，同首页），左右两颗 44 高的胶囊按钮（中线离底 44、和版心左右边对齐，同向导的上一步、下一步）：
        左：进行中「取消创建」（能取消的那几种）→ 确认框；失败、取消「返回修改」（有草稿时，悬停是程序那句「之前填的都还在……」）。
        右：做完「完成，进入控制台」（各类照程序 K.go 的字）；失败「重试」（悬停是程序的 failHint）；换地图失败、取消是「回到这台服务器」。
        按钮出现、消失从下面浮上来、沉下去（0.32 秒，同向导）；同一颗换字时旧字淡掉、宽度按整像素平滑变（同向导「下一步」变「创建服务器」）。
    · 胶囊里亮哪一颗：详情页发起的（换 Java、导出、待装清单、换地图，程序侧栏亮「服务器」）亮主页，同详情页；新建、导入、接管不亮。

  没装上的文件（kind=pack&st=partial，首页浮层 t4「匠魂整合 3 个文件待处理」，文件同共用件页「没装上的文件」）：照 commons 的 .pnd，一个文件一块：路径、一句短原因（长句进悬停）、外链图标、
    40 高的分段「跳过 / 用本地文件代替 / 信任站点并下载」（这一项能用的几个），选了本地出路径框、选了信任出勾「信任 某站 的下载」；上面「全选可下载项」「确认这些站点的风险」和打开服务器文件夹，
    下面「应用所选的处理」。处理好的往右划掉（规范「清单加减」），结果记进日志；跳过的挪进最后一行「已跳过的 N 个」（点开能改）；没路径、没勾风险的就地拦下（标红、晃一下）；
    第一次「信任站点并下载」故意演示「处理失败」（那一块留着、下面一行红字，再点一次就成）。都处理完「没装上的文件都处理完了」，只剩跳过的是程序那句「跳过了 N 个文件，它们没有装上」。

  和程序不一样的地方（理由见汇报）：
    · 版面：程序是页头 + 竖着摞的步骤、进度、提示、日志、底栏；这里是向导那样的标题 + 一块面板（封面条 + 左步骤右进度日志）+ 底部胶囊和左右两颗按钮。
    · 取消先弹确认框（程序点了直接取消）；失败多一颗「重试」（程序只有「返回修改」或「返回 X」）——两样都是任务单点名要的。
    · 「下载 Java 21」这种进度名只在和步骤名说的不是一回事时写（「下载整合包文件」「复制地图」和步骤名重了不写，「打包交接包（已 812 个文件）」只写括号里那半句）。
    · 告警里和没装上的文件说同一件事的两条（「N 个文件需手动补装」「N 个文件待处理」）并进「没装上的文件」那一格，说明进分段的悬停；别的告警进「提示」那一格，长说明进标题的悬停。
    · 「创建失败：」这类前缀不写（标题说了）；程序的 failHint 进「重试」的悬停；「之前填的都还在」「回到刚才的表单，填过的都在」进「返回修改」的悬停；没删干净那句照写在红块里（要人去处理），「服务器页」改叫「首页」。
    · 做完不弹右上角的提示（程序：「服务器创建成功」「正在取消，等待清理半成品」「没装上的文件都处理完了」「已选中 N 个可下载项……」），那一处自己变（同待作者审里各页定的）。
    · 「返回新建服务器」「返回服务器列表」两颗按钮不要了：胶囊一直在，「新建」「主页」就在胶囊里。
    · 日志整行折行、不截（作者 11-27 要的「输出要完整」）；detail-world 换地图那份是一行截断的。
-->
