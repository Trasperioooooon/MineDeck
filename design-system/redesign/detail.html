<!--
  服务器详情页第一稿（11-27，作者：「下一页画服务器详情页」）。这一稿只定结构：页头和标签放哪；各标签里面的内容后面一页一页画。
  控制台画了第一稿（11-27，见最后「控制台」一段），玩家、联机也画了第一稿（11-27，说明写在 detail-players.js、detail-net.js 开头），别的标签内容还是空的面板。

  页头和首页大卡对上（规范第三节）：一块大面板（26 / 8），上面是封面条（核心色 30% 底、16 像素淡棋盘格、圆角 18），里面头像 44、名字、核心和版本，
  右边是数字块和星标、「···」（同大卡）；封面条下面一排 36 高的胶囊：状态、重启、停止或启动、联机地址、常驻提示（36 的一半 18 和面板下角同心）。
  重启和启动 / 停止原来在这一排的最右边，作者 11-27 说挪到状态和地址中间，看着整齐。
  首页大卡上的「控制台」按钮这里不要（控制台就是一个标签）；重启只有详情页有。
  「···」只放管整台服务器的三样：打开服务器文件夹、导出交接包…、删除服务器…（11-27 作者同意）。原来那组「打开文件夹」里对着某个标签的几个文件夹
  挪进了各自那一页的右上角：控制台是日志、崩溃报告，世界与备份是备份（「备份」子页）和世界（「换地图」子页），插件 / 模组是插件或模组文件夹。
  首页大卡的「···」照旧是全的（首页没有标签）。页头的在线人数点了去「玩家」，联机地址点了去「联机」（复制照旧是右边的图标）。
  常驻提示（上次没能启动、找不到 Java、模组要更高的 Java、整合包里有文件没装上）不另起一行（11-27 作者同意）：第一稿是页头面板最下面一条一条的，
  每多一条页头长 52、下面的标签栏和内容整块往下挤，启动失败、请求回来时都会跳一下。现在放进页头第二行中间那段空处（联机地址后面），一颗 36 高的警告色胶囊：
  结论、修复的按钮、×；字长了截断。同时有几条时只露第一条，后面跟「+1」；点结论或「+1」弹一块浮层，列全部提示的全文和所有按钮（复制报错信息在这里）。
  页头永远 120 高，下面一像素不动（同首页把列表上方的提示收成一颗胶囊的做法）。

  标签放在左边（11-27 作者定；第一稿还画过放在顶上的一排胶囊分段，没选）：页头下面左边一块 200 宽的面板，一行一个标签（36 高、图标加字），
  选中块上下滑；有子页的，子页缩进列在它下面，只展开选中的那一个。设置页的九个分类也照这个做（规范：两处的二级导航一种做法）。
  标签编号（console、players、world……）是程序地址的一部分，AI 助手和书签都在引用；这里加了「联机」（net），别的编号没动。

  怎么回首页：胶囊里「主页」亮着，点它回首页（同 MASTER 11.6：点当前项回到这一块的起点）；页上不另放返回键。这是主会话选的，等作者说。

  控制台（11-27 第一稿）：程序里有的都画上（app.js 约 3888 行起、assistant.js 的报错横幅），摆法重排了。
  面板最上面一排 32 高（搜索框 32 高胶囊、图标按钮 28 见方圆角 4，同临时规范）。11-27 作者定的顺序：最左边「字号和编码」（Aa）、复制全部、导出为 txt，
  竖线后面是这一页的两个文件夹（崩溃报告、日志；代理端只有日志；原来贴在终端右上角），「自动滚动」开关跟在后面；过滤框放最右边（边打边筛，筛不到时终端正中一行淡字）。
  程序里字号的 A− A+ 和编码下拉都摆在工具栏上；这里收进 Aa 点开的小浮层（用新建向导第三步那套 40 高的步进和分段选：字号 9 到 22、一下 1；编码 自动 / UTF-8 / GBK，存进这台服务器的设置），
  因为都不常动（作者 11-27 同意）。
  下面是终端（双主题恒深，圆角 18）：日志从下往上排，多了在里面滚（细滚动条，同首页）；最底下命令行 40 高，补全浮在它上面
  （照程序：常用命令、白名单子命令、要玩家名的命令补在线玩家，最多 8 条；Tab 补全、↑↓ 选、Esc 关掉、回车发送），↑↓ 翻历史，在别处按 T 或 / 跳到这里。
  报错横幅（本地规则认出的问题）在程序里压在终端外面、上面，出来时整个终端往下挤；这里放进终端里、日志上面（作者 11-27 同意）：终端本身一像素不动，
  日志从下往上排，最新的几行和命令行也不动，只是上面露得少一点。一行 44 高：结论、两个以上时一个「+1」、「怎么修」、「让 AI 分析」（配了 AI 才有）、×；
  展开是每个问题的详情、怎么修、日志里的原句，最多 236 高、在里面滚；展开时标题行里的结论淡掉，全文写在下面第一条里（一句话只说一次）。
  按键说明、「本地规则的分析，没有联网」、编码对之后的输出生效这几句只放悬停里。左下角的切换条看几种横幅（字照 internal/diag 的规则原话）；
  开服没起来时（端口被占、找不到 Java），程序的横幅最前面会多一条「上次没能启动」，和页头的提示胶囊说同一件事；作者 11-27 同意页头有这条时横幅不再列它
  （改程序时：详情页的横幅滤掉 start-failed；诊断接口照旧带着它给 AI 助手用）。这时控制台最后一行是 MineDeck 记的原因。
  服务器停着时命令行整条灰掉、不能打字，占位字换成「开服后才能发命令」（作者 11-27 同意；程序现在能打字，发出去才弹「无法发送命令」）。
  输出要完整（作者 11-27）：控制台里、复制的、导出的、交给 AI 的代码行都不能缩略。Java 堆栈里 Caused by 段末尾的「... N more」是 JVM / log4j 自己的写法，
  意思是「同外层最后 N 帧」；MineDeck 读输出时照外层补全（草图里 Paper 那段插件报错就是补全后的样子，补出来的几行淡一点、悬停说原文）。
  MineDeck 自己截掉的（3000 行缓冲、AI 打包每段只留 15 帧……）也要放开，清单在计划书详情页那一节，改程序要等作者说。
-->

<style>

    background-size: 16px 16px; background-position: 0 0, 8px 8px; }

                opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
  .ntp .lwrap:hover .thumb, .ntp .lwrap.scrolling .thumb, .ntp .thumb.drag { opacity: 1; }
  .ntp .thumb:hover, .ntp .thumb.drag { width: 6px; right: -6px; background: color-mix(in srgb, var(--text) 55%, transparent); }
  .ntp .lwrap.fits .thumb { display: none; }

  /* ---- 下半部分：标签和内容 ---- */
  .body { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .cp { flex: 1; min-width: 0; min-height: 0; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }

  @keyframes sw-out { to { opacity: 0; transform: translateY(-5px); } }

  /* 标签在左边：200 宽的面板（26 / 8），一行一个标签 36 高胶囊（18，和面板同心），选中块上下滑；子页缩进列在下面，32 高 */
  .snav { flex: none; width: 200px; position: relative; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); box-sizing: border-box;
          display: flex; flex-direction: column; gap: 2px; }
  .snav .hl { position: absolute; left: 8px; right: 8px; top: 0; height: 36px; border-radius: 18px; background: var(--accent-subtle); pointer-events: none;
              transition: transform .32s cubic-bezier(.3, .7, .2, 1); }
  .snav button { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: none;
                 font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: left; flex: none; }
  .snav button:hover { color: var(--text); }
  .snav button.on { color: var(--accent-text); }
  .snav button .ico { width: 16px; height: 16px; }
  .snav .subs { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .snav .subs button { height: 32px; padding-left: 40px; font-size: 12.5px; color: var(--faint); }
  .snav .subs button.on { color: var(--text); font-weight: 600; }
  .snav .subs button.on::before { content: ""; position: absolute; left: 22px; top: 13px; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }

  /* ---- 控制台（11-27 第一稿）：面板里上面一排 32 高的工具（搜索框 32 高胶囊、图标按钮 28 见方圆角 4，同临时规范），下面终端一栏（双主题恒深，圆角 18） ---- */
  .con { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .ctb { flex: none; height: 32px; display: flex; align-items: center; gap: 4px; }
  .ctb .sp { flex: 1; }
  .cs { display: flex; align-items: center; gap: 8px; width: 260px; height: 32px; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 16px; flex: none;
        background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); color: var(--muted); cursor: text; }
  .cs:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cs > .ico { width: 15px; height: 15px; flex: none; }
  .cs input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; background: none; font: inherit; font-size: 13px; color: var(--text); }
  .cs input::placeholder { color: var(--faint); }
  .cs .cx { width: 24px; height: 24px; border-radius: 12px; border: 0; padding: 0; flex: none; display: grid; place-items: center; background: none; color: var(--muted); cursor: pointer; visibility: hidden; }
  .cs.has .cx { visibility: visible; }
  .cs .cx:hover { background: var(--hover); color: var(--text); }
  .cs .cx .ico { width: 14px; height: 14px; }
  /* 开关：同新建向导那颗（36 × 20，滑块 16） */
  .tg { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; margin-left: 8px; border: 0; border-radius: 16px; background: none; flex: none;
        font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
  .tg:hover { color: var(--text); background: var(--hover); }
  .tg .sw { position: relative; width: 36px; height: 20px; border-radius: 10px; flex: none; background: color-mix(in srgb, var(--text) 18%, transparent); transition: background .2s; }
  .tg .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--text); transition: transform .26s cubic-bezier(.3, .7, .2, 1); }
  .tg.on .sw { background: var(--accent-solid); }
  .tg.on .sw::after { transform: translateX(16px); background: var(--on-accent); }
  .ctb .ib { width: 28px; height: 28px; border-radius: 4px; border: 0; padding: 0; flex: none; display: grid; place-items: center; background: none; color: var(--muted); cursor: pointer;
             transition: background .15s, color .15s; }
  .ctb .ib:hover, .ctb .ib.open { background: var(--hover); color: var(--text); }
  .ctb .ib.done { color: var(--success-text); }
  .ctb .ib .ico { width: 16px; height: 16px; }
  .ctb .vsep { width: 1px; height: 16px; margin: 0 6px; flex: none; background: var(--border); }

  .term { flex: 1; min-height: 0; position: relative; border-radius: 18px; background: var(--term-bg); color: var(--term-fg); display: flex; flex-direction: column; gap: 8px; padding: 8px; box-sizing: border-box; }
  .olw { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* 日志：从下往上排（上面空着时最新一行贴着命令行），多了在里面滚 */
  .term .out { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px; display: flex; flex-direction: column; font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
               white-space: pre-wrap; word-break: break-all; tab-size: 4; }
  .term .out > .ofill { flex: 1 0 0; }
  .term .out > div { flex: none; }
  .term .out .xp { opacity: .62; } /* 补全出来的堆栈行（原文是「... N more」） */
  .term .out .cmd-echo { color: var(--term-cmd); } .term .out .lv-warn { color: var(--term-warn); } .term .out .lv-err { color: var(--term-err); }
  .olw .nomatch { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: color-mix(in srgb, var(--term-fg) 45%, transparent); pointer-events: none; }
  /* 细滚动条（同首页那套），颜色用终端的字色；上下还有没露出来的，那一头淡出 */
  .con .lwrap .list { scrollbar-width: none; --ft: 0px; --fb: 0px;
                      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
                      mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%); }
  .con .lwrap .list::-webkit-scrollbar { display: none; }
  .con .lwrap.can-up .list { --ft: 24px; } .con .lwrap.can-down .list { --fb: 24px; }
  .con .thumb { position: absolute; right: -6px; width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--term-fg) 34%, transparent);
                opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
  .con .lwrap:hover .thumb, .con .lwrap.scrolling .thumb, .con .thumb.drag { opacity: 1; }
  .con .thumb:hover, .con .thumb.drag { width: 6px; right: -7px; background: color-mix(in srgb, var(--term-fg) 55%, transparent); }
  .con .lwrap.fits .thumb { display: none; }

  /* 报错横幅：本地规则认出的问题。放进终端里、日志上面（圆角 10 = 18 − 8，同心）：终端本身不动，日志从下往上排，最新的几行也不动 */
  .dg { --dc: var(--term-err); flex: none; border-radius: 10px; font-size: 12.5px; line-height: 20px; color: var(--term-fg);
        background: color-mix(in srgb, var(--dc) 13%, var(--term-bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dc) 26%, transparent); }
  .dg.warn { --dc: var(--term-warn); }
  .dg.gone { animation: sw-out .09s cubic-bezier(.4, 0, 1, 1) both; }
  .dgh { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 12px; }
  .dgi { display: grid; flex: none; color: var(--dc); margin-right: 2px; } .dgi .ico { width: 16px; height: 16px; }
  .dgt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: color-mix(in srgb, var(--term-fg) 72%, transparent); }
  .dgt b { color: var(--dc); font-weight: 600; margin-right: 10px; }
  .dgm, .dga { height: 28px; border-radius: 14px; border: 0; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; cursor: pointer;
               font: inherit; font-size: 12.5px; background: color-mix(in srgb, var(--term-fg) 9%, transparent); color: var(--term-fg); }
  .dgm { padding-right: 9px; }
  .dgm:hover, .dga:hover { background: color-mix(in srgb, var(--term-fg) 16%, transparent); }
  .dgm .ico, .dga .ico { width: 14px; height: 14px; }
  .dga .spin { animation: dg-spin .9s linear infinite; } @keyframes dg-spin { to { transform: rotate(360deg); } }
  .dgm .ico { transition: transform .32s cubic-bezier(.3, .7, .2, 1); }
  .dg.open .dgm .ico { transform: rotate(180deg); }
  .dgx { width: 28px; height: 28px; border-radius: 14px; border: 0; padding: 0; flex: none; display: grid; place-items: center; background: none; cursor: pointer;
         color: color-mix(in srgb, var(--term-fg) 60%, transparent); }
  .dgx:hover { background: color-mix(in srgb, var(--term-fg) 12%, transparent); color: var(--term-fg); }
  .dgx .ico { width: 14px; height: 14px; }
  /* 展开：详情和怎么修，最多 236 高、在里面滚；高度用 0fr → 1fr 滑开 */
  .dgc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.3, .7, .2, 1); }
  .dg.open .dgc { grid-template-rows: 1fr; }
  .dgb { position: relative; min-height: 0; overflow: hidden; }
  .dgb .list { max-height: 236px; overflow-y: auto; box-sizing: border-box; padding: 0 18px 10px 38px; display: flex; flex-direction: column; gap: 12px; }
  .dgb .thumb { right: 4px; } .dgb .thumb:hover, .dgb .thumb.drag { right: 3px; }
  .dgf { color: color-mix(in srgb, var(--term-fg) 82%, transparent); }
  .dgf + .dgf { border-top: 1px solid color-mix(in srgb, var(--term-fg) 12%, transparent); padding-top: 12px; }
  .dgf .ft { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--term-fg); }
  .dgf .tag { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; font-weight: 500; background: color-mix(in srgb, var(--term-warn) 20%, transparent); color: var(--term-warn); }
  .dgf ul, .dgf ol { margin: 2px 0 0; padding-left: 20px; }
  .dgf .fx { margin-top: 6px; font-weight: 600; color: var(--term-fg); }
  .dgf pre { margin: 6px 0 0; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, #000 32%, transparent); font: 11.5px/18px var(--mono);
             white-space: pre-wrap; word-break: break-all; color: color-mix(in srgb, var(--term-fg) 70%, transparent); }
  /* 展开时标题行的结论淡掉，全文在下面第一条里（一句话只说一次） */
  .dgt span { transition: opacity .2s; }
  .dg.open .dgt span { opacity: 0; }
  /* 两个以上的问题：同页头提示胶囊的「+1」 */
  .dgk { height: 28px; min-width: 28px; padding: 0 9px; border: 0; border-radius: 14px; flex: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
         background: color-mix(in srgb, var(--dc) 22%, transparent); color: var(--dc); }
  .dgk:hover, .dg.open .dgk { background: color-mix(in srgb, var(--dc) 34%, transparent); }

  /* 命令行：40 高、圆角 10（离栏边 8，同心）；发送键 28、离边 6、圆角 4（10 − 6） */
  .cin { flex: none; height: 40px; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; box-sizing: border-box;
         background: color-mix(in srgb, var(--term-fg) 8%, transparent); font: 12.5px var(--mono); }
  .cin:focus-within { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--term-cmd) 55%, transparent); }
  .cin b { color: var(--term-cmd); font-weight: 600; }
  .cin input { flex: 1; min-width: 0; border: 0; outline: 0; padding: 0; background: none; font: inherit; color: var(--term-fg); caret-color: var(--term-cmd); }
  .cin input::placeholder { color: color-mix(in srgb, var(--term-fg) 38%, transparent); }
  .snd { width: 28px; height: 28px; border-radius: 4px; border: 0; padding: 0; flex: none; display: grid; place-items: center; cursor: pointer;
         background: color-mix(in srgb, var(--term-cmd) 20%, transparent); color: var(--term-cmd); }
  .snd:hover { background: color-mix(in srgb, var(--term-cmd) 32%, transparent); }
  .snd .ico { width: 15px; height: 15px; }
  /* 停着时：命令行整条淡下去，不能打字（作者 11-27 同意） */
  .cin.off { background: color-mix(in srgb, var(--term-fg) 4%, transparent); cursor: not-allowed; }
  .cin.off b, .cin.off .snd { opacity: .35; }
  .cin.off input { cursor: not-allowed; } .cin.off input::placeholder { color: color-mix(in srgb, var(--term-fg) 45%, transparent); }
  .cin.off .snd { cursor: not-allowed; background: color-mix(in srgb, var(--term-fg) 10%, transparent); color: var(--term-fg); }
  /* 补全：浮在命令行上面，终端配色；外圆角 16、内边距 5，一项 32 高、圆角 10（16 − 6） */
  .term .sg { position: absolute; left: 8px; bottom: 54px; z-index: 3; min-width: 240px; padding: 5px; box-sizing: border-box; display: flex; flex-direction: column; gap: 1px;
              border-radius: 16px; background: color-mix(in srgb, var(--term-fg) 9%, var(--term-bg)); border: 1px solid color-mix(in srgb, var(--term-fg) 16%, transparent);
              box-shadow: 0 8px 24px rgb(0 0 0 / .4); animation: cp-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  .term .sg .si { height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 10px; font: 12.5px var(--mono); color: var(--term-fg); cursor: pointer; }
  .term .sg .si:hover { background: color-mix(in srgb, var(--term-fg) 10%, transparent); }
  .term .sg .si.sel { background: color-mix(in srgb, var(--term-cmd) 20%, transparent); color: var(--term-cmd); }

  /* 字号和编码：工具栏「Aa」点开的小浮层。外圆角 16、内边距 6，里面是表单那套 40 高、圆角 10 的步进和分段选（16 − 6，贴角的同心） */
  .cpop { position: fixed; z-index: 50; width: 288px; padding: 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;
          border-radius: 16px; border: 1px solid var(--border); background: var(--overlay); box-shadow: var(--elev-3); }
  .cpop.enter { animation: dm-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  .cpop.leave { animation: dm-out .09s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
  .cpop .r { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 40px; padding-left: 10px; font-size: 13px; }
  .cpop .r > span { color: var(--muted); }
  /* 步进：同新建向导第三步（两个按钮 28 见方、离框外沿 6、圆角 4） */
  .stp { width: 196px; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; border-radius: 10px; box-sizing: border-box;
         background: var(--field); border: 1px solid var(--border); }
  .stp button { width: 28px; height: 28px; border-radius: 4px; border: 0; padding: 0; display: grid; place-items: center; background: none; color: var(--muted); cursor: pointer;
                transition: background .15s, color .15s; }
  .stp button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .stp button:disabled { opacity: .3; cursor: default; }
  .stp button .ico { width: 14px; height: 14px; }
  .stp b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* 分段选：同新建向导第三步（选中块离外框 4、圆角 6，滑过去） */
  .eseg { position: relative; display: flex; width: 196px; height: 40px; padding: 3px; box-sizing: border-box; border-radius: 10px; background: var(--field); border: 1px solid var(--border); }
  .eseg .sgl { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 6px; background: var(--accent-subtle); pointer-events: none;
               box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
               transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
  .eseg button { flex: 1; position: relative; z-index: 1; padding: 0; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; transition: color .2s; }
  .eseg button:hover { color: var(--text); }
  .eseg button.on { color: var(--accent-text); font-weight: 500; }

  /* 草图专用：控制台横幅的几种样子（左下角，定了就删） */
  .sk2 { position: fixed; left: 16px; bottom: 30px; z-index: 6; }
  .empty { position: relative; }
  /* 各页右上角的「打开 X 文件夹」（原来在「···」里）：28 见方，贴栏的右上角 8，圆角 10（18 − 8，同心）；控制台的放进了它的工具栏 */
  .fd { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; }
  .fd button { width: 28px; height: 28px; border-radius: 10px; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer; background: none; color: var(--muted); transition: background .15s, color .15s; }
  .fd button:hover { background: var(--hover); color: var(--text); }
  .fd button .ico { width: 16px; height: 16px; }
  .empty { flex: 1; border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .cp > .fade-out { animation: sw-out .09s cubic-bezier(.4, 0, 1, 1) both; }
  .cp > .fade-in { animation: cp-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes cp-in { from { opacity: 0; transform: translateY(5px); } }

  /* 「···」菜单：同共用件页（commons.html）那张 */
  .dm { position: fixed; z-index: 50; min-width: 208px; padding: 5px; box-sizing: border-box; display: flex; flex-direction: column; gap: 1px;
        border-radius: 16px; border: 1px solid var(--border); background: var(--overlay); box-shadow: var(--elev-3); }
  .dm.enter { animation: dm-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  .dm.leave { animation: dm-out .09s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
  @keyframes dm-in { from { opacity: 0; transform: translateY(-5px); } }
  @keyframes dm-out { to { opacity: 0; transform: translateY(-5px); } }
  .dm .it { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .dm .it .ico { width: 16px; height: 16px; color: var(--muted); }
  .dm .it:hover { background: var(--hover); }
  .dm .it.dgr, .dm .it.dgr .ico { color: var(--danger-text); }
  .dm .it[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .dm .it[aria-disabled="true"]:hover { background: none; }
  .dm .hd { padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .dm .sep { height: 1px; margin: 4px 6px; background: var(--border); }

  /* 底部胶囊：同首页；详情页在「主页」底下，主页亮着 */
  .cap { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 4px; padding: 5px;
         border-radius: var(--r-full); background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2);
         border: 1px solid var(--border); box-shadow: var(--elev-3); }
  .cap a { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--muted); text-decoration: none; }
  .cap a:hover { color: var(--text); background: var(--hover); }
  .cap a.on { color: var(--accent-text); background: var(--accent-subtle); }
  .cap a .ico { width: 18px; height: 18px; }
  .cap a.home img { width: 20px; height: 20px; image-rendering: pixelated; }
  .cap a.ai { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
  .cap a.ai .ico { color: var(--accent-text); }
  .cap a.new { background: var(--accent-solid); color: var(--on-accent); }
</style>

<script>
const QS = new URLSearchParams(location.search);

// 草图里的几台服务器，同首页的示例（名字、核心、版本、端口、隧道都和 home.html 一样）

const KINDS = {

  vanilla: { name: "原版快照测试", core: "vanilla", label: "原版", mc: "26.2", port: 25567, players: 1, max: 20, up: "0:08", last: "上周", hours: 3, pin: false },
  proxy: { name: "群组代理", core: "velocity", label: "Velocity", mc: "3.4.0", port: 25577, players: 9, max: 100, up: "6:30", last: "现在", hours: 410, pin: false, proxy: true },
};
const kind = KINDS[QS.get("kind")] ? QS.get("kind") : "paper", S = KINDS[kind];
const nNotice = Math.max(0, Math.min(4, +QS.get("notice") || 0));
// 两条常驻提示都只在停着时出现（程序里「上次没能启动」只在已停止时显示；找不到 Java 时也开不起来）
const st = nNotice || ["err", "multi", "crash", "java"].includes(QS.get("diag")) ? "stopped" : (["running", "starting", "stopped"].includes(QS.get("st")) ? QS.get("st") : "running");

// 标签和子页：照程序 detailTabs（app.js），这台服务器用不上的不列；加了「联机」（net），放在玩家后面
function tabsOf(s) {
  const plug = ["paper", "purpur", "leaves", "folia", "velocity", "waterfall"].includes(s.core);
  const hybrid = ["mohist", "banner"].includes(s.core);
  const t = [{ id: "console", label: "控制台", ic: "console" }];

  t.push({ id: "net", label: "联机", ic: "globe" });
  if (!s.proxy) t.push({ id: "world", label: "世界与备份", ic: "map", subs: [["backups", "备份"], ["map", "换地图"]] });
  if (s.core !== "vanilla") t.push({ id: "addons", label: hybrid ? "插件和模组" : plug ? "插件" : "模组", ic: plug ? "plug" : "package" });
  t.push({ id: "tasks", label: "定时任务", ic: "clock" });
  t.push({ id: "settings", label: "设置", ic: "gear", subs: s.proxy ? [["jvm", "启动与内存"]] : [["common", "常用"], ["jvm", "启动与内存"], ["raw", "全部配置"]] });
  const ext = [];
  if (!s.proxy) ext.push(["gameai", "游戏内 AI"]);
  if (["forge", "neoforge"].includes(s.core)) ext.push(["companion", "AI 伙伴"]);
  if (["forge", "neoforge", "mohist"].includes(s.core)) ext.push(["music", "音乐共享"]);
  if (ext.length) t.push({ id: "ext", label: "扩展", ic: "sparkle", subs: ext });
  return t;
}
const TABS = tabsOf(S);
let tab = TABS.find(t => t.id === QS.get("tab")) ? QS.get("tab") : "console";
const subsOf = id => { const t = TABS.find(x => x.id === id); return t.subs && t.subs.length > 1 ? t.subs : null; }; // 只有一个子页（代理端的设置）就不列子页
const subPick = {};
TABS.forEach(t => { if (t.subs) subPick[t.id] = t.subs[0][0]; });
if (QS.get("sub") && subsOf(tab)?.some(x => x[0] === QS.get("sub"))) subPick[tab] = QS.get("sub");

// ---- 草图切换条 ----
function skBar() {
  const q4 = new URLSearchParams(location.search); q4.set("notice", "4"); q4.set("kind", "forge"); q4.delete("tab"); q4.delete("sub"); q4.delete("diag");
  const four = `<a href="?${q4}" class="${nNotice === 4 ? "on" : ""}" title="四种一起出来（整合包装的模组服才会有后两种），看浮层怎么滚">四条</a>`;
  const link = (k, v, label, on) => { const q = new URLSearchParams(location.search); if (v === null) q.delete(k); else q.set(k, v); if (k === "kind" || k === "notice") q.delete("diag"); if (k === "kind") { q.delete("tab"); q.delete("sub"); } return `<a href="?${q}" class="${on ? "on" : ""}">${label}</a>`; };
  $("#sk").innerHTML = `<b>草图</b><b>核心</b>${link("kind", null, "Paper", kind === "paper")}${link("kind", "forge", "Forge", kind === "forge")}${link("kind", "vanilla", "原版", kind === "vanilla")}${link("kind", "proxy", "代理端", kind === "proxy")}<i></i>`
    + `<b>状态</b>${link("st", null, "运行中", st === "running" && !nNotice)}${link("st", "starting", "启动中", st === "starting")}${link("st", "stopped", "已停止", st === "stopped" && !nNotice)}<i></i>`
    + `<b>常驻提示</b>${link("notice", null, "无", !nNotice)}${link("notice", "1", "一条", nNotice === 1)}${link("notice", "2", "两条", nNotice === 2)}${four}<i></i>`
    + `<span title="控制台定了几处；别的标签 11-27 夜里都画了第一稿（各在 detail-<标签>.js / .css），要作者敲定的记在 docs/计划/2026-11-27-界面重构-待作者审.md">各标签第一稿</span>`;
  // 左下角：控制台报错横幅的几种（都切到 Forge；没开起来、崩了的几种是已停止）
  const dl = (v, label, title) => {
    const q = new URLSearchParams(location.search);
    if (v) { q.set("diag", v); q.set("kind", "forge"); q.delete("notice"); q.set("tab", "console"); q.delete("sub"); if (v === "warn") q.delete("st"); else q.set("st", "stopped"); }
    else q.delete("diag");
    if (v === "java") q.set("java", "bad"); else q.delete("java"); // 换到「设置 → 启动与内存」时 Java 17 也是坏的，对得上
    return `<a href="?${q}" class="${DIAG === v ? "on" : ""}"${title ? ` title="${title}"` : ""}>${label}</a>`;

    + `${dl("warn", "提醒", "还开着，好友的模组对不上进不来")}${dl("crash", "没认出", "异常退出了，本地规则没认出是什么原因")}${dl("java", "Java 坏了", "配的 Java 17 少了文件、起不来（全局设置 Java 页、启动与内存加 &java=bad 对得上）")}<i></i>`
    + `<a href="?${qa}" class="${AI_ON ? "" : "on"}" title="没配 AI 时横幅上没有「让 AI 分析」">没配 AI</a>`;
}

// ---- 常驻提示（原是程序里的原话，11-28 照 Gemini 改成书面口吻，程序跟着草图改；结论是胶囊上露的，全文在浮层里） ----
const NOTICES = [
  { id: "fail", short: `上次启动失败：端口 ${S.port} 被「空岛生存」占用`, fix: `改成 ${S.port + 1} 并启动`, copy: true, close: true,
    full: `上次启动失败：端口 ${S.port} 被服务器「空岛生存」占用，两台服务器无法同时运行。` },
  { id: "java", short: "未找到该服务器配置的 Java", fix: "更换 Java",
    full: `未找到该服务器配置的 Java（<span class="mono">C:\\Program Files\\Java\\jdk-21\\bin\\java.exe</span>），当前无法启动。可能已被卸载或移动。` },
  { id: "pending", short: "有 3 个整合包文件没装上", fix: "处理",
    full: "该服务器有 3 个整合包文件没装上，缺失可能导致无法启动或玩家无法进入。" },
  { id: "need", short: "有模组要求 Java 21，当前为 Java 17", fix: "更换 Java",
    full: "有模组要求 Java 21，当前服务器使用 Java 17，可能导致启动失败。可在「设置 → 启动与内存」中更换 Java。" },
];
let shown = NOTICES.slice(0, nNotice);
function ntcPill() {
  if (!shown.length) return "";
  const n = shown[0], more = shown.length - 1;
  return `<span class="ntc"><i data-ic="warn"></i><button class="t" data-ntp title="查看全文">${n.short}</button>${n.fix ? `<button class="btn">${n.fix}</button>` : ""}`
    + (more ? `<button class="more-n" data-ntp title="还有 ${more} 条提示">+${more}</button>` : "")
    + (n.close ? `<button class="rb" data-close="${n.id}" title="关闭提示"><i data-ic="x"></i></button>` : "") + `</span>`;
}
const ntpBody = () => `<div class="lwrap"><div class="list">${ntpRows()}</div><span class="thumb"></span></div>`;
// 浮层的高：三条以上时只露前两条加第三条的一半，一眼看得出下面还有；行高按各条的字数不一样，所以量出来再定
function fitNtp() {
  const l = $(".ntp .list"), rows = $$(".ntp .row"); if (!l) return;
  l.style.maxHeight = rows.length > 2 ? Math.round(rows[0].offsetHeight + rows[1].offsetHeight + 8 + rows[2].offsetHeight / 2) + "px" : "";
  thinBar($(".ntp .lwrap"));
}
// 细滚动条（同首页 home.html 的 thinBar）：系统滚动条藏掉，右边一根细条，移上去或正在滚时才出来，能拖；上下还有没露出来的，那一头淡出
function thinBar(w) {
  const l = w.querySelector(".list"), t = w.querySelector(".thumb");
  const paint = () => {
    const ch = l.clientHeight, sh = l.scrollHeight, st = l.scrollTop;
    w.classList.toggle("fits", sh <= ch + 1); w.classList.toggle("can-up", st > 2); w.classList.toggle("can-down", st + ch < sh - 2);
    const h = Math.max(28, ch * ch / sh);
    t.style.height = h + "px"; t.style.top = (sh > ch ? st / (sh - ch) * (ch - h) : 0) + "px";
  };
  if (w._paint) { w._paint(); return; }
  w._paint = paint;
  let idle = 0;
  l.addEventListener("scroll", () => { paint(); w.classList.add("scrolling"); clearTimeout(idle); idle = setTimeout(() => w.classList.remove("scrolling"), 700); }, { passive: true });
  t.addEventListener("pointerdown", e => {
    e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add("drag");
    const y0 = e.clientY, s0 = l.scrollTop, ratio = (l.scrollHeight - l.clientHeight) / (l.clientHeight - t.offsetHeight);
    const move = ev => { l.scrollTop = s0 + (ev.clientY - y0) * ratio; };
    const up = () => { t.classList.remove("drag"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); };
    t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
  });
  paint();
}
const ntpRows = () => shown.map(n => `<div class="row"><i data-ic="warn"></i><div class="t">${n.full}</div><div class="a">${n.fix ? `<button class="btn">${n.fix}</button>` : ""}`
  + (n.copy ? `<button class="rb" title="复制报错信息"><i data-ic="copy"></i></button>` : "") + (n.close ? `<button class="rb" data-close="${n.id}" title="关闭提示"><i data-ic="x"></i></button>` : "") + `</div></div>`).join("");
let ntp = null;
function openNtp() {
  if (ntp) return closeNtp();
  const pill = $(".ntc"); if (!pill) return;
  ntp = Object.assign(document.createElement("div"), { className: "ntp enter", innerHTML: ntpBody() }); ntp.setAttribute("role", "dialog"); ntp.setAttribute("aria-label", "常驻提示");
  document.body.appendChild(ntp); KIT.hydrate(ntp); fitNtp();
  const r = pill.getBoundingClientRect();
  ntp.style.left = Math.round(Math.min(r.left, innerWidth - ntp.offsetWidth - 16)) + "px"; ntp.style.top = Math.round(r.bottom + 6) + "px";
  $$(".ntc [data-ntp]").forEach(b => b.classList.add("open"));
}
function closeNtp() {
  if (!ntp) return; const m = ntp; ntp = null;
  $$(".ntc [data-ntp]").forEach(b => b.classList.remove("open"));
  m.classList.remove("enter"); m.classList.add("leave"); setTimeout(() => m.remove(), 90);
}
// 关掉一条：胶囊里换成下一条（旧的往上淡掉、新的浮上来），只有胶囊自己变宽变窄，别的都不动；浮层开着就跟着少一行，空了就收
function dismiss(id) {
  shown = shown.filter(n => n.id !== id);
  if (ntp) { if (shown.length) { const top = $(".ntp .list").scrollTop; ntp.innerHTML = ntpBody(); KIT.hydrate(ntp); fitNtp(); $(".ntp .list").scrollTop = top; } else closeNtp(); }
  const old = $(".ntc"); if (!old) return;
  old.classList.add("out");
  setTimeout(() => { $("#ntc-slot").innerHTML = ntcPill(); KIT.hydrate($("#ntc-slot")); $(".ntc")?.classList.add("in"); if (ntp) $$(".ntc [data-ntp]").forEach(b => b.classList.add("open")); }, 90);
}

function head() {

  let blocks;

  // 地址：同首页大卡，绑了隧道用隧道的，没绑用局域网的；只放一个，全部的列在「联机」里，点地址就去那里（11-27 作者同意）
  const a = S.tunnel || `192.168.1.5:${S.port}`, live = st === "running";
  const addr = `<span class="addr${live ? "" : " off"}"><span class="go" data-go="net" title="${live ? "前往「联机」查看全部地址" : "启动后可用此地址连接，前往「联机」查看全部地址"}"><i data-ic="${S.tunnel ? "globe" : "link"}"></i><span class="v">${a}</span></span>`
    + `<button class="rb" title="复制"><i data-ic="copy"></i></button></span>`;
  const restart = `<button class="btn"${st === "running" ? "" : ` aria-disabled="true" title="服务器运行中才能重启"`}><i data-ic="refresh"></i>重启</button>`;
  const main = st === "stopped" ? `<button class="btn go"><i data-ic="play"></i>启动</button>` : `<button class="btn stop"><i data-ic="stop"></i>停止</button>`;
  $("#dh").innerHTML = `<div class="cover" style="--c:${MDPixel16.CORE_COLORS[S.core]}">${av}<div class="title"><div class="nm">${S.name}</div><div class="meta">${S.label} · ${S.mc}</div></div>${blocks}${tools}</div>`
    + `<div class="acts">${stb}${restart}${main}${addr}<span id="ntc-slot" style="display:contents">${ntcPill()}</span><span class="sp"></span></div>`;
  KIT.hydrate($("#dh"));
}
