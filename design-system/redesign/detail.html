<title>草图 · 服务器详情页</title>
<!--
  服务器详情页第一稿（11-27，作者：「下一页画服务器详情页」）。这一稿只定结构：页头和标签放哪；各标签里面的内容后面一页一页画。
  只画了控制台撑版面的样子（控制台是作者要单独审的一页，这里不算定稿），别的标签内容是空的面板。

  页头和首页大卡对上（规范第三节）：一块大面板（26 / 8），上面是封面条（核心色 30% 底、16 像素淡棋盘格、圆角 18），里面头像 44、名字、核心和版本，
  右边是数字块和星标、「···」（同大卡）；封面条下面一排 36 高的胶囊：状态、联机地址、重启、停止或启动（同大卡底下那排，36 的一半 18 和面板下角同心）。
  首页大卡上的「控制台」按钮这里不要（控制台就是一个标签）；重启只有详情页有。
  「···」只放管整台服务器的三样：打开服务器文件夹、导出交接包…、删除服务器…（11-27 作者同意）。原来那组「打开文件夹」里对着某个标签的几个文件夹
  挪进了各自那一页的右上角：控制台是日志、崩溃报告，世界与备份是备份（「备份」子页）和世界（「换地图」子页），插件 / 模组是插件或模组文件夹。
  首页大卡的「···」照旧是全的（首页没有标签）。页头的在线人数点了去「玩家」，联机地址点了去「联机」（复制照旧是右边的图标）。
  常驻提示（上次没能启动、找不到 Java、模组要更高的 Java、整合包里有文件没装上）不另起一行（11-27 作者同意）：第一稿是页头面板最下面一条一条的，
  每多一条页头长 52、下面的标签栏和内容整块往下挤，启动失败、请求回来时都会跳一下。现在放进页头第二行中间那段空处（联机地址后面），一颗 36 高的警告色胶囊：
  结论、修复的按钮、×；字长了截断。同时有几条时只露第一条，后面跟「+1」；点结论或「+1」弹一块浮层，列全部提示的全文和所有按钮（复制报错信息在这里）。
  页头永远 120 高，下面一像素不动（同首页把列表上方的提示收成一颗胶囊的做法）。

  标签放在左边（11-27 作者定；第一稿还画过放在顶上的一排胶囊分段，没选）：页头下面左边一块 200 宽的面板，一行一个标签（36 高、图标加字），
  选中块上下滑；有子页的，子页缩进列在它下面，只展开选中的那一个。设置页的九个分类也照这个做（规范：两处的二级导航一种做法）。
  标签编号（console、players、world……）是程序地址的一部分，AI 助手和书签都在引用；这里加了「联机」（net），别的编号没动。

  怎么回首页：胶囊里「主页」亮着，点它回首页（同 MASTER 11.6：点当前项回到这一块的起点）；页上不另放返回键。这是主会话选的，等作者说。
-->

<style>
  body { background: var(--bg); overflow: hidden; }
  /* 标题栏：同首页 */
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: relative; z-index: 5; }
  .tb .brand img { width: 16px; height: 16px; image-rendering: pixelated; display: block; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }
  /* 草图专用的切换条（定了就删） */
  .sk { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px; border-radius: 13px; background: color-mix(in srgb, var(--surface) 70%, transparent);
        border: 1px solid var(--border); font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .sk b { font-weight: 500; color: var(--muted); margin: 0 2px 0 6px; }
  .sk b:first-child { margin-left: 2px; }
  .sk a { color: var(--muted); text-decoration: none; padding: 2px 6px; border-radius: 8px; }
  .sk a:hover { color: var(--text); background: var(--hover); }
  .sk a.on { color: var(--accent-text); background: var(--accent-subtle); }
  .sk i { width: 1px; height: 12px; background: var(--border); margin: 0 4px; }

  /* 版心 1080，底边留 86（胶囊 52 + 离底 18 + 16）；页面本身不滚 */
  .page { width: 1080px; margin: 0 auto; height: calc(100vh - 40px); box-sizing: border-box; padding: 16px 0 86px; display: flex; flex-direction: column; gap: 12px; }

  /* ---- 页头：大面板 26 / 8 ---- */
  .dh { flex: none; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); display: flex; flex-direction: column; gap: 8px; }
  .cover { --c: #7a8aa0; position: relative; height: 60px; box-sizing: border-box; padding: 8px; border-radius: 18px; display: flex; align-items: center; gap: 12px;
           background: color-mix(in srgb, var(--c) 30%, var(--surface)); overflow: hidden; }
  .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .cover > * { position: relative; z-index: 1; }
  .px-avatar { --c: #7a8aa0; width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 10px; overflow: hidden;
               background: color-mix(in srgb, var(--c) 26%, var(--surface)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .08), 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
  .px-avatar svg { width: 32px; height: 32px; display: block; }
  .px-avatar.icon { background: #000; } .px-avatar.icon svg { width: 100%; height: 100%; }
  .cover .title { flex: 1; min-width: 0; }
  .cover .nm { font-size: 16px; font-weight: 600; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cover .meta { font-size: 12px; line-height: 18px; color: color-mix(in srgb, var(--text) 70%, transparent); }
  /* 封面条右边的块：44 高、圆角 10（离封面边 8，18 − 8），半透明面板底，同大卡的工具块 */
  .cb { height: 44px; box-sizing: border-box; border-radius: 10px; background: color-mix(in srgb, var(--surface) 55%, transparent); flex: none; }
  .kv { padding: 0 14px; display: flex; flex-direction: column; justify-content: center; min-width: 84px; }
  .kv .k { font-size: 11.5px; line-height: 16px; color: var(--muted); }
  .kv .v { font-family: var(--mono); font-size: 15px; font-weight: 600; line-height: 20px; letter-spacing: -.01em; }
  .kv .v small { font-size: 11.5px; font-weight: 400; color: var(--faint); }
  .kv .v.ok { color: var(--success-text); }
  .boot { width: 280px; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
  .boot .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 14%, transparent); overflow: hidden; }
  .boot .bar i { display: block; height: 100%; width: 62%; border-radius: 3px; background: var(--warning); }
  .boot .steps { display: flex; gap: 6px; font-size: 11.5px; color: var(--faint); }
  .boot .steps b { color: var(--warning-text); font-weight: 500; }
  .tools { display: flex; align-items: center; padding: 0 6px; }
  .rb { width: 30px; height: 30px; border-radius: 15px; border: 0; padding: 0; background: none; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
  .rb:hover, .rb.open { background: var(--hover); color: var(--text); }
  .rb.pin.on { color: var(--warning); }

  /* 封面条下面一排：36 高胶囊（同大卡底下那排） */
  .acts { display: flex; align-items: center; gap: 8px; height: 36px; }
  .acts .sp { flex: 1; }
  .acts > .stbr, .acts > .addr, .acts > .btn { flex: none; } /* 地址、状态、按钮都不让位，放不下时只截断提示的结论 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 18px; font: inherit; font-size: 13px; font-weight: 500;
         background: var(--control); color: var(--text); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; box-sizing: border-box; }
  .btn:hover { background: var(--control-hov); }
  .btn .ico { width: 15px; height: 15px; }
  .btn.go { background: var(--accent-subtle); color: var(--accent-text); border-color: transparent; }
  .btn.stop { background: var(--danger-subtle); color: var(--danger-text); border-color: transparent; }
  .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .btn[aria-disabled="true"]:hover { background: var(--control); }
  .stbr { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .stbr i { width: 7px; height: 7px; border-radius: 2px; }
  .stbr.ok { background: var(--success-subtle); color: var(--success-text); } .stbr.ok i { background: var(--success); }
  .stbr.warm { background: var(--warning-subtle); color: var(--warning-text); } .stbr.warm i { background: var(--warning); }
  .stbr.off { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); color: var(--faint); } .stbr.off i { background: var(--faint); }
  .addr { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 4px 0 6px; border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .addr > .ico { width: 14px; height: 14px; color: var(--muted); }
  .addr .v { font-family: var(--mono); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .addr.off .v { color: var(--faint); }
  .addr .rb { width: 28px; height: 28px; border-radius: 14px; }
  .addr .rb .ico { width: 14px; height: 14px; }
  /* 页头里点了去对应标签的：在线人数去「玩家」，联机地址去「联机」；悬停出底色 */
  .go { cursor: pointer; transition: background .15s; }
  .kv.go:hover { background: color-mix(in srgb, var(--surface) 85%, transparent); }
  .addr .go { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 14px; }
  .addr .go:hover { background: var(--hover); }

  /* 常驻提示：页头第二行地址后面的一颗 36 高警告色胶囊，里面的按钮 28 高胶囊；放不下时结论截断（全文在浮层里） */
  .ntc { display: inline-flex; align-items: center; gap: 8px; height: 36px; min-width: 0; flex: 0 1 auto; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 18px;
         background: var(--warning-subtle); font-size: 13px; }
  .ntc > .ico { width: 16px; height: 16px; color: var(--warning-text); flex: none; }
  .ntc .t { min-width: 0; border: 0; padding: 0; background: none; font: inherit; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .ntc .t:hover { color: var(--warning-text); }
  .ntc .btn, .ntp .btn { height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12.5px; flex: none; }
  .ntc .more-n { height: 28px; min-width: 28px; padding: 0 9px; border: 0; border-radius: 14px; flex: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
                 background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--warning-text); }
  .ntc .more-n:hover, .ntc .more-n.open { background: color-mix(in srgb, var(--warning) 34%, transparent); }
  .ntc .rb, .ntp .rb { width: 28px; height: 28px; border-radius: 14px; flex: none; }
  .ntc .rb .ico, .ntp .rb .ico { width: 14px; height: 14px; }
  .ntc.out { animation: sw-out .09s cubic-bezier(.4, 0, 1, 1) both; }
  .ntc.in { animation: cp-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  /* 点结论或「+1」弹出的浮层：外圆角 18、细边 1 加内边距 5，里面一条提示一行、圆角 12（18 − 6，同心），全文折行，按钮都在 */
  .ntp { position: fixed; z-index: 50; width: 460px; box-sizing: border-box; padding: 5px; display: flex; flex-direction: column; gap: 4px;
         border-radius: 18px; border: 1px solid var(--border); background: var(--overlay); box-shadow: var(--elev-3); }
  .ntp.enter { animation: dm-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  .ntp.leave { animation: dm-out .09s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
  .ntp .row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 8px 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warning-subtle) 70%, transparent); }
  .ntp .row > .ico { width: 16px; height: 16px; color: var(--warning-text); flex: none; margin-top: 6px; }
  .ntp .row .t { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; padding-top: 4px; }
  .ntp .row .t .mono { font-family: var(--mono); font-size: 12px; }
  .ntp .row .a { display: flex; align-items: center; gap: 4px; flex: none; }

  /* ---- 下半部分：标签和内容 ---- */
  .body { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .cp { flex: 1; min-width: 0; min-height: 0; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }

  @keyframes sw-out { to { opacity: 0; transform: translateY(-5px); } }

  /* 标签在左边：200 宽的面板（26 / 8），一行一个标签 36 高胶囊（18，和面板同心），选中块上下滑；子页缩进列在下面，32 高 */
  .snav { flex: none; width: 200px; position: relative; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); box-sizing: border-box;
          display: flex; flex-direction: column; gap: 2px; }
  .snav .hl { position: absolute; left: 8px; right: 8px; top: 0; height: 36px; border-radius: 18px; background: var(--accent-subtle); pointer-events: none;
              transition: transform .32s cubic-bezier(.3, .7, .2, 1); }
  .snav button { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: none;
                 font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; text-align: left; flex: none; }
  .snav button:hover { color: var(--text); }
  .snav button.on { color: var(--accent-text); }
  .snav button .ico { width: 16px; height: 16px; }
  .snav .subs { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .snav .subs button { height: 32px; padding-left: 40px; font-size: 12.5px; color: var(--faint); }
  .snav .subs button.on { color: var(--text); font-weight: 600; }
  .snav .subs button.on::before { content: ""; position: absolute; left: 22px; top: 13px; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }

  /* 控制台（撑版面用，不是定稿）：终端一栏双主题恒深，圆角 18；命令行 40 高、圆角 10（离栏边 8，同心） */
  .term { flex: 1; min-height: 0; border-radius: 18px; background: var(--term-bg); color: var(--term-fg); display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; }
  .term .out { flex: 1; min-height: 0; overflow: hidden; padding: 8px 10px; font: 12.5px/20px var(--mono); white-space: pre-wrap; word-break: break-all; display: flex; flex-direction: column; justify-content: flex-end; }
  .term .out .w { color: var(--term-warn); } .term .out .c { color: var(--term-cmd); }
  .term .in { flex: none; height: 40px; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box;
              background: color-mix(in srgb, var(--term-fg) 8%, transparent); font: 12.5px var(--mono); color: color-mix(in srgb, var(--term-fg) 45%, transparent); }
  .term .in b { color: var(--term-cmd); font-weight: 600; }
  .term, .empty { position: relative; }
  /* 各页右上角的「打开 X 文件夹」（原来在「···」里）：28 见方，贴栏的右上角 8，圆角 10（18 − 8，同心）；控制台在深色终端里，用终端的字色 */
  .fd { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; }
  .fd button { width: 28px; height: 28px; border-radius: 10px; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer; background: none; color: var(--muted); transition: background .15s, color .15s; }
  .fd button:hover { background: var(--hover); color: var(--text); }
  .fd button .ico { width: 16px; height: 16px; }
  .term .fd button { color: color-mix(in srgb, var(--term-fg) 60%, transparent); }
  .term .fd button:hover { background: color-mix(in srgb, var(--term-fg) 12%, transparent); color: var(--term-fg); }
  .empty { flex: 1; border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .cp > .fade-out { animation: sw-out .09s cubic-bezier(.4, 0, 1, 1) both; }
  .cp > .fade-in { animation: cp-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes cp-in { from { opacity: 0; transform: translateY(5px); } }

  /* 「···」菜单：同共用件页（commons.html）那张 */
  .dm { position: fixed; z-index: 50; min-width: 208px; padding: 5px; box-sizing: border-box; display: flex; flex-direction: column; gap: 1px;
        border-radius: 16px; border: 1px solid var(--border); background: var(--overlay); box-shadow: var(--elev-3); }
  .dm.enter { animation: dm-in .22s cubic-bezier(.2, .7, .2, 1) both; }
  .dm.leave { animation: dm-out .09s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
  @keyframes dm-in { from { opacity: 0; transform: translateY(-5px); } }
  @keyframes dm-out { to { opacity: 0; transform: translateY(-5px); } }
  .dm .it { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .dm .it .ico { width: 16px; height: 16px; color: var(--muted); }
  .dm .it:hover { background: var(--hover); }
  .dm .it.dgr, .dm .it.dgr .ico { color: var(--danger-text); }
  .dm .it[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .dm .it[aria-disabled="true"]:hover { background: none; }
  .dm .hd { padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .dm .sep { height: 1px; margin: 4px 6px; background: var(--border); }

  /* 底部胶囊：同首页；详情页在「主页」底下，主页亮着 */
  .cap { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 4px; padding: 5px;

         border: 1px solid var(--border); box-shadow: var(--elev-3); }
  .cap a { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--muted); text-decoration: none; }
  .cap a:hover { color: var(--text); background: var(--hover); }
  .cap a.on { color: var(--accent-text); background: var(--accent-subtle); }
  .cap a .ico { width: 18px; height: 18px; }
  .cap a.home img { width: 20px; height: 20px; image-rendering: pixelated; }
  .cap a.ai { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
  .cap a.ai .ico { color: var(--accent-text); }
  .cap a.new { background: var(--accent-solid); color: var(--on-accent); }
</style>
</head>
<body>
<header class="tb">
  <span class="brand"><img src="../../internal/web/ui/img/logo-16.png" alt=""></span>
  <div class="sk" id="sk"></div>
  <span class="sp"></span>
  <div class="win"><span><i data-ic="winMin"></i></span><span><i data-ic="winMax"></i></span><span><i data-ic="winClose"></i></span></div>
</header>
<main class="page">
  <section class="dh" id="dh"></section>
  <div class="body" id="body"></div>
</main>
<nav class="cap" aria-label="导航">
  <a class="home on" href="home.html" aria-label="服务器（主页）" data-tip="服务器"><img src="../../internal/web/ui/img/logo-20.png" alt=""></a>
  <a href="toolbox.html" aria-label="工具箱" data-tip="工具箱"><i data-ic="toolbox"></i></a>
  <a href="#" aria-label="设置" data-tip="设置"><i data-ic="gear"></i></a>
  <a class="ai" href="#" aria-label="AI 助手" data-tip="AI 助手"><i data-ic="sparkle"></i></a>
  <a class="new" href="wizard.html" aria-label="新建服务器" data-tip="新建服务器"><i data-ic="plus"></i></a>
</nav>
<script>
const QS = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
// 草图里的几台服务器，同首页的示例（名字、核心、版本、端口、隧道都和 home.html 一样）
const SUNSET = ["SSSSSSSSSSSSSSSS","SSSSSSSSSSSSyySS","SSSSSSSSSSSyyyyS","SSSSSSSSSSSyyyyS","SSSSSSSSSSSSyySS","SSSSwwwSSSSSSSSS","SSSwwwwwSSSSSSSS","SSSSSSSSSSSSSSSS","SSSSSSSSSSSSSSSS","SSSSSSSSSSGGSSSS","SSGGSSSSSGGGGSSS","SGGGGSSSGGGGGGSS","GGGGGGGGGGGGGGGG","gggggggggggggggg","dddddddddddddddd","bbbbbbbbbbbbbbbb"];
const PAL = { S: "#9fd0ff", y: "#ffd35a", w: "#f4f1e8", G: "#88d45a", g: "#5bb03a", d: "#3f7a2a", b: "#6b4a2e" };
const fakeIcon = rows => `<svg viewBox="0 0 16 16" shape-rendering="crispEdges">${rows.map((r, y) => [...r].map((c, x) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`).join("")).join("")}</svg>`;
const KINDS = {
  paper: { name: "生存服 · 朋友", core: "paper", label: "Paper", mc: "1.21.4", port: 25565, tunnel: "frp-hk.openfrp.net:31234", players: 3, max: 20, up: "2:13", last: "现在", hours: 128, pin: true, icon: SUNSET },
  forge: { name: "机械动力整合包", core: "forge", label: "Forge", mc: "1.20.1", port: 25566, players: 2, max: 10, up: "0:41", last: "昨天", hours: 36, pin: false },
  vanilla: { name: "原版快照测试", core: "vanilla", label: "原版", mc: "26.2", port: 25567, players: 1, max: 20, up: "0:08", last: "上周", hours: 3, pin: false },
  proxy: { name: "群组代理", core: "velocity", label: "Velocity", mc: "3.4.0", port: 25577, players: 9, max: 100, up: "6:30", last: "现在", hours: 410, pin: false, proxy: true },
};
const kind = KINDS[QS.get("kind")] ? QS.get("kind") : "paper", S = KINDS[kind];
const nNotice = Math.max(0, Math.min(2, +QS.get("notice") || 0));
// 两条常驻提示都只在停着时出现（程序里「上次没能启动」只在已停止时显示；找不到 Java 时也开不起来）
const st = nNotice ? "stopped" : (["running", "starting", "stopped"].includes(QS.get("st")) ? QS.get("st") : "running");

// 标签和子页：照程序 detailTabs（app.js），这台服务器用不上的不列；加了「联机」（net），放在玩家后面
function tabsOf(s) {
  const plug = ["paper", "purpur", "leaves", "folia", "velocity", "waterfall"].includes(s.core);
  const t = [{ id: "console", label: "控制台", ic: "console" }];
  if (!s.proxy) t.push({ id: "players", label: "玩家", ic: "player" });
  t.push({ id: "net", label: "联机", ic: "globe" });
  if (!s.proxy) t.push({ id: "world", label: "世界与备份", ic: "map", subs: [["backups", "备份"], ["map", "换地图"]] });
  if (s.core !== "vanilla") t.push({ id: "addons", label: plug ? "插件" : "模组", ic: plug ? "plug" : "package" });
  t.push({ id: "tasks", label: "定时任务", ic: "clock" });
  t.push({ id: "settings", label: "设置", ic: "gear", subs: s.proxy ? [["jvm", "启动与内存"]] : [["common", "常用"], ["jvm", "启动与内存"], ["raw", "全部配置"]] });
  const ext = [];
  if (!s.proxy) ext.push(["gameai", "游戏内 AI"]);
  if (["forge", "neoforge"].includes(s.core)) ext.push(["companion", "AI 伙伴"]);
  if (["forge", "neoforge", "mohist"].includes(s.core)) ext.push(["music", "音乐共享"]);
  if (ext.length) t.push({ id: "ext", label: "扩展", ic: "sparkle", subs: ext });
  return t;
}
const TABS = tabsOf(S);
let tab = TABS.find(t => t.id === QS.get("tab")) ? QS.get("tab") : "console";
const subsOf = id => { const t = TABS.find(x => x.id === id); return t.subs && t.subs.length > 1 ? t.subs : null; }; // 只有一个子页（代理端的设置）就不列子页
const subPick = {};
TABS.forEach(t => { if (t.subs) subPick[t.id] = t.subs[0][0]; });
if (QS.get("sub") && subsOf(tab)?.some(x => x[0] === QS.get("sub"))) subPick[tab] = QS.get("sub");

// ---- 草图切换条 ----
function skBar() {
  const link = (k, v, label, on) => { const q = new URLSearchParams(location.search); if (v === null) q.delete(k); else q.set(k, v); if (k === "kind") { q.delete("tab"); q.delete("sub"); } return `<a href="?${q}" class="${on ? "on" : ""}">${label}</a>`; };
  $("#sk").innerHTML = `<b>草图</b><b>核心</b>${link("kind", null, "Paper", kind === "paper")}${link("kind", "forge", "Forge", kind === "forge")}${link("kind", "vanilla", "原版", kind === "vanilla")}${link("kind", "proxy", "代理端", kind === "proxy")}<i></i>`
    + `<b>状态</b>${link("st", null, "运行中", st === "running" && !nNotice)}${link("st", "starting", "启动中", st === "starting")}${link("st", "stopped", "已停止", st === "stopped" && !nNotice)}<i></i>`
    + `<b>常驻提示</b>${link("notice", null, "无", !nNotice)}${link("notice", "1", "一条", nNotice === 1)}${link("notice", "2", "两条", nNotice === 2)}<i></i>`
    + `<span title="控制台只画了撑版面的样子，别的标签里面是空的，后面一页一页画">只画了控制台</span>`;
}

// ---- 常驻提示（程序里的原话；结论是胶囊上露的，全文在浮层里） ----
const NOTICES = [
  { id: "fail", short: `上次没能启动：端口 ${S.port} 被「空岛生存」占着`, fix: `改成 ${S.port + 1} 并启动`, copy: true, close: true,
    full: `上次没能启动：端口 ${S.port} 被你的服务器「空岛生存」占着，两台不能同时开` },
  { id: "java", short: "找不到这台服务器配的 Java", fix: "去换 Java",
    full: `找不到这台服务器配的 Java（<span class="mono">C:\\Program Files\\Java\\jdk-21\\bin\\java.exe</span>），现在启动会失败。可能是那个 Java 被卸载或挪走了` },
];
let shown = NOTICES.slice(0, nNotice);
function ntcPill() {
  if (!shown.length) return "";
  const n = shown[0], more = shown.length - 1;
  return `<span class="ntc"><i data-ic="warn"></i><button class="t" data-ntp title="查看全文">${n.short}</button>${n.fix ? `<button class="btn">${n.fix}</button>` : ""}`
    + (more ? `<button class="more-n" data-ntp title="还有 ${more} 条提示">+${more}</button>` : "")
    + (n.close ? `<button class="rb" data-close="${n.id}" title="关闭提示"><i data-ic="x"></i></button>` : "") + `</span>`;
}
const ntpRows = () => shown.map(n => `<div class="row"><i data-ic="warn"></i><div class="t">${n.full}</div><div class="a">${n.fix ? `<button class="btn">${n.fix}</button>` : ""}`
  + (n.copy ? `<button class="rb" title="复制报错信息"><i data-ic="copy"></i></button>` : "") + (n.close ? `<button class="rb" data-close="${n.id}" title="关闭提示"><i data-ic="x"></i></button>` : "") + `</div></div>`).join("");
let ntp = null;
function openNtp() {
  if (ntp) return closeNtp();
  const pill = $(".ntc"); if (!pill) return;
  ntp = Object.assign(document.createElement("div"), { className: "ntp enter", innerHTML: ntpRows() }); ntp.setAttribute("role", "dialog"); ntp.setAttribute("aria-label", "常驻提示");
  document.body.appendChild(ntp); KIT.hydrate(ntp);
  const r = pill.getBoundingClientRect();
  ntp.style.left = Math.round(Math.min(r.left, innerWidth - ntp.offsetWidth - 16)) + "px"; ntp.style.top = Math.round(r.bottom + 6) + "px";
  $$(".ntc [data-ntp]").forEach(b => b.classList.add("open"));
}
function closeNtp() {
  if (!ntp) return; const m = ntp; ntp = null;
  $$(".ntc [data-ntp]").forEach(b => b.classList.remove("open"));
  m.classList.remove("enter"); m.classList.add("leave"); setTimeout(() => m.remove(), 90);
}
// 关掉一条：胶囊里换成下一条（旧的往上淡掉、新的浮上来），只有胶囊自己变宽变窄，别的都不动；浮层开着就跟着少一行，空了就收
function dismiss(id) {
  shown = shown.filter(n => n.id !== id);
  if (ntp) { if (shown.length) { ntp.innerHTML = ntpRows(); KIT.hydrate(ntp); } else closeNtp(); }
  const old = $(".ntc"); if (!old) return;
  old.classList.add("out");
  setTimeout(() => { $("#ntc-slot").innerHTML = ntcPill(); KIT.hydrate($("#ntc-slot")); $(".ntc")?.classList.add("in"); if (ntp) $$(".ntc [data-ntp]").forEach(b => b.classList.add("open")); }, 90);
}

// ---- 页头 ----
function head() {
  const av = S.icon ? `<span class="px-avatar icon" aria-hidden="true">${fakeIcon(S.icon)}</span>` : MDPixel16.avatar(S.core, "", 32).replace('class="px-avatar', 'class="px-avatar');
  let blocks;
  const toPlayers = S.proxy ? "" : ` go" data-go="players" title="去「玩家」`; // 代理端没有「玩家」标签
  if (st === "running") blocks = `<div class="cb kv${toPlayers}"><div class="k">在线人数</div><div class="v ok">${S.players}<small>/${S.max}</small></div></div><div class="cb kv"><div class="k">运行时间</div><div class="v">${S.up}</div></div>`;
  else if (st === "starting") blocks = `<div class="cb boot"><div class="bar"><i></i></div><div class="steps"><span>准备 Java ✓</span><span>·</span><b>加载世界</b><span>·</span><span>就绪</span><span style="margin-left:auto">12 秒</span></div></div>`;
  else blocks = `<div class="cb kv"><div class="k">上次玩</div><div class="v">${S.last === "现在" ? "昨天" : S.last}</div></div><div class="cb kv"><div class="k">时长总计</div><div class="v">${S.hours}<small> 小时</small></div></div>`;
  const tools = `<div class="cb tools"><button class="rb pin${S.pin ? " on" : ""}" title="${S.pin ? "取消收藏" : "收藏"}"><i data-ic="${S.pin ? "starOn" : "star"}"></i></button><button class="rb more" title="更多"><i data-ic="more"></i></button></div>`;
  const stb = st === "running" ? `<span class="stbr ok"><i></i>运行中</span>` : st === "starting" ? `<span class="stbr warm"><i></i>启动中</span>` : `<span class="stbr off"><i></i>已停止</span>`;
  // 地址：同首页大卡，绑了隧道用隧道的，没绑用局域网的；只放一个，全部的列在「联机」里，点地址就去那里（11-27 作者同意）
  const a = S.tunnel || `192.168.1.5:${S.port}`, live = st === "running";
  const addr = `<span class="addr${live ? "" : " off"}"><span class="go" data-go="net" title="${live ? "" : "开服后朋友连这个地址。"}去「联机」看全部地址"><i data-ic="${S.tunnel ? "globe" : "link"}"></i><span class="v">${a}</span></span>`
    + `<button class="rb" title="复制"><i data-ic="copy"></i></button></span>`;
  const restart = `<button class="btn"${st === "running" ? "" : ` aria-disabled="true" title="服务器开着时才能重启"`}><i data-ic="refresh"></i>重启</button>`;
  const main = st === "stopped" ? `<button class="btn go"><i data-ic="play"></i>启动</button>` : `<button class="btn stop"><i data-ic="stop"></i>停止</button>`;
  $("#dh").innerHTML = `<div class="cover" style="--c:${MDPixel16.CORE_COLORS[S.core]}">${av}<div class="title"><div class="nm">${S.name}</div><div class="meta">${S.label} · ${S.mc}</div></div>${blocks}${tools}</div>`
    + `<div class="acts">${stb}${addr}<span id="ntc-slot" style="display:contents">${ntcPill()}</span><span class="sp"></span>${restart}${main}</div>`;
  KIT.hydrate($("#dh"));
}

// ---- 标签 ----
// 各页右上角的「打开 X 文件夹」：原来在「···」的「打开文件夹」那一组里，对着这一页的那几个（代理端只有日志，没有崩溃报告）
function folders() {
  const plug = ["paper", "purpur", "leaves", "folia", "velocity", "waterfall"].includes(S.core);
  const key = tab + (subsOf(tab) ? "/" + subPick[tab] : "");
  const F = {
    console: S.proxy ? [["folder", "打开日志文件夹"]] : [["warn", "打开崩溃报告文件夹"], ["folder", "打开日志文件夹"]],
    "world/backups": [["folder", "打开备份文件夹"]], "world/map": [["folder", "打开世界文件夹"]],
    addons: [["folder", `打开${plug ? "插件" : "模组"}文件夹`]],
  }[key];
  return F ? `<div class="fd">${F.map(([i, t]) => `<button title="${t}"><i data-ic="${i}"></i></button>`).join("")}</div>` : "";
}
function content() {
  if (tab !== "console") return `<div class="empty">${folders()}</div>`;
  const NAMES = ["steve", "alex", "lihua"].slice(0, S.players);
  // 几行示例日志，照各家核心自己的格式（Paper、原版、Forge、Velocity 的行头不一样）
  const P = { paper: t => `[${t} INFO]: `, vanilla: t => `[${t}] [Server thread/INFO]: `, forge: t => `[${t}] [Server thread/INFO] [minecraft/DedicatedServer]: ` }[S.proxy ? "paper" : kind];
  const L = S.proxy ? [
    ["[12:01:03 INFO]: Booting up Velocity 3.4.0..."], ["[12:01:04 INFO]: Loading localizations..."], ["[12:01:05 INFO]: Done (1.86s)!"],
    ["[12:03:21 INFO]: [connected player] steve (/192.168.1.20:52114) has connected"], ["[12:06:02 INFO]: [connected player] alex (/192.168.1.23:50871) has connected"],
  ] : [
    [P("12:01:03") + `Starting minecraft server version ${S.mc}`], [P("12:01:03") + "Loading properties"], [P("12:01:03") + "Default game type: SURVIVAL"],
    [P("12:01:04") + "Preparing level \"world\""], [P("12:01:09") + "Done (5.412s)! For help, type \"help\""],
    ...NAMES.map((n, i) => [P(`12:0${3 + i}:21`) + `${n} joined the game`]), [P("12:06:44") + "<steve> 晚上一起去下界？"],
    [P("12:07:30").replace("INFO", "WARN") + "Can't keep up! Is the server overloaded? Running 2041ms or 40 ticks behind", "w"], ["> list", "c"],
    [P("12:08:12") + `There are ${S.players} of a max of ${S.max} players online: ${NAMES.join(", ")}`], // 和页头的在线人数对得上
  ];
  if (st === "starting") L.splice(4); // 启动中：日志停在还没开好的地方
  return `<div class="term">${folders()}<div class="out">${L.map(([t, c]) => `<div${c ? ` class="${c}"` : ""}>${t.replace(/</g, "&lt;")}</div>`).join("")}</div><div class="in"><b>&gt;</b>输入命令</div></div>`;
}
function body() {
  $("#body").innerHTML = `<aside class="snav" id="snav"><span class="hl"></span>${sideItems()}</aside><div class="cp" id="cp">${content()}</div>`;
  placeSide(true);
  KIT.hydrate($("#body"));
}
const sideItems = () => TABS.map(t => `<button data-t="${t.id}" class="${t.id === tab ? "on" : ""}"><i data-ic="${t.ic}"></i>${t.label}</button>`
  + (t.id === tab && subsOf(t.id) ? `<div class="subs">${subsOf(t.id).map(([id, l]) => `<button data-s="${id}" class="${subPick[t.id] === id ? "on" : ""}">${l}</button>`).join("")}</div>` : "")).join("");
function placeSide(instant) {
  const hl = $("#snav .hl"), on = $("#snav > button.on"); if (!hl || !on) return;
  if (instant) hl.style.transition = "none";
  hl.style.transform = `translateY(${on.offsetTop}px)`;
  if (instant) { void hl.offsetWidth; hl.style.transition = ""; }
}
// 换内容：旧的往上淡掉，新的从下面浮上来（同规范第七节的数值）；连着快点，上一次没换完的作废
let swapT = 0;
function swapContent() {
  const cp = $("#cp"); clearTimeout(swapT);
  [...cp.children].forEach(c => c.classList.add("fade-out"));
  swapT = setTimeout(() => { cp.innerHTML = content(); KIT.hydrate(cp); [...cp.children].forEach(c => c.classList.add("fade-in")); }, 90);
}
function syncURL() { const q = new URLSearchParams(location.search); q.set("tab", tab); if (subsOf(tab)) q.set("sub", subPick[tab]); else q.delete("sub"); history.replaceState(null, "", "?" + q); }
function goTab(id) {
  if (id === tab || !TABS.some(x => x.id === id)) return;
  tab = id; syncURL();
  // 子页跟着展开到新的标签下面，选中块从原来那行滑到新的一行
  const from = $("#snav > button.on").offsetTop;
  $("#snav").innerHTML = `<span class="hl"></span>${sideItems()}`; KIT.hydrate($("#snav"));
  const nh = $("#snav .hl"); nh.style.transition = "none"; nh.style.transform = `translateY(${from}px)`; void nh.offsetWidth; nh.style.transition = ""; placeSide();
  swapContent();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-t]"), s = e.target.closest("[data-s]"), g = e.target.closest("[data-go]");
  if (t || g) { goTab((t || g).dataset.t || g.dataset.go); return; }
  if (s) {
    const id = s.dataset.s; if (subPick[tab] === id) return;
    subPick[tab] = id; syncURL();
    const box = s.parentElement; $$("button", box).forEach(b => b.classList.toggle("on", b.dataset.s === id));
    swapContent(); return;
  }
  const cl = e.target.closest("[data-close]"); if (cl) { dismiss(cl.dataset.close); return; }
  if (e.target.closest("[data-ntp]")) { openNtp(); return; }
  if (ntp && !e.target.closest(".ntp")) closeNtp();
  const more = e.target.closest(".cover .more");
  if (more) { toggleMenu(more); return; }
  if (!e.target.closest(".dm")) closeMenu();
});
// 「···」：只放管整台服务器的三样（11-27 作者同意）；样子同共用件页那张菜单，服务器开着时导出、删除灰掉
let menu = null;
function toggleMenu(anchor) {
  if (menu) return closeMenu();
  const dis = st !== "stopped" ? ` aria-disabled="true" title="需先停止服务器"` : "";
  menu = Object.assign(document.createElement("div"), { className: "dm enter" }); menu.setAttribute("role", "menu");
  menu.innerHTML = `<div class="it" role="menuitem"><i data-ic="folder"></i>打开服务器文件夹</div>`
    + `<div class="it" role="menuitem"${dis}><i data-ic="share"></i>导出交接包…</div><div class="sep"></div><div class="it dgr" role="menuitem"${dis}><i data-ic="trash"></i>删除服务器…</div>`;
  document.body.appendChild(menu); KIT.hydrate(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.round(r.right - menu.offsetWidth) + "px"; menu.style.top = Math.round(r.bottom + 4) + "px";
  anchor.classList.add("open"); menu._a = anchor;
}
function closeMenu() { if (!menu) return; const m = menu; menu = null; m._a.classList.remove("open"); m.classList.remove("enter"); m.classList.add("leave"); setTimeout(() => m.remove(), 90); }
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); closeNtp(); } });

KIT_READY.then(() => { skBar(); head(); body(); KIT.hydrate(); });
</script>
</body>
</html>
