<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 新建服务器</title>
<script src="kit.js"></script>
<script src="pixel16.js"></script>
<script src="modrinth-sample.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: sticky; top: 0; z-index: 5;
        background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .tb img { width: 16px; height: 16px; image-rendering: pixelated; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }

  /* 照首页的样子：全部居中，上面留白，一句问话当标题（作者 11-26：标题栏里的「新建服务器」删掉，问话改成「想玩哪个？」）。
     基准 1280×800 下不滚动，底边留白 86 给底下的按钮 */
  .page { max-width: 1160px; margin: 0 auto; padding: 0 40px 86px; min-height: calc(100vh - 40px); box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; }
  /* 问话和下面大卡的间隔 28 → 48（作者 11-26：大卡和面板往下挪一点，离问话远一点） */
  .q { margin: 44px 0 48px; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -.01em; text-align: center; }
  /* 问话下面一行小字（作者 11-26，第二步「暂不预装可直接进入下一步」）：占在问话和面板原来那 48 的间隔里（8 + 20 + 20），面板不往下挪 */
  .q.has-sub { margin-bottom: 8px; }
  .qsub { margin: 0 0 20px; font-size: 13px; line-height: 20px; color: var(--muted); text-align: center; }

  /* 玩法：四张大卡，照首页大卡的做法（外圆角 26、内边距 8，核心色封面圆角 18 带方格暗纹，同心），图标 48 放在封面正中 */
  .plays { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; position: relative; }
  .play { --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1); cursor: pointer; transition: transform .15s; }
  .play:hover { transform: translateY(-2px); }
  /* 选中的玩法：强调色的框是单独的一块，换玩法时和核心、版本的高亮框一样平滑滑过去（作者 11-26）；
     选中的那张卡悬停上浮时框跟着浮 */
  .pframe { position: absolute; left: 0; top: 0; border-radius: 26px; box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; z-index: 2;
            transition: transform .32s cubic-bezier(.3, .7, .2, 1), translate .15s; }
  .plays:has(.play.on:hover) .pframe { translate: 0 -2px; }
  .cover { height: 80px; border-radius: 18px; display: grid; place-items: center; position: relative; overflow: hidden;
           background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
  .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .cover svg { position: relative; z-index: 1; width: 48px; height: 48px; display: block; }
  .play .t { margin: 10px 0 2px; font-size: 16px; font-weight: 600; text-align: center; }
  .play .s { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* 选好玩法以后，下面一块三列（作者 11-26 的主意，先做出来看效果）：一列介绍、一列选核心、一列选游戏版本。
     外面一块同首页大卡（外 26、内边距 8），三列是里面三块圆角 18 的面板，同心 */
  .pick { margin-top: 20px; width: 100%; --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1);
          display: flex; height: 296px; box-sizing: border-box; }
  /* 三列按 1.25 : 1 : 1 分，中间隔 8。用 flex 而不用 grid，是为了换玩法时两列、三列之间能平滑变过去 */
  .pick > .col { flex: 1 1 0; min-width: 0; margin-left: 8px;
                 transition: flex-grow .32s cubic-bezier(.3, .7, .2, 1), margin-left .32s cubic-bezier(.3, .7, .2, 1), padding .32s cubic-bezier(.3, .7, .2, 1); }
  .pick > .intro { flex-grow: 1.25; margin-left: 0; }
  /* 原版只有一个核心（作者 11-26）：两列，介绍宽一些、版本在右（3 : 2）。核心那列不拿掉，收成零宽、里面的东西淡掉；
     换回别的玩法时它再展开、东西淡回来 */
  .pick.two > .intro { flex-grow: 3; }
  .pick.two > #vercol { flex-grow: 2; }
  #corecol { overflow: hidden; }
  #corecol > * { min-width: 170px; transition: opacity .2s .12s; }
  .pick.two > #corecol { flex-grow: 0; margin-left: 0; padding-left: 0; padding-right: 0; }
  .pick.two > #corecol > * { opacity: 0; transition: opacity .1s; }
  .col { border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); padding: 14px; display: flex; flex-direction: column; min-height: 0; }
  .col h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .col h3 .sp { flex: 1; }
  /* 介绍：选中的核心，图标、名字、副标题、正文，左下角三行「适用场景」「支持扩展」「联机要求」 */
  /* 换核心时介绍这一块的过渡「逐项换」（作者 11-26 从四种里挑的）：动画在脚本 swapIntro 里 */
  .intro { overflow: hidden; }
  .intro .body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  /* 左上角的核心图标贴着面板的角：离边 8、圆角 10（18 − 8，同心圆角，作者 11-26 定）。面板内边距还是 14（三列宽度、正文位置都不变），
     图标和名字这一行整体往左上挪 6；图标下沿到正文还是 12 */
  .intro .head { display: flex; align-items: center; gap: 12px; margin: -6px 0 12px -6px; }
  .intro .head .cover { width: 56px; height: 56px; border-radius: 10px; flex: none; }
  .intro .head .cover svg { width: 32px; height: 32px; }
  .intro .nm { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .intro .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .intro p { margin: 0 0 12px; font-size: 13px; line-height: 21px; color: var(--text); }
  /* 右边那列用 minmax(0, 1fr)：列宽在变、旧的内容钉着原来的宽度时，它只往外伸出去，不把左边的小标题挤成竖排 */
  .intro dl { margin: auto 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 12.5px; }
  .intro dt { color: var(--faint); } .intro dd { margin: 0; color: var(--muted); }
  .rec { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: var(--accent-subtle); color: var(--accent-text); }
  /* 核心、版本：竖着的一列，一行一个，选中的底色变强调色；版本多了在列里自己滚 */
  .lwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none; margin: 0 -4px; padding: 0 12px 0 4px;
          --ft: 0px; --fb: 0px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%); }
  .list::-webkit-scrollbar { display: none; }
  .lwrap.can-up .list { --ft: 28px; } .lwrap.can-down .list { --fb: 28px; }
  .thumb { position: absolute; right: -6px; width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text) 38%, transparent);
           opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
  .lwrap:hover .thumb, .lwrap.scrolling .thumb, .thumb.drag { opacity: 1; }
  .thumb:hover, .thumb.drag { width: 6px; right: -7px; background: color-mix(in srgb, var(--text) 55%, transparent); }
  .lwrap.fits .thumb { display: none; }
  .row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 6px; border-radius: 12px; cursor: pointer; flex: none; font-size: 14px; font-weight: 500; }
  .row { position: relative; z-index: 1; }
  .row:hover:not(.on) { background: var(--hover); }
  .row.on { color: var(--accent-text); font-weight: 600; }
  /* 选中的高亮框是列表里单独的一块，换选择时平滑滑到新的那一行（作者 11-26）；核心和版本两列都这样 */
  .list { position: relative; }
  .hl { position: absolute; left: 4px; right: 12px; top: 0; height: 44px; border-radius: 12px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
        transition: transform .32s cubic-bezier(.3, .7, .2, 1), height .32s cubic-bezier(.3, .7, .2, 1); }
  .row svg { width: 32px; height: 32px; display: block; flex: none; }
  .row .sp { flex: 1; }
  .row .tag { font-size: 11.5px; color: var(--faint); font-weight: 400; }
  .row.on .tag { color: var(--accent-text); }
  .vrow { height: 36px; padding: 0 12px; font-family: var(--mono); font-size: 13.5px; }
  .vrow.snap:not(.on) { color: var(--muted); }
  .find { height: 30px; border-radius: 15px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border);
          color: var(--faint); font-size: 12px; font-weight: 400; width: 120px; }
  .find .ico { width: 13px; height: 13px; }

  /* 别的四种开服方式：页面最下面一行淡字，不抢眼（原来是一整页五张卡）。打头的「手上有现成的？」作者 11-26 删了，只留四个，文案和图标见脚本里的 alt */
  .alt { margin-top: auto; padding-top: 16px; display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--faint); }
  .alt span.b { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; color: var(--muted); cursor: pointer; }
  .alt span.b:hover { color: var(--text); background: var(--hover); }
  .alt .ico { width: 14px; height: 14px; }
  /* 第二步「选择预装插件」「选择预装模组」（11-26 主会话画的第一稿，文案作者改过）：和第一步同样的大面板（外 26、内边距 8，里面两块圆角 18），
     左边逛（标题 + 搜索、类别、两列卡片，卡片多了在这一块里自己滚，细滚动条和上下渐隐同第一步），右边是待装清单和「从电脑添加」。
     现在程序里这一步的东西都在（Modrinth 热门、搜索、类别、待装清单、从电脑添加、检查前置），这里重新排了一遍；
     前置不再要人点「检查前置」再勾，加一个就把它要的前置一起放进清单、标「前置」。基准 1280×800 下面板 170–690，不滚动 */
  .addon { width: 100%; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1);
           display: flex; gap: 8px; height: 520px; box-sizing: border-box; }
  /* 同心圆角（作者 11-26 问卡片合不合规范）：两块面板圆角 18，里面贴着角放的东西（最下面一排卡片、虚线框、清单的行）离边 8、圆角 10（18 − 8）。
     所以两块面板左右和底边的内边距是 8，顶上留 14 给标题；标题、类别、底下那行小字再往里缩 6，字还是离边 14、和第一步一样。
     卡片和清单列表不再左右各缩 4、右边也不再留 12 的滚动条槽：细滚动条放在面板右边那 8 像素里 */
  .addon > .col { min-width: 0; padding: 14px 8px 8px; }
  .addon .col h3 { padding: 0 6px; }
  .addon .list { margin: 0; padding: 0; overflow-x: hidden; }
  .addon .thumb { right: -6px; }
  /* 左右大约 72 : 28（Gemini 复审 11-26 提的，作者让看着采纳）：左边两列卡片宽一些，名字放得下；清单一行一个，窄一点也够 */
  .addon .browse { flex: 2.6 1 0; }
  .addon .cart { flex: 1 1 0; }
  .findin { height: 30px; border-radius: 15px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border);
            width: 170px; box-sizing: border-box; font-weight: 400; }
  .findin input { all: unset; flex: 1; min-width: 0; font-size: 12px; color: var(--text); }
  .findin input::placeholder { color: var(--faint); }
  .findin .ico { width: 13px; height: 13px; color: var(--faint); flex: none; }
  /* 放不下时横着滑（滚轮也能滑），哪头还有就在哪头渐隐，同首页左右滑的做法 */
  .chips { display: flex; gap: 5px; margin: 0 0 12px; padding: 0 6px; overflow-x: auto; scrollbar-width: none; flex: none; --fl: 0px; --fr: 0px;
           -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
           mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); }
  .chips::-webkit-scrollbar { display: none; }
  .chips.can-l { --fl: 28px; } .chips.can-r { --fr: 28px; }
  .chip { height: 28px; padding: 0 10px; border-radius: 14px; display: inline-flex; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer;
          white-space: nowrap; flex: none; box-shadow: inset 0 0 0 1px var(--border); transition: color .2s, background .2s, box-shadow .2s; }
  .chip:hover { color: var(--text); }
  /* 选中的分类：底色和细框是单独的一块，换分类时平滑滑过去、宽度跟着变（作者 11-26，同第一步核心、版本的高亮框）。
     选中的那个只换字色、去掉自己的灰框，字重不变（变粗会把后面的分类挤开，选中框量出来的宽度就不对了） */
  .chips { position: relative; }
  .chip { position: relative; z-index: 1; font-weight: 500; }
  .chip.on { color: var(--accent-text); box-shadow: none; }
  .chl { position: absolute; left: 0; top: 0; height: 28px; border-radius: 14px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
         box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
         transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
  /* 卡片：图标 40、名字和下载量一行、一句话一行，右边一个圆的 ＋；加进清单以后卡片底色换强调色、＋ 变 ✓（和第一步选中的高亮框同一个样子） */
  .list.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .mod { display: flex; align-items: center; gap: 12px; height: 74px; padding: 0 12px; border-radius: 10px; box-sizing: border-box; min-width: 0; cursor: pointer;
         background: color-mix(in srgb, var(--surface) 55%, transparent); transition: background .2s, box-shadow .2s; }
  .mod:hover { background: var(--hover); }
  .mod.in { background: var(--accent-subtle); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
  .mt { width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: rgb(255 255 255 / .92);
        background: var(--c); font-family: var(--mono); }
  .mt { position: relative; overflow: hidden; }
  .mt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mt.img { background: color-mix(in srgb, var(--text) 8%, transparent); color: transparent; }
  .mod .m, .crow .m { flex: 1; min-width: 0; }
  /* 三行（Gemini 复审 11-26 提的）：名字独占一行不再被挤断；一句话；下载量和「需客户端 / 仅服务端」收进第三行淡字 */
  .mod .n { font-size: 13.5px; font-weight: 600; line-height: 18px; white-space: nowrap; display: flex; align-items: center; gap: 3px; min-width: 0; }
  .mod .n .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* 名字后面一个小的「去 Modrinth 看介绍」（作者 11-26 要的）：平时淡，悬停卡片时亮一点，点它新开页面，不会把这张卡加进清单 */
  .ext { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); opacity: .75; transition: opacity .2s, color .2s, background .2s; }
  .mod:hover .ext { opacity: 1; }
  .ext:hover { color: var(--accent-text); background: var(--hover); }
  .ext .ico { width: 12px; height: 12px; }
  .mod .d { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .mod .meta { font-size: 11px; line-height: 14px; color: var(--faint); display: flex; align-items: center; gap: 5px; margin-top: 3px; white-space: nowrap; }
  .mod .meta .ico { width: 11px; height: 11px; }
  .ftag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 6px; color: var(--muted); background: color-mix(in srgb, var(--text) 8%, transparent); }
  .add { width: 30px; height: 30px; border-radius: 15px; flex: none; display: grid; place-items: center; color: var(--text); box-shadow: inset 0 0 0 1px var(--border);
         transition: background .2s, color .2s, box-shadow .2s; }
  .mod:hover .add { background: var(--hover); }
  .mod.in .add { background: var(--accent-solid); color: var(--on-accent); box-shadow: none; }
  .add .ico { width: 15px; height: 15px; }
  /* 等下一批时的骨架卡：和真卡片一样大，灰块一明一暗地呼吸 */
  .mod.skel { cursor: default; animation: skel 1.1s ease-in-out infinite alternate; }
  .mod.skel:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .mod.skel .mt { background: color-mix(in srgb, var(--text) 10%, transparent); }
  .mod.skel .m i { display: block; height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--text) 10%, transparent); margin: 5px 0; }
  .mod.skel .m i:nth-child(1) { width: 46%; height: 11px; } .mod.skel .m i:nth-child(2) { width: 78%; } .mod.skel .m i:nth-child(3) { width: 30%; }
  @keyframes skel { from { opacity: .55; } to { opacity: 1; } }
  .gend { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--faint); padding: 10px 0 6px; }
  /* 待装清单：一行一个，图标 28、名字、第二行小字（前置是谁要的、朋友那边要不要装），悬停出 ×；空的时候一段说明 */
  .cart h3 .cnt { font-family: var(--mono); color: var(--accent-text); }
  /* 清单里有东西时右上角出一个淡的「清空」（Gemini 复审 11-26 提的） */
  .cart h3 .clr { font-weight: 500; color: var(--faint); cursor: pointer; padding: 3px 8px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, color .2s; }
  .cart.has h3 .clr { opacity: 1; pointer-events: auto; }
  .cart h3 .clr:hover { color: var(--text); background: var(--hover); }
  .crow { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; border-radius: 10px; flex: none; overflow: hidden; }
  .crow:hover { background: var(--hover); }
  .crow .mt { width: 28px; height: 28px; border-radius: 6px; font-size: 12px; }
  .crow .n { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .crow .why { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .crow .x { width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; color: var(--faint); cursor: pointer; opacity: 0; flex: none; }
  .crow:hover .x { opacity: 1; }
  .crow .x:hover { color: var(--text); background: var(--hover); }
  .crow .x .ico { width: 13px; height: 13px; }
  .cempty { margin: auto 0; text-align: center; color: var(--faint); font-size: 12px; line-height: 20px; padding: 0 18px; }
  .cempty b { display: block; margin-bottom: 4px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  #atitle { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
  #atitle .asub { font-weight: 400; color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
  /* 空清单那段话：最后一行真被拿掉以后才出来，淡进来（作者 11-26：拿掉最后一个时，这段话一出来就上下居中、把还在淡出的那一行挤到了清单底下）。
     所以藏它的条件是「还有行」，正在淡出的也算 */
  .list:has(.crow) .cempty { display: none; }
  .cempty { animation: cempty-in .26s cubic-bezier(.2, .7, .2, 1); }
  @keyframes cempty-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .cnote { flex: none; font-size: 12px; color: var(--muted); margin-top: 10px; padding: 0 6px; display: flex; gap: 6px; align-items: center; }
  .cnote:empty { display: none; }
  .cnote .ico { width: 14px; height: 14px; color: var(--faint); }
  .drop { flex: none; margin-top: 10px; height: 44px; border-radius: 10px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center;
          gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s; }
  .drop:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .drop .ico { width: 15px; height: 15px; }
  /* 第三步「最后设置一下」（11-26 主会话画的第一稿）：现在程序里「基本设置」那一页的东西都在，重新排成和前两步一样的大面板（外 26、内边距 8）：
     左边「服务器」（头像、名称、端口一行，名称下面是存放路径；内存；服务器介绍），右边「游戏规则」（难度、默认游戏模式两排分段选，
     选中的底色滑过去，同前两步；允许飞行一个开关），最底下横跨两块的一条是 EULA（贴着面板的角，圆角 18 = 26 − 8）。
     11-26 作者指出这一页忘了计划书开头的规矩（少字让图标说话、一个值只说一次、同心圆角、连续曲率），照着改过一遍：
     说明字收进悬停（端口可用、存放位置、服务器介绍、允许飞行、推荐内存），一样高的控件一律 40 高、圆角 10，不用系统自带的滑条和数字框箭头。
     第一稿右边还有正版验证、白名单两个开关，作者问「联机开不开」这两步怎么接以后挪到了第四步「谁能进」（见第四步的注释）。
     EULA 没勾时点「下一步」不往下走，那一条标红、左右晃一下。代理端没有端口、介绍、游戏规则和 EULA，右边换成一句话。
     说明字收掉以后内容矮了一截，第三步的面板改成按内容的高度，不再撑满 520、底下空一大块（第四步内容会随选择变高变矮，仍固定 520） */
  .setp:not(.link) { height: auto; }
  .setp { width: 100%; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); box-sizing: border-box; height: 520px;
          display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; } /* minmax(0, …)：存放路径不换行，长了不许把这一列撑宽 */
  .setp .col { padding: 14px 16px; gap: 16px; }
  .setp .col h3 { margin: 0 0 -4px; }
  .fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fld > .lb { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
  .fld > .lb .sp { flex: 1; }
  .inp { height: 40px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); padding: 0 12px; box-sizing: border-box; width: 100%;
         font: inherit; font-size: 14px; color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; }
  .inp:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .inp.bad { border-color: color-mix(in srgb, var(--danger-text) 70%, var(--border)); }
  .fnote { font-size: 12px; line-height: 18px; color: var(--faint); display: flex; align-items: center; gap: 5px; min-height: 18px; }
  .fnote b { color: var(--muted); font-weight: 500; font-family: var(--mono); font-size: 11.5px; }
  .fnote a { color: var(--accent-text); cursor: pointer; white-space: nowrap; }
  .fnote .ico { width: 13px; height: 13px; flex: none; }
  .fnote.bad { color: var(--danger-text); }
  /* 头像、名称、端口一行（作者 11-26：名称和端口放同一行；头像和首页卡片上的统一）。头像 64 = 「名称」两个字那行 18 + 间距 6 + 输入框 40，
     顶上和「名称」对齐、底下和输入框对齐；不在栏的角上，圆角不受同心的限制，取 14 */
  .nrow { display: flex; gap: 14px; align-items: flex-start; min-width: 0; } /* min-width 0：路径不换行，不加的话整行会被撑宽 */
  .nrow .nm { flex: 1; }
  .nrow .port { width: 132px; flex: none; }
  /* 存放路径：文件夹图标加路径，整行就是「更改位置」的按钮（悬停变强调色、提示「更改存放位置…」），不再另写「更改位置…」几个字 */
  .fpath { display: flex; align-items: center; gap: 5px; min-width: 0; height: 18px; font-size: 12px; color: var(--faint); cursor: pointer; white-space: nowrap; transition: color .2s; }
  .fpath .ico { width: 13px; height: 13px; flex: none; }
  .fpath b { display: flex; min-width: 0; font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--muted); transition: color .2s; }
  .fpath b .hd, .fpath b .tl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .fpath b .hd { flex-shrink: 1000; min-width: 1.6ch; } /* 先省上级目录（至少留一个省略号），省完了文件夹名太长才省文件夹名 */
  .fpath:hover, .fpath:hover b { color: var(--accent-text); }
  /* 端口：对不对只用输入框里右边一个图标表示（对是勾、悬停「端口可用」）；不对会拦下一步，所以框标红、下面再写一句短的 */
  .iwrap { position: relative; }
  .iwrap .inp { padding-right: 36px; }
  .iwrap .st { position: absolute; right: 12px; top: 0; bottom: 0; display: flex; align-items: center; color: var(--accent-text); }
  .iwrap .st.bad { color: var(--danger-text); }
  .iwrap .st .ico { width: 15px; height: 15px; }
  .avbtn { position: relative; flex: none; width: 64px; height: 64px; border-radius: 14px; cursor: pointer; }
  .sav { --c: #7a8aa0; width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; overflow: hidden;
         background: color-mix(in srgb, var(--c) 26%, var(--surface)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
  .sav svg { width: 48px; height: 48px; display: block; }
  .sav.icon { background: #000; }
  .sav.icon img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
  .avov { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center;
          background: rgb(0 0 0 / .55); color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .avov .ico { width: 20px; height: 20px; }
  .avbtn:hover .avov { opacity: 1; }
  .avx { position: absolute; right: -6px; top: -6px; width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; cursor: pointer;
         background: var(--overlay); color: var(--muted); box-shadow: 0 0 0 1px var(--border), var(--elev-1); opacity: 0; transition: opacity .2s; }
  .avx .ico { width: 11px; height: 11px; }
  .avbtn:hover .avx { opacity: 1; }
  .avx:hover { color: var(--text); }
  /* 内存（作者 11-26 先要了程序原来的控件，又说「这么一个模块有好几处地方在告诉用户内存分配可多少」）：
     留程序那排经验条式的格子（颜色、先后照程序：灰的其他程序已用、接着强调色的本服分配、淡的空着；1 格 = 512 MB，内存大时放大到最多约 48 格），
     格子本身就是滑条——点、拖、方向键都能改，竖着的小把手停在本服那一截的末端；右边一个 MB 数字框，是这一块里唯一写着数的地方。
     原来的大号 GB 数、系统滑条、统计和推荐两行都拿掉：统计和推荐收进格子的悬停提示。超过可用内存会改变结果（可能卡、可能起不来），
     所以本服那一截变红、标题那行右边写「超出可用 …」、数字框标红；超过 16 GB 只是提醒，数字框里一个黄色警告图标，悬停看原因 */
  .memx { display: flex; align-items: center; gap: 12px; }
  .mbar { position: relative; flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; cursor: pointer; touch-action: none; outline: none; }
  .mbar .cells { display: flex; gap: 2px; width: 100%; height: 14px; }
  .mbar .cells i { flex: 1; border-radius: 1px; background: color-mix(in srgb, var(--text) 9%, transparent); transition: background .12s; }
  .mbar .cells i.used { background: color-mix(in srgb, var(--text) 30%, transparent); }
  .mbar .cells i.alloc { background: var(--accent); box-shadow: inset 0 2px 0 rgb(255 255 255 / .3), inset 0 -2px 0 rgb(0 0 0 / .16); }
  .mbar .cells i.over { background: var(--danger); box-shadow: inset 0 2px 0 rgb(255 255 255 / .3), inset 0 -2px 0 rgb(0 0 0 / .16); }
  /* 把手：6 × 24 的竖胶囊（圆角 = 宽的一半） */
  .mbar .knob { position: absolute; top: 50%; left: 0; width: 6px; height: 24px; margin: -12px 0 0 -3px; border-radius: 3px; background: var(--text); pointer-events: none;
                 box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent), 0 1px 3px rgb(0 0 0 / .35); }
  .mbar:not(.drag) .knob { transition: left .16s cubic-bezier(.3, .7, .2, 1); }
  .mbar:focus-visible .knob { box-shadow: 0 0 0 3px var(--accent), 0 1px 3px rgb(0 0 0 / .35); }
  .mbar.drag { cursor: grabbing; }
  .unit { flex: none; width: 116px; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 10px; box-sizing: border-box; cursor: text;
          background: var(--field); border: 1px solid var(--border); font-size: 12.5px; color: var(--faint); transition: border-color .2s, box-shadow .2s; }
  .unit:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .unit input { flex: 1; min-width: 0; width: 100%; padding: 0; border: 0; background: none; outline: none; font: inherit; font-size: 14px; color: var(--text);
                text-align: right; font-variant-numeric: tabular-nums; appearance: textfield; -moz-appearance: textfield; }
  .unit input::-webkit-inner-spin-button, .unit input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .unit .mw { display: grid; flex: none; }
  .unit .mw:empty { display: none; }
  .unit .mw .ico { width: 14px; height: 14px; }
  .unit.bad { border-color: color-mix(in srgb, var(--danger-text) 70%, var(--border)); }
  .unit.bad .mw { color: var(--danger-text); }
  .unit.warn .mw { color: var(--warning-text); }
  .fld > .lb .over { margin-left: auto; color: var(--danger-text); }
  /* 分段选：和输入框一样 40 高、圆角 10；选中的底色离外框 4（边框 1 加内边距 3）、圆角 6（10 − 4，同心），换选择时滑过去 */
  .seg { position: relative; display: flex; padding: 3px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); box-sizing: border-box; height: 40px; }
  .seg span { flex: 1; position: relative; z-index: 1; display: grid; place-items: center; font-size: 13px; color: var(--muted); border-radius: 6px; cursor: pointer; transition: color .2s; }
  .seg span:hover { color: var(--text); }
  .seg span.on { color: var(--accent-text); font-weight: 500; }
  .seg .sgl { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 6px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
              box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
              transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
  /* 开关：36 × 20，圆钮 16（离边 2，圆角 10 − 2 = 8） */
  .tg { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .tg .m { flex: 1; min-width: 0; }
  .tg .t { font-size: 13.5px; font-weight: 600; }
  .tg .t code { font-family: var(--mono); font-size: 11.5px; font-weight: 400; color: var(--faint); margin-left: 6px; }
  .tg .d { font-size: 12px; line-height: 18px; color: var(--muted); margin-top: 2px; }
  .sw { width: 36px; height: 20px; border-radius: 10px; flex: none; position: relative; background: color-mix(in srgb, var(--text) 18%, transparent); transition: background .2s; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--text);
               transition: transform .26s cubic-bezier(.3, .7, .2, 1); }
  .tg.on .sw { background: var(--accent-solid); }
  .tg.on .sw::after { transform: translateX(16px); background: var(--on-accent); }
  .pnote { margin: auto 0; text-align: center; font-size: 12.5px; line-height: 21px; color: var(--muted); padding: 0 24px; }
  .eula { grid-column: 1 / -1; border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); height: 52px; padding: 0 18px;
          display: flex; align-items: center; gap: 12px; font-size: 13px; cursor: pointer; transition: box-shadow .2s; }
  .eula a { color: var(--accent-text); }
  .eula .msg { margin-left: auto; font-size: 12px; color: var(--danger-text); opacity: 0; transition: opacity .2s; }
  .eula.bad { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger-text) 60%, transparent); }
  .eula.bad .msg { opacity: 1; }
  .placeholder { margin-top: 24px; width: 100%; height: 360px; border-radius: 26px; border: 1px dashed var(--border); display: grid; place-items: center; color: var(--faint); font-size: 13px; }
  /* 第四步「让朋友连进来」（11-26 主会话画的第一稿）：和第三步一样大的面板，两块。
     左边「朋友怎么连」：只在局域网 / 开内网穿透，二选一，默认局域网；选中的底色上下滑（同前几步的选中框）。底下跟着选的那样逐项换（竖着挪）：
     局域网是朋友要填的地址，内网穿透是挑平台（三张小卡，选中的底色左右滑；底下一段跟着平台横着逐项换）。
     右边「谁能进」：正版验证、白名单（从第三步挪过来）；白名单打开时底下展开一栏，可以先把朋友的游戏名加进来；
     最底下一句跟着两边的选择变，该提醒的时候是黄底。行、卡片离边都有 16，圆角不受同心的限制；输入框里贴边 5 的小块圆角 5（10 − 5） */
  .setp.link { grid-template-rows: minmax(0, 1fr); }
  .via { position: relative; display: flex; flex-direction: column; gap: 4px; }
  .via .vhl, .plats .phl { position: absolute; left: 0; top: 0; border-radius: 12px; background: var(--accent-subtle); pointer-events: none;
                           box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
                           transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1), height .32s cubic-bezier(.3, .7, .2, 1); }
  .via .vhl { right: 0; }
  .plats .phl { bottom: 0; }
  .opt { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; cursor: pointer; transition: background .2s, opacity .2s; }
  .opt:hover:not(.on):not(.off) { background: var(--hover); }
  .opt .oi { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--muted); flex: none; transition: color .2s; }
  .opt .oi .ico { width: 18px; height: 18px; }
  .opt.on .oi { color: var(--accent-text); }
  .opt .m { min-width: 0; }
  .opt .t { font-size: 14px; font-weight: 600; }
  .opt.on .t { color: var(--accent-text); }
  .opt .d { font-size: 12px; line-height: 18px; color: var(--muted); margin-top: 1px; }
  .opt.off { opacity: .5; cursor: default; }
  .vdet, .pdet { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .vdet { margin-top: 2px; }
  .pdet { margin-top: 4px; }
  .vdet > .lb { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .addr { display: flex; align-items: center; height: 40px; padding: 0 6px 0 12px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); box-sizing: border-box; }
  .addr .mono { font-size: 14px; }
  .addr .unk { margin-left: 2px; font-size: 12.5px; color: var(--faint); }
  .addr .sp { flex: 1; }
  .ib { width: 28px; height: 28px; border-radius: 4px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, color .2s; }
  .ib:hover { background: var(--hover); color: var(--text); }
  .ib .ico { width: 15px; height: 15px; }
  .ib.done { color: var(--accent-text); }
  .plats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .plat { position: relative; z-index: 1; padding: 9px 12px; border-radius: 12px; cursor: pointer; background: color-mix(in srgb, var(--surface) 70%, transparent); transition: background .2s; min-width: 0; }
  .plat:hover:not(.on) { background: var(--hover); }
  .plat.on { background: transparent; }
  .plat .n { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .plat.on .n { color: var(--accent-text); }
  .plat .m { font-size: 12px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--faint); flex: none; }
  .dot.ok { background: var(--success); }
  .fnote a + a { margin-left: 12px; }
  .fnote.p { display: block; } /* 一段话里夹着端口号这种 <b> 的：照段落排，不按 flex 拆成几块 */
  .conn { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 13px; color: var(--muted); transition: color .2s; }
  .conn.bad { color: var(--danger-text); }
  .conn .ico { width: 15px; height: 15px; }
  .spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sbtn { height: 30px; padding: 0 14px; border-radius: var(--r-full); border: 0; background: var(--accent-subtle); color: var(--accent-text); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .sbtn:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .frps { display: flex; gap: 6px; }
  .frps .inp { flex: 1; min-width: 0; font-size: 13px; }
  .frps .fport { flex: none; width: 76px; }
  .tg.sm .t { font-size: 13px; }
  .tg.sm { margin-top: 4px; }
  /* 白名单名单：开关打开时从零高展开（grid 0fr → 1fr），关上时收回去；列里的间距 16 跟着收成负的，不留空 */
  .wlx { display: grid; grid-template-rows: 0fr; margin-top: -16px; opacity: 0;
         transition: grid-template-rows .32s cubic-bezier(.3, .7, .2, 1), margin-top .32s cubic-bezier(.3, .7, .2, 1), opacity .2s; }
  .wlx.open { grid-template-rows: 1fr; margin-top: -4px; opacity: 1; }
  .wlin { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
  .names { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 40px; padding: 5px; box-sizing: border-box; border-radius: 10px;
           background: var(--field); border: 1px solid var(--border); cursor: text; transition: border-color .2s; }
  .names:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
  .names.bad { border-color: color-mix(in srgb, var(--danger-text) 70%, var(--border)); }

function placeHLOf(boxSel, hlSel, onSel, axis, animate) {
  const box = document.querySelector(boxSel); if (!box) return;
  const hl = box.querySelector(hlSel), on = box.querySelector(onSel); if (!hl || !on) return;
  if (!animate) hl.style.transition = "none";
  const bb = box.getBoundingClientRect(), ob = on.getBoundingClientRect(); // 平台三张卡是三等分，宽度带小数，用 offsetLeft 会差零点几像素
  if (axis === "Y") { hl.style.transform = `translateY(${ob.top - bb.top}px)`; hl.style.height = ob.height + "px"; }
  else { hl.style.transform = `translateX(${ob.left - bb.left}px)`; hl.style.width = ob.width + "px"; }

}

    if (box._tok !== tok) return;
    box.innerHTML = html; KIT.hydrate(box); after?.();

    clearTimeout(cp._t); cp._t = setTimeout(() => { cp.classList.remove("done"); cp.innerHTML = `<i data-ic="copy"></i>`; KIT.hydrate(cp); }, 1200);
    return;
  }
  if (e.target.closest(".names")) { document.getElementById("wlname")?.focus(); return; }
  if (eu && !e.target.closest("a")) { SET.eula = !SET.eula; eu.querySelector(".tg").classList.toggle("on", SET.eula); if (SET.eula) eu.classList.remove("bad"); return; }
  if (e.target.closest('[data-act="root"]')) return; // 草图里不真弹选文件夹的窗口
  if (e.target.closest('[data-act="unicon"]')) { SET.icon = ""; repaintAvatar(); return; }
  if (e.target.closest('[data-act="icon"]')) { pickIcon(); return; }
  const pl = e.target.closest("[data-play]"), co = e.target.closest("[data-core]"), ve = e.target.closest("[data-ver]");
  const ad = e.target.closest("[data-addon]"), un = e.target.closest("[data-unpick]"), ch = e.target.closest("[data-cat]");
  if (pl) selectPlay(+pl.dataset.play);
  else if (co) selectCore(co.dataset.core);
  else if (ve) selectVer(ve.dataset.ver);
  else if (ad) toggleAddon(ad.dataset.addon);
  else if (un) toggleAddon(un.dataset.unpick);
  else if (ch && ch.dataset.cat !== acat) {
    const chips = [...document.querySelectorAll(".chip")], at = k => chips.findIndex(c => c.dataset.cat === k);
    const dir = at(ch.dataset.cat) > at(acat) ? 1 : -1;
    acat = ch.dataset.cat; regrid(dir);
    ch.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" }); // 分类放不下、点到半露在边上的那个时，把它滑进来
  }
  else if (e.target.closest("[data-clear]")) { picked = []; syncAddons(true); }
});
// 第三步的输入框和滑条：边输边记，名称跟着改存放位置那行，端口跟着改「可用 / 不对」，内存跟着改数字和滑条左边那截
document.getElementById("page").addEventListener("input", e => {
  const t = e.target;
  if (t.id === "sname") { SET.name = t.value; SET.nameTouched = true; t.classList.remove("bad"); const p = document.getElementById("spath"); p.innerHTML = pathNote(); p.title = pathTip(); KIT.hydrate(p); }
  else if (t.id === "sport") {
    SET.port = t.value.trim(); t.classList.toggle("bad", !portOk());
    const st = document.getElementById("pst"); st.innerHTML = portState(); KIT.hydrate(st);
    document.getElementById("perr").textContent = portOk() ? "" : "需 1~65535";
  }
  else if (t.id === "smemn") { if (t.value !== "") setMem(memClamp(t.value)); }
  else if (t.id === "smotd") SET.motd = t.value;
  else if (t.id === "fhost" || t.id === "fport" || t.id === "ftoken") { LINK.frps[{ fhost: "host", fport: "port", ftoken: "token" }[t.id]] = t.value; t.classList.remove("bad"); }
  else if (t.id === "wlname") {
    const box = document.getElementById("names"), note = document.getElementById("wlnote");
    if (box.classList.contains("bad")) { box.classList.remove("bad"); note.classList.remove("bad"); note.textContent = "建好后在「玩家」里也能加减"; }
  }
});
document.getElementById("page").addEventListener("keydown", e => {
  if (e.target.id !== "wlname" || e.isComposing) return;
  const t = e.target;
  if (e.key === "Enter" || e.key === " " || e.key === ",") { e.preventDefault(); addName(t.value); }
  else if (e.key === "Backspace" && !t.value && LINK.names.length) removeName(LINK.names[LINK.names.length - 1]);
});
// 数字框改完（失焦、回车）：照程序把数字框也收进上下限
document.getElementById("page").addEventListener("change", e => { if (e.target.id === "smemn") e.target.value = SET.mem; });
// 内存那排格子：点、拖
document.getElementById("page").addEventListener("pointerdown", e => {
  const bar = e.target.closest("#smbar"); if (!bar || e.button !== 0) return;
  e.preventDefault(); bar.focus({ preventScroll: true }); bar.setPointerCapture(e.pointerId); bar.classList.add("drag");
  const move = ev => setMem(memAt(bar, ev.clientX));
  const up = () => { bar.classList.remove("drag"); bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up); };
  move(e); bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
});
// 方向键一次一格，Home 最少、End 最多
document.getElementById("page").addEventListener("keydown", e => {
  if (e.target.id !== "smbar") return;
  const up = (Math.floor(SET.mem / CELL_MB) + 1) * CELL_MB, down = (Math.ceil(SET.mem / CELL_MB) - 1) * CELL_MB; // 不在整格上（比如 512、5000）时先走到相邻的整格
  const map = { ArrowRight: up, ArrowUp: up, ArrowLeft: down, ArrowDown: down, Home: 512, End: MEM_MAX };
  if (!(e.key in map)) return;
  e.preventDefault(); setMem(memClamp(map[e.key]));
});
addEventListener("resize", () => paintMem());
// 选服务器图标：草图里用浏览器自己的选文件框，挑的图只在这一页显示，不存
function pickIcon() {
  const f = document.createElement("input"); f.type = "file"; f.accept = "image/png,image/jpeg,image/webp";
  f.onchange = () => { const x = f.files[0]; if (!x) return; SET.icon = URL.createObjectURL(x); repaintAvatar(); };
  f.click();
}
function repaintAvatar() {
  const b = document.querySelector(".avbtn"); if (!b) return;
  b.outerHTML = avatarBtn(); const nb = document.querySelector(".avbtn"); KIT.hydrate(nb);
  nb.querySelector(".sav").animate([{ opacity: 0, transform: "scale(.92)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: "cubic-bezier(.2, .7, .2, 1)" });
}
// 搜索框：停手 0.18 秒再筛
document.getElementById("page").addEventListener("input", e => {
  if (e.target.id !== "aq") return;
  clearTimeout(aqTimer); aqTimer = setTimeout(() => { aq = e.target.value.trim(); regrid(); }, 180);
});
// 换步：整页内容往走的方向滑一小段淡掉，新的一步从另一边滑进来（下一步往左走、上一步往右走），问话跟着一起换
let stepping = false;
function goStep(n) {
  if (stepping || n === step) return;
  stepping = true;
  const page = document.getElementById("page"), dir = n > step ? 1 : -1;
  const out = page.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-16 * dir}px)` }], { duration: 140, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" });
  out.onfinish = () => {
    step = n; render(); out.cancel();
    page.animate([{ opacity: 0, transform: `translateX(${16 * dir}px)` }, { opacity: 1, transform: "none" }], { duration: 260, easing: "cubic-bezier(.2, .7, .2, 1)" })
      .onfinish = () => { stepping = false; };
  };
}
document.getElementById("next").addEventListener("click", () => {
  if (STEPS()[step] === "最后设置一下" && !checkSettings()) return;
  if (STEPS()[step] === "让朋友连进来" && !checkLink()) return;
  if (step < STEPS().length - 1) goStep(step + 1);
});
document.getElementById("back").addEventListener("click", () => {
  if (step > 0) { goStep(step - 1); return; }
  // 第一步再往回：按钮沉下去，回首页，胶囊从下面浮上来
  document.body.classList.add("hidden-nav");
  const q = new URLSearchParams(location.search); q.set("enter", "1");
  setTimeout(() => { location.href = "home.html?" + q.toString(); }, 320);
});
KIT_READY.then(() => { render(); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("hidden-nav"))); });
</script>
</body>
