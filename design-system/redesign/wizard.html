<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 新建服务器</title>
<script src="kit.js"></script>
<script src="pixel16.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: sticky; top: 0; z-index: 5;
        background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .tb img { width: 16px; height: 16px; image-rendering: pixelated; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }

  /* 照首页的样子：全部居中，上面留白，一句问话当标题（作者 11-26：标题栏里的「新建服务器」删掉，问话改成「想玩哪个？」）。
     基准 1280×800 下不滚动，底边留白 86 给底下的按钮 */
  .page { max-width: 1160px; margin: 0 auto; padding: 0 40px 86px; min-height: calc(100vh - 40px); box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; }
  .q { margin: 44px 0 28px; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -.01em; text-align: center; }

  /* 玩法：四张大卡，照首页大卡的做法（外圆角 26、内边距 8，核心色封面圆角 18 带方格暗纹，同心），图标 48 放在封面正中 */
  .plays { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .play { --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1); cursor: pointer;
          outline: 2px solid transparent; outline-offset: -2px; transition: outline-color .15s, transform .15s; }
  .play:hover { transform: translateY(-2px); }
  .play.on { outline-color: var(--accent); }
  .cover { height: 80px; border-radius: 18px; display: grid; place-items: center; position: relative; overflow: hidden;
           background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
  .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .cover svg { position: relative; z-index: 1; width: 48px; height: 48px; display: block; }
  .play .t { margin: 10px 0 2px; font-size: 16px; font-weight: 600; text-align: center; }
  .play .s { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* 选好玩法以后，下面一块三列（作者 11-26 的主意，先做出来看效果）：一列介绍、一列选核心、一列选游戏版本。
     外面一块同首页大卡（外 26、内边距 8），三列是里面三块圆角 18 的面板，同心 */
  .pick { margin-top: 20px; width: 100%; --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1);
          display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 8px; height: 296px; box-sizing: border-box; }
  /* 原版只有一个核心（作者 11-26）：两列，介绍宽一些、版本在右 */
  .pick.two { grid-template-columns: 3fr 2fr; }
  .col { border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); padding: 14px; display: flex; flex-direction: column; min-height: 0; }
  .col h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .col h3 .sp { flex: 1; }
  /* 介绍：选中的核心，图标、名字、副标题、正文，左下角三行「适用场景」「支持扩展」「联机要求」 */
  /* 换核心时介绍这一块的过渡（作者 11-26）：新内容从模糊里浮出来，同时一道斜的、模糊的亮带从左往右扫过去（扫光） */
  .intro { position: relative; overflow: hidden; }
  .intro .body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .intro.swap .body { animation: intro-in .42s cubic-bezier(.2, .7, .2, 1); }
  @keyframes intro-in { from { opacity: 0; filter: blur(6px); transform: translateY(6px); } to { opacity: 1; filter: none; transform: none; } }
  .intro::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 42%; pointer-events: none; opacity: 0; z-index: 2;
    background: linear-gradient(100deg, transparent 0%, var(--sheen) 50%, transparent 100%); filter: blur(12px); transform: translateX(-130%) skewX(-14deg); }
  :root { --sheen: rgb(255 255 255 / .16); } :root[data-theme="light"] { --sheen: color-mix(in srgb, var(--accent) 26%, transparent); }
  .intro.swap::after { animation: sheen .75s cubic-bezier(.3, .6, .3, 1); }
  @keyframes sheen { 0% { opacity: 0; transform: translateX(-130%) skewX(-14deg); } 18% { opacity: 1; } 100% { opacity: 0; transform: translateX(280%) skewX(-14deg); } }
  .intro .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .intro .head .cover { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  .intro .head .cover svg { width: 32px; height: 32px; }
  .intro .nm { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .intro .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .intro p { margin: 0 0 12px; font-size: 13px; line-height: 21px; color: var(--text); }
  .intro dl { margin: auto 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; }
  .intro dt { color: var(--faint); } .intro dd { margin: 0; color: var(--muted); }
  .rec { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: var(--accent-subtle); color: var(--accent-text); }
  /* 核心、版本：竖着的一列，一行一个，选中的底色变强调色；版本多了在列里自己滚 */
  .lwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none; margin: 0 -4px; padding: 0 12px 0 4px;
          --ft: 0px; --fb: 0px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%); }
  .list::-webkit-scrollbar { display: none; }
  .lwrap.can-up .list { --ft: 28px; } .lwrap.can-down .list { --fb: 28px; }
  .thumb { position: absolute; right: -6px; width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text) 38%, transparent);
           opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
  .lwrap:hover .thumb, .lwrap.scrolling .thumb, .thumb.drag { opacity: 1; }
  .thumb:hover, .thumb.drag { width: 6px; right: -7px; background: color-mix(in srgb, var(--text) 55%, transparent); }
  .lwrap.fits .thumb { display: none; }
  .row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 6px; border-radius: 12px; cursor: pointer; flex: none; font-size: 14px; font-weight: 500; }
  .row { position: relative; z-index: 1; }
  .row:hover:not(.on) { background: var(--hover); }
  .row.on { color: var(--accent-text); font-weight: 600; }
  /* 选中的高亮框是列表里单独的一块，换选择时平滑滑到新的那一行（作者 11-26）；核心和版本两列都这样 */
  .list { position: relative; }
  .hl { position: absolute; left: 4px; right: 12px; top: 0; height: 44px; border-radius: 12px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
        transition: transform .32s cubic-bezier(.3, .7, .2, 1), height .32s cubic-bezier(.3, .7, .2, 1); }
  .row svg { width: 32px; height: 32px; display: block; flex: none; }
  .row .sp { flex: 1; }
  .row .tag { font-size: 11.5px; color: var(--faint); font-weight: 400; }
  .row.on .tag { color: var(--accent-text); }
  .vrow { height: 36px; padding: 0 12px; font-family: var(--mono); font-size: 13.5px; }
  .vrow.snap:not(.on) { color: var(--muted); }
  .find { height: 30px; border-radius: 15px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border);
          color: var(--faint); font-size: 12px; font-weight: 400; width: 120px; }
  .find .ico { width: 13px; height: 13px; }
  .build { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .build a { color: var(--accent-text); }

  /* 别的四种开服方式：页面最下面一行淡字，不抢眼（原来是一整页五张卡） */
  .alt { margin-top: auto; padding-top: 16px; display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--faint); }
  .alt span.b { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; color: var(--muted); cursor: pointer; }
  .alt span.b:hover { color: var(--text); background: var(--hover); }
  .alt .ico { width: 14px; height: 14px; }
  .placeholder { margin-top: 24px; width: 100%; height: 360px; border-radius: 26px; border: 1px dashed var(--border); display: grid; place-items: center; color: var(--faint); font-size: 13px; }

  /* 底部：胶囊沉下去以后，左下角「上一步」、右下角「下一步」，和版心的左右边对齐，高度和离底跟胶囊一样（52、18）；
     中间一排小点是第几步（主会话加的，不要可以去掉） */
  .wnav { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 10; pointer-events: none; }
  .wnav .in { max-width: 1160px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; }
  .wnav .sp { flex: 1; }
  .wbtn { pointer-events: auto; height: 52px; padding: 0 22px; border-radius: 26px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
          border: 1px solid var(--border); box-shadow: var(--elev-3); transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s; }
  .wbtn.back { color: var(--text); background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2); }
  .wbtn.back .ico { transform: rotate(180deg); }
  .wbtn.next { color: var(--on-accent); background: var(--accent-solid); border-color: transparent; }
  .wbtn.next:hover { background: var(--accent-solid-hov); }
  .dots { display: flex; gap: 8px; pointer-events: auto; transition: opacity .32s; }
  .dots i { width: 8px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent); }
  .dots i.on { width: 22px; background: var(--accent); }
  body.hidden-nav .wbtn { transform: translateY(160%); opacity: 0; }
  body.hidden-nav .dots { opacity: 0; }
</style>
</head>
<body class="hidden-nav">
<header class="tb"><img src="../../internal/web/ui/img/logo-16.png" alt=""><div class="sp"></div>
  <div class="win"><span><i data-ic="winMin"></i></span><span><i data-ic="winMax"></i></span><span><i data-ic="winClose"></i></span></div></header>
<main class="page" id="page"></main>
<div class="wnav"><div class="in">
  <button class="wbtn back" id="back"><i data-ic="chevronRight"></i>上一步</button>
  <span class="sp"></span><span class="dots" id="dots"></span><span class="sp"></span>
  <button class="wbtn next" id="next">下一步<i data-ic="chevronRight"></i></button>
</div></div>
<script>
// 玩法四块（问题 U05 定的方向）：每块下面只列这一类的核心，推荐的预先选好
const PLAYS = [
  { id: "vanilla", t: "原版", s: "官方原版核心，无插件与模组", ico: "vanilla", cores: ["vanilla"], rec: "vanilla" },
  { id: "plugin", t: "插件", s: "插件与优化，原版直连", ico: "paper", cores: ["paper", "purpur", "leaves", "folia"], rec: "paper" },
  { id: "mod", t: "模组", s: "模组扩展，各类整合包", ico: "neoforge", cores: ["neoforge", "fabric", "forge"], rec: "neoforge" },
  { id: "other", t: "其他", s: "混合核心、群组代理", ico: "velocity", cores: ["mohist", "banner", "velocity", "waterfall"], rec: "" },
];
// 介绍：名字、副标题、正文、适用场景、支持扩展、联机要求（作者 11-26 写的定稿文案）
const CORE = {
  vanilla: ["原版", "Mojang 官方服务端", "由 Mojang 官方发布，完整保留原版游戏机制与红石特性，新版本与快照上线后可第一时间开服。未包含第三方性能优化，更适合小规模联机。",
    "小规模纯净生存、抢先体验新版本快照", "仅数据包", "原版客户端直连"],
  paper: ["Paper", "主流高性能插件端", "在 Spigot 基础上大幅优化性能并修复多项漏洞，全面兼容 Bukkit 与 Spigot 插件生态，稳定且社区支持最为成熟。",
    "常规生存、小游戏、中大型多人服", "插件、数据包", "原版客户端直连"],
  purpur: ["Purpur", "高度可定制的 Paper 分支", "基于 Paper 构建，额外内置大量游戏机制与玩法配置项，可自由调整生物骑乘、刷怪规则等细节，完整兼容 Paper 插件。",
    "偏好细调玩法规则的生存服", "插件、数据包", "原版客户端直连"],
  leaves: ["Leaves", "保留生电特性的 Paper 分支", "基于 Paper 开发，还原了被上游修复的常见红石与生电特性，在兼顾性能与插件的同时，保障刷物品机及各类生电机器正常运行。",
    "红石玩家、生电生存服", "插件、数据包", "原版客户端直连"],
  folia: ["Folia", "多核区域并发服务端", "将世界按独立区域分配至不同 CPU 核心并行运算，专为高并发场景设计。因底层多线程架构变更，常规插件无法直接运行。",
    "百人级高并发大型多人服", "Folia 专用插件、数据包", "原版客户端直连"],
  neoforge: ["NeoForge", "新一代主流模组加载器", "自 Forge 分支独立发展，已成为 1.20.2 及以上版本的主流模组平台，新版本大型整合包与热门模组多已转向该生态。",
    "1.20.2+ 模组服、新版本整合包", "NeoForge 模组、数据包", "客户端需同步对应模组"],
  fabric: ["Fabric", "轻量级模组加载器", "架构精简、启动迅速，跟进官方新版本与快照速度极快。社区拥有大量性能优化、原版增强与生电辅助类模组。",
    "轻量模组服、原版增强、新版本开服", "Fabric 模组、数据包", "需同步对应模组（纯服务端除外）"],
  forge: ["Forge", "经典老牌模组加载器", "历史最悠久的模组平台，老版本生态积累最为齐全。1.20.1 及之前的经典科技、魔法类大型整合包大多基于此构建。",
    "1.20.1 及更早版本的模组与整合包", "Forge 模组、数据包", "客户端需同步对应模组"],
  mohist: ["Mohist", "Forge + 插件混合服务端", "支持同时加载 Forge 模组与 Bukkit/Spigot 插件。因双端同时修改底层逻辑，部分组合易产生冲突，正式开服前建议充分测试。",
    "需配合插件管理的 Forge 模组服", "Forge 模组、插件、数据包", "客户端需同步对应模组"],
  banner: ["Taiyitist", "Fabric + 插件混合服务端", "原名 Banner，支持同时加载 Fabric 模组与 Bukkit/Spigot 插件。混合架构存在一定的兼容性风险，正式启用前建议先行测试。",
    "需配合插件管理的 Fabric 模组服", "Fabric 模组、插件、数据包", "客户端需同步对应模组"],
  velocity: ["Velocity", "现代高性能群组代理", "本身不运行游戏世界，仅作为统一入口串联多台后端服务器，供玩家跨服切换。性能、扩展性与安全性均优于传统代理。",
    "大厅服、多子服跨服群组", "Velocity 代理插件", "取决于后端子服配置"],
  waterfall: ["Waterfall", "传统 BungeeCord 分支代理", "基于 BungeeCord 优化的传统群组代理，现已停止更新，仅用于维护依赖旧插件的老群组服。新建群组建议直接使用 Velocity。",
    "维护旧版群组、兼容老代理插件", "BungeeCord 代理插件", "取决于后端子服配置"],
};
const VERS = {
  vanilla: ["26.3-snapshot-2", "26.3-snapshot-1", "26.2", "26.1", "1.21.4", "1.21.1", "1.20.6", "1.20.4", "1.20.1", "1.19.4", "1.18.2", "1.16.5", "1.12.2"],
  mc: ["26.2", "26.1", "1.21.4", "1.21.1", "1.20.6", "1.20.4", "1.20.1", "1.19.4", "1.18.2", "1.16.5", "1.12.2"],
  forge: ["1.21.1", "1.20.1", "1.19.2", "1.18.2", "1.16.5", "1.12.2"],
  hybrid: ["1.20.1", "1.19.2", "1.18.2", "1.16.5", "1.12.2"],
  velocity: ["3.4.0", "3.3.0", "3.2.0"], waterfall: ["1.21", "1.20"],
};
const versOf = k => k === "vanilla" ? VERS.vanilla : k === "forge" ? VERS.forge : (k === "mohist" || k === "banner") ? VERS.hybrid : k === "velocity" ? VERS.velocity : k === "waterfall" ? VERS.waterfall : VERS.mc;
const DEF = { vanilla: "26.2", paper: "26.2", purpur: "26.2", leaves: "26.1", folia: "26.1", fabric: "26.2", forge: "1.20.1", neoforge: "26.1", mohist: "1.20.1", banner: "1.20.1", velocity: "3.4.0", waterfall: "1.21" };
let step = 0, play = 1, core = "paper", ver = DEF.paper;
const STEPS = () => play === 0 ? ["选择核心以进行下一步", "最后设置一下", "让朋友连进来"] : ["选择核心以进行下一步", play === 2 ? "装点模组？" : "装点插件？", "最后设置一下", "让朋友连进来"];
const cover = (k, size) => `<div class="cover" style="--c:${MDPixel16.CORE_COLORS[k] || "#7a8aa0"}">${MDPixel16.svg(k, size)}</div>`;
function introInner() {
  const p = PLAYS[play], c = CORE[core];
  return `<div class="body"><div class="head">${cover(core, 32)}<div><div class="nm">${c[0]}${core === p.rec && p.cores.length > 1 ? `<span class="rec">推荐</span>` : ""}</div><div class="sub">${c[1]}</div></div></div>
    <p>${c[2]}</p><dl><dt>适用场景</dt><dd>${c[3]}</dd><dt>支持扩展</dt><dd>${c[4]}</dd><dt>联机要求</dt><dd>${c[5]}</dd></dl></div>`;
}
function versionsInner() {
  const proxy = core === "velocity" || core === "waterfall", vs = versOf(core);
  return `<h3>${proxy ? "版本" : "游戏版本"}<span class="sp"></span><span class="find"><i data-ic="search"></i>搜索</span></h3>
    <div class="lwrap"><div class="list"><i class="hl"></i>${vs.map(v => { const snap = v.includes("snapshot"), latest = !snap && v === vs.find(x => !x.includes("snapshot"));
      return `<div class="row vrow${v === ver ? " on" : ""}${snap ? " snap" : ""}" data-ver="${v}">${v}<span class="sp"></span>${snap ? `<span class="tag">快照</span>` : latest ? `<span class="tag">最新</span>` : v === DEF[core] ? `<span class="tag">常用</span>` : ""}</div>`; }).join("")}</div><i class="thumb"></i></div>
    ${core === "vanilla" ? "" : `<div class="build">构建用最新稳定版 · <a>换一个</a></div>`}`;
}
function step1() {
  const p = PLAYS[play];
  const plays = `<div class="plays">${PLAYS.map((x, i) => `<div class="play${i === play ? " on" : ""}" data-play="${i}" style="--c:${MDPixel16.CORE_COLORS[x.ico]}">${cover(x.ico, 48)}<div class="t">${x.t}</div><div class="s">${x.s}</div></div>`).join("")}</div>`;
  const intro = `<div class="col intro" id="intro">${introInner()}</div>`;
  const ordered = [p.rec, ...p.cores.filter(k => k !== p.rec)].filter(Boolean);
  const cores = p.cores.length < 2 ? "" : `<div class="col" id="corecol"><h3>核心</h3><div class="lwrap"><div class="list"><i class="hl"></i>${ordered.map(k => `<div class="row${k === core ? " on" : ""}" data-core="${k}">${MDPixel16.svg(k, 32)}${CORE[k][0]}<span class="sp"></span>${k === p.rec && p.cores.length > 1 ? `<span class="tag">推荐</span>` : ""}</div>`).join("")}</div><i class="thumb"></i></div></div>`;
  const versions = `<div class="col" id="vercol">${versionsInner()}</div>`;
  const alt = `<div class="alt">手上有现成的？` + [["package", "导入整合包"], ["globe", "用已有地图"], ["share", "导入交接包"], ["folder", "接管已有服务器"]].map(([i, t]) => `<span class="b"><i data-ic="${i}"></i>${t}</span>`).join("") + `</div>`;
  return plays + `<div class="pick${cores ? "" : " two"}">${intro}${cores}${versions}</div>` + alt;
}
function render() {
  const names = STEPS();
  document.getElementById("page").innerHTML = `<h1 class="q">${names[step]}</h1>` + (step === 0 ? step1() : `<div class="placeholder">这一步的内容还没画</div>`);
  document.getElementById("dots").innerHTML = names.map((_, i) => `<i class="${i === step ? "on" : ""}"></i>`).join("");
  document.getElementById("next").innerHTML = step === names.length - 1 ? `<i data-ic="check"></i>创建服务器` : `下一步<i data-ic="chevronRight"></i>`;
  KIT.hydrate(document.body);
  settleVersions();
  document.querySelectorAll("#corecol .list").forEach(l => placeHL(l, false));
  const cl = document.querySelector("#corecol .lwrap"); if (cl) scrollbar(cl);
}
// 高亮框挪到选中的那一行：animate 为 false 时直接放过去（刚画出来、换了一整列的时候）
function placeHL(list, animate) {
  const hl = list.querySelector(".hl"), on = list.querySelector(".row.on");
  if (!hl) return;
  hl.style.opacity = on ? 1 : 0;
  if (!on) return;
  if (!animate) hl.style.transition = "none";
  hl.style.transform = `translateY(${on.offsetTop}px)`;
  hl.style.height = on.offsetHeight + "px";
  if (!animate) { void hl.offsetWidth; hl.style.transition = ""; }
}
// 版本这一列重画以后：滚到选中的那一行、高亮框放过去、细滚动条接上
function settleVersions() {
  const l = document.querySelector("#vercol .list"); if (!l) return;
  const on = l.querySelector(".row.on");
  if (on) l.scrollTop = on.offsetTop - l.clientHeight / 2 + on.offsetHeight / 2;
  placeHL(l, false);
  scrollbar(l.closest(".lwrap"));
}
function selectCore(k) {
  if (k === core) return;
  core = k; ver = DEF[k];
  const list = document.querySelector("#corecol .list");
  list.querySelectorAll(".row").forEach(r => r.classList.toggle("on", r.dataset.core === k));
  placeHL(list, true);
  const intro = document.getElementById("intro");
  intro.innerHTML = introInner();
  intro.classList.remove("swap"); void intro.offsetWidth; intro.classList.add("swap");
  const vc = document.getElementById("vercol");
  vc.innerHTML = versionsInner(); KIT.hydrate(vc); settleVersions();
}
function selectVer(v) {
  if (v === ver) return;
  ver = v;
  const list = document.querySelector("#vercol .list");
  list.querySelectorAll(".row").forEach(r => r.classList.toggle("on", r.dataset.ver === v));
  placeHL(list, true);
}
// 细滚动条：跟着列表算长短和位置，能拖；上下有没看到的就渐隐
function scrollbar(w) {
  const l = w.querySelector(".list"), t = w.querySelector(".thumb");
  const paint = () => {
    const ch = l.clientHeight, sh = l.scrollHeight, st = l.scrollTop;
    w.classList.toggle("fits", sh <= ch + 1);
    w.classList.toggle("can-up", st > 2);
    w.classList.toggle("can-down", st + ch < sh - 2);
    const h = Math.max(28, ch * ch / sh);
    t.style.height = h + "px";
    t.style.top = (sh > ch ? st / (sh - ch) * (ch - h) : 0) + "px";
  };
  let idle = 0;
  l.addEventListener("scroll", () => { paint(); w.classList.add("scrolling"); clearTimeout(idle); idle = setTimeout(() => w.classList.remove("scrolling"), 700); }, { passive: true });
  t.addEventListener("pointerdown", e => {
    e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add("drag");
    const y0 = e.clientY, s0 = l.scrollTop, ratio = (l.scrollHeight - l.clientHeight) / (l.clientHeight - t.offsetHeight);
    const move = ev => { l.scrollTop = s0 + (ev.clientY - y0) * ratio; };
    const up = () => { t.classList.remove("drag"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); };
    t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
  });
  paint();
}
document.getElementById("page").addEventListener("click", e => {
  const pl = e.target.closest("[data-play]"), co = e.target.closest("[data-core]"), ve = e.target.closest("[data-ver]");
  if (pl) { play = +pl.dataset.play; core = PLAYS[play].rec || PLAYS[play].cores[0]; ver = DEF[core]; render(); }
  else if (co) selectCore(co.dataset.core);
  else if (ve) selectVer(ve.dataset.ver);
});
document.getElementById("next").addEventListener("click", () => { if (step < STEPS().length - 1) { step++; render(); } });
document.getElementById("back").addEventListener("click", () => {
  if (step > 0) { step--; render(); return; }
  // 第一步再往回：按钮沉下去，回首页，胶囊从下面浮上来
  document.body.classList.add("hidden-nav");
  const q = new URLSearchParams(location.search); q.set("enter", "1");
  setTimeout(() => { location.href = "home.html?" + q.toString(); }, 320);
});
KIT_READY.then(() => { render(); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("hidden-nav"))); });
</script>
</body>
