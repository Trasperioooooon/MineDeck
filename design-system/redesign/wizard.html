<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 新建服务器</title>
<script src="kit.js"></script>
<script src="pixel16.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: sticky; top: 0; z-index: 5;
        background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .tb img { width: 16px; height: 16px; image-rendering: pixelated; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }

  /* 照首页的样子：全部居中，上面留白，一句问话当标题（作者 11-26：标题栏里的「新建服务器」删掉，问话改成「想玩哪个？」）。
     基准 1280×800 下不滚动，底边留白 86 给底下的按钮 */
  .page { max-width: 1160px; margin: 0 auto; padding: 0 40px 86px; min-height: calc(100vh - 40px); box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; }
  /* 问话和下面大卡的间隔 28 → 48（作者 11-26：大卡和面板往下挪一点，离问话远一点） */
  .q { margin: 44px 0 48px; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -.01em; text-align: center; }

  /* 玩法：四张大卡，照首页大卡的做法（外圆角 26、内边距 8，核心色封面圆角 18 带方格暗纹，同心），图标 48 放在封面正中 */
  .plays { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; position: relative; }
  .play { --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1); cursor: pointer; transition: transform .15s; }
  .play:hover { transform: translateY(-2px); }
  /* 选中的玩法：强调色的框是单独的一块，换玩法时和核心、版本的高亮框一样平滑滑过去（作者 11-26）；
     选中的那张卡悬停上浮时框跟着浮 */
  .pframe { position: absolute; left: 0; top: 0; border-radius: 26px; box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; z-index: 2;
            transition: transform .32s cubic-bezier(.3, .7, .2, 1), translate .15s; }
  .plays:has(.play.on:hover) .pframe { translate: 0 -2px; }
  .cover { height: 80px; border-radius: 18px; display: grid; place-items: center; position: relative; overflow: hidden;
           background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
  .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .cover svg { position: relative; z-index: 1; width: 48px; height: 48px; display: block; }
  .play .t { margin: 10px 0 2px; font-size: 16px; font-weight: 600; text-align: center; }
  .play .s { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* 选好玩法以后，下面一块三列（作者 11-26 的主意，先做出来看效果）：一列介绍、一列选核心、一列选游戏版本。
     外面一块同首页大卡（外 26、内边距 8），三列是里面三块圆角 18 的面板，同心 */
  .pick { margin-top: 20px; width: 100%; --R: 26px; --p: 8px; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-1);
          display: flex; height: 296px; box-sizing: border-box; }
  /* 三列按 1.25 : 1 : 1 分，中间隔 8。用 flex 而不用 grid，是为了换玩法时两列、三列之间能平滑变过去 */
  .pick > .col { flex: 1 1 0; min-width: 0; margin-left: 8px;
                 transition: flex-grow .32s cubic-bezier(.3, .7, .2, 1), margin-left .32s cubic-bezier(.3, .7, .2, 1), padding .32s cubic-bezier(.3, .7, .2, 1); }
  .pick > .intro { flex-grow: 1.25; margin-left: 0; }
  /* 原版只有一个核心（作者 11-26）：两列，介绍宽一些、版本在右（3 : 2）。核心那列不拿掉，收成零宽、里面的东西淡掉；
     换回别的玩法时它再展开、东西淡回来 */
  .pick.two > .intro { flex-grow: 3; }
  .pick.two > #vercol { flex-grow: 2; }
  #corecol { overflow: hidden; }
  #corecol > * { min-width: 170px; transition: opacity .2s .12s; }
  .pick.two > #corecol { flex-grow: 0; margin-left: 0; padding-left: 0; padding-right: 0; }
  .pick.two > #corecol > * { opacity: 0; transition: opacity .1s; }
  .col { border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); padding: 14px; display: flex; flex-direction: column; min-height: 0; }
  .col h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .col h3 .sp { flex: 1; }
  /* 介绍：选中的核心，图标、名字、副标题、正文，左下角三行「适用场景」「支持扩展」「联机要求」 */
  /* 换核心时介绍这一块的过渡「逐项换」（作者 11-26 从四种里挑的）：动画在脚本 swapIntro 里 */
  .intro { overflow: hidden; }
  .intro .body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .intro .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .intro .head .cover { width: 56px; height: 56px; border-radius: 12px; flex: none; }
  .intro .head .cover svg { width: 32px; height: 32px; }
  .intro .nm { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .intro .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .intro p { margin: 0 0 12px; font-size: 13px; line-height: 21px; color: var(--text); }
  /* 右边那列用 minmax(0, 1fr)：列宽在变、旧的内容钉着原来的宽度时，它只往外伸出去，不把左边的小标题挤成竖排 */
  .intro dl { margin: auto 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 12.5px; }
  .intro dt { color: var(--faint); } .intro dd { margin: 0; color: var(--muted); }
  .rec { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: var(--accent-subtle); color: var(--accent-text); }
  /* 核心、版本：竖着的一列，一行一个，选中的底色变强调色；版本多了在列里自己滚 */
  .lwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none; margin: 0 -4px; padding: 0 12px 0 4px;
          --ft: 0px; --fb: 0px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%); }
  .list::-webkit-scrollbar { display: none; }
  .lwrap.can-up .list { --ft: 28px; } .lwrap.can-down .list { --fb: 28px; }
  .thumb { position: absolute; right: -6px; width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text) 38%, transparent);
           opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
  .lwrap:hover .thumb, .lwrap.scrolling .thumb, .thumb.drag { opacity: 1; }
  .thumb:hover, .thumb.drag { width: 6px; right: -7px; background: color-mix(in srgb, var(--text) 55%, transparent); }
  .lwrap.fits .thumb { display: none; }
  .row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 6px; border-radius: 12px; cursor: pointer; flex: none; font-size: 14px; font-weight: 500; }
  .row { position: relative; z-index: 1; }
  .row:hover:not(.on) { background: var(--hover); }
  .row.on { color: var(--accent-text); font-weight: 600; }
  /* 选中的高亮框是列表里单独的一块，换选择时平滑滑到新的那一行（作者 11-26）；核心和版本两列都这样 */
  .list { position: relative; }
  .hl { position: absolute; left: 4px; right: 12px; top: 0; height: 44px; border-radius: 12px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
        transition: transform .32s cubic-bezier(.3, .7, .2, 1), height .32s cubic-bezier(.3, .7, .2, 1); }
  .row svg { width: 32px; height: 32px; display: block; flex: none; }
  .row .sp { flex: 1; }
  .row .tag { font-size: 11.5px; color: var(--faint); font-weight: 400; }
  .row.on .tag { color: var(--accent-text); }
  .vrow { height: 36px; padding: 0 12px; font-family: var(--mono); font-size: 13.5px; }
  .vrow.snap:not(.on) { color: var(--muted); }
  .find { height: 30px; border-radius: 15px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border);
          color: var(--faint); font-size: 12px; font-weight: 400; width: 120px; }
  .find .ico { width: 13px; height: 13px; }

  /* 别的四种开服方式：页面最下面一行淡字，不抢眼（原来是一整页五张卡）。打头的「手上有现成的？」作者 11-26 删了，只留四个，文案和图标见脚本里的 alt */
  .alt { margin-top: auto; padding-top: 16px; display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--faint); }
  .alt span.b { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; color: var(--muted); cursor: pointer; }
  .alt span.b:hover { color: var(--text); background: var(--hover); }
  .alt .ico { width: 14px; height: 14px; }
  /* 第二步「选择预装插件」「选择预装模组」（11-26 主会话画的第一稿，文案作者改过）：和第一步同样的大面板（外 26、内边距 8，里面两块圆角 18），
     左边逛（标题 + 搜索、类别、两列卡片，卡片多了在这一块里自己滚，细滚动条和上下渐隐同第一步），右边是待装清单和「从电脑添加」。
     现在程序里这一步的东西都在（Modrinth 热门、搜索、类别、待装清单、从电脑添加、检查前置），这里重新排了一遍；
     前置不再要人点「检查前置」再勾，加一个就把它要的前置一起放进清单、标「前置」。基准 1280×800 下面板 170–690，不滚动 */
  .addon { width: 100%; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1);
           display: flex; gap: 8px; height: 520px; box-sizing: border-box; }
  .addon > .col { min-width: 0; }
  /* 左右大约 72 : 28（Gemini 复审 11-26 提的，作者让看着采纳）：左边两列卡片宽一些，名字放得下；清单一行一个，窄一点也够 */
  .addon .browse { flex: 2.6 1 0; }
  .addon .cart { flex: 1 1 0; }
  .findin { height: 30px; border-radius: 15px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border);
            width: 170px; box-sizing: border-box; font-weight: 400; }
  .findin input { all: unset; flex: 1; min-width: 0; font-size: 12px; color: var(--text); }
  .findin input::placeholder { color: var(--faint); }
  .findin .ico { width: 13px; height: 13px; color: var(--faint); flex: none; }
  /* 放不下时横着滑（滚轮也能滑），哪头还有就在哪头渐隐，同首页左右滑的做法 */
  .chips { display: flex; gap: 5px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; flex: none; --fl: 0px; --fr: 0px;
           -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
           mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); }
  .chips::-webkit-scrollbar { display: none; }
  .chips.can-l { --fl: 28px; } .chips.can-r { --fr: 28px; }
  .chip { height: 28px; padding: 0 10px; border-radius: 14px; display: inline-flex; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer;
          white-space: nowrap; flex: none; box-shadow: inset 0 0 0 1px var(--border); transition: color .2s, background .2s, box-shadow .2s; }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--accent-text); background: var(--accent-subtle); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); font-weight: 600; }
  /* 卡片：图标 40、名字和下载量一行、一句话一行，右边一个圆的 ＋；加进清单以后卡片底色换强调色、＋ 变 ✓（和第一步选中的高亮框同一个样子） */
  .list.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .mod { display: flex; align-items: center; gap: 12px; height: 74px; padding: 0 12px; border-radius: 14px; box-sizing: border-box; min-width: 0; cursor: pointer;
         background: color-mix(in srgb, var(--surface) 55%, transparent); transition: background .2s, box-shadow .2s; }
  .mod:hover { background: var(--hover); }
  .mod.in { background: var(--accent-subtle); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
  .mt { width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: rgb(255 255 255 / .92);
        background: var(--c); font-family: var(--mono); }
  .mod .m, .crow .m { flex: 1; min-width: 0; }
  /* 三行（Gemini 复审 11-26 提的）：名字独占一行不再被挤断；一句话；下载量和「需客户端 / 仅服务端」收进第三行淡字 */
  .mod .n { font-size: 13.5px; font-weight: 600; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mod .d { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .mod .meta { font-size: 11px; line-height: 14px; color: var(--faint); display: flex; align-items: center; gap: 5px; margin-top: 3px; white-space: nowrap; }
  .mod .meta .ico { width: 11px; height: 11px; }
  .ftag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 6px; color: var(--muted); background: color-mix(in srgb, var(--text) 8%, transparent); }
  .add { width: 30px; height: 30px; border-radius: 15px; flex: none; display: grid; place-items: center; color: var(--text); box-shadow: inset 0 0 0 1px var(--border);
         transition: background .2s, color .2s, box-shadow .2s; }
  .mod:hover .add { background: var(--hover); }
  .mod.in .add { background: var(--accent-solid); color: var(--on-accent); box-shadow: none; }
  .add .ico { width: 15px; height: 15px; }
  /* 待装清单：一行一个，图标 28、名字、第二行小字（前置是谁要的、朋友那边要不要装），悬停出 ×；空的时候一段说明 */
  .cart h3 .cnt { font-family: var(--mono); color: var(--accent-text); }
  /* 清单里有东西时右上角出一个淡的「清空」（Gemini 复审 11-26 提的） */
  .cart h3 .clr { font-weight: 500; color: var(--faint); cursor: pointer; padding: 3px 8px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, color .2s; }
  .cart.has h3 .clr { opacity: 1; pointer-events: auto; }
  .cart h3 .clr:hover { color: var(--text); background: var(--hover); }
  .crow { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; border-radius: 12px; flex: none; overflow: hidden; }
  .crow:hover { background: var(--hover); }
  .crow .mt { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
  .crow .n { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .crow .why { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .crow .x { width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; color: var(--faint); cursor: pointer; opacity: 0; flex: none; }
  .crow:hover .x { opacity: 1; }
  .crow .x:hover { color: var(--text); background: var(--hover); }
  .crow .x .ico { width: 13px; height: 13px; }
  .cempty { margin: auto 0; text-align: center; color: var(--faint); font-size: 12px; line-height: 20px; padding: 0 18px; }
  .cempty b { display: block; margin-bottom: 4px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  #atitle { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
  #atitle .asub { font-weight: 400; color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
  .list:has(.crow:not(.out)) .cempty { display: none; }
  .cnote { flex: none; font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; gap: 6px; align-items: center; }
  .cnote:empty { display: none; }
  .cnote .ico { width: 14px; height: 14px; color: var(--faint); }
  .drop { flex: none; margin-top: 10px; height: 44px; border-radius: 12px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center;
          gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s; }
  .drop:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .drop .ico { width: 15px; height: 15px; }
  .placeholder { margin-top: 24px; width: 100%; height: 360px; border-radius: 26px; border: 1px dashed var(--border); display: grid; place-items: center; color: var(--faint); font-size: 13px; }

  /* 底部：胶囊沉下去以后，左下角「上一步」、右下角「下一步」，和版心的左右边对齐；中间一排小点是第几步（主会话加的，不要可以去掉）。
     两个按钮各是一颗单独的胶囊，44 高、13 号字（作者 11-26：原来 52 高整块实心，看着比首页导航条大；
     改成外壳里套 40 高的按钮以后，「下一步」外面多一圈壳又很怪，所以壳去掉，按钮本身做小）。
     中线和首页胶囊对齐（离底 18、52 高的那条中线）；「上一步」用胶囊那样的半透明底和细边，「下一步」实心强调色 */
  .wnav { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 10; pointer-events: none; }
  .wnav .in { max-width: 1160px; margin: 0 auto; padding: 0 40px; height: 52px; display: flex; align-items: center; }
  .wnav .sp { flex: 1; }
  .wbtn { pointer-events: auto; height: 44px; padding: 0 18px; border-radius: var(--r-full); display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
          font: inherit; font-size: 13px; font-weight: 600; box-shadow: var(--elev-3); transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s; }
  .wbtn .ico { width: 16px; height: 16px; }
  .wbtn.back { padding-left: 14px; color: var(--text); border: 1px solid var(--border);
               background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2); }
  .wbtn.back:hover { background: color-mix(in srgb, var(--overlay) 86%, var(--text) 6%); }
  .wbtn.back .ico { transform: rotate(180deg); }
  .wbtn.next { padding-right: 14px; border: 0; color: var(--on-accent); background: var(--accent-solid); }
  .wbtn.next:hover { background: var(--accent-solid-hov); }
  .dots { display: flex; gap: 8px; pointer-events: auto; transition: opacity .32s; }
  .dots i { width: 8px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent);
            transition: width .32s cubic-bezier(.3, .7, .2, 1), background .32s; }
  .dots i.on { width: 22px; background: var(--accent); }
  body.hidden-nav .wbtn { transform: translateY(180%); opacity: 0; }
  body.hidden-nav .dots { opacity: 0; }
</style>
</head>
<body class="hidden-nav">
<header class="tb"><img src="../../internal/web/ui/img/logo-16.png" alt=""><div class="sp"></div>
  <div class="win"><span><i data-ic="winMin"></i></span><span><i data-ic="winMax"></i></span><span><i data-ic="winClose"></i></span></div></header>
<main class="page" id="page"></main>
<div class="wnav"><div class="in">
  <button class="wbtn back" id="back"><i data-ic="chevronRight"></i>上一步</button>
  <span class="sp"></span><span class="dots" id="dots"></span><span class="sp"></span>
  <button class="wbtn next" id="next">下一步<i data-ic="chevronRight"></i></button>

<script>

  // 旧的几样钉在现在的宽度上淡出，新的直接按变完的宽度排好再淡进来；多出列外的部分被这一列裁掉。列变完了再松开
  // 这时旧的几样一起很快淡掉（不错开），免得被裁掉半截的旧字留得太久；错开只留给新的淡进来
  if (finalW) { pinW = finalW; pinUntil = now + 360; }
  const morph = now < pinUntil;
  if (morph) {
    const body = intro.querySelector(".body");
    olds.forEach(o => { o.style.width = o.getBoundingClientRect().width + "px"; });
    body.style.width = pinW + "px";
    clearTimeout(pinTimer);
    pinTimer = setTimeout(() => { const b = intro.querySelector(".body"); if (b) b.removeAttribute("style"); }, pinUntil - now);
  }
  swapUntil = performance.now() + (n - 1) * gap + 90 + 220;
  olds.forEach((o, i) => {
    const order = (axis === "X" || dir > 0 ? i : n - 1 - i) * gap;
    o.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translate${axis}(${-dy}px)` }],
      { duration: 90, delay: morph ? 0 : order, easing: easeIn, fill: "forwards" }).onfinish = () => {
      o.replaceWith(news[i]);
      news[i].animate([{ opacity: 0, transform: `translate${axis}(${dy}px)` }, { opacity: 1, transform: "none" }],
        { duration: 220, delay: morph ? order : 0, easing: easeOut, fill: "backwards" });
    };
  });
}
function selectVer(v) {
  if (v === ver) return;
  ver = v;
  const list = document.querySelector("#vercol .list");
  list.querySelectorAll(".row").forEach(r => r.classList.toggle("on", r.dataset.ver === v));
  placeHL(list, true);
}
// 细滚动条：跟着列表算长短和位置，能拖；上下有没看到的就渐隐
function scrollbar(w) {
  const l = w.querySelector(".list"), t = w.querySelector(".thumb");
  const paint = () => {
    const ch = l.clientHeight, sh = l.scrollHeight, st = l.scrollTop;
    w.classList.toggle("fits", sh <= ch + 1);
    w.classList.toggle("can-up", st > 2);
    w.classList.toggle("can-down", st + ch < sh - 2);
    const h = Math.max(28, ch * ch / sh);
    t.style.height = h + "px";
    t.style.top = (sh > ch ? st / (sh - ch) * (ch - h) : 0) + "px";
  };
  // 同一个列表只接一次；行换了以后调 w._paint() 重新算细条的长短
  if (w._paint) { w._paint(); return; }
  w._paint = paint;
  let idle = 0;
  l.addEventListener("scroll", () => { paint(); w.classList.add("scrolling"); clearTimeout(idle); idle = setTimeout(() => w.classList.remove("scrolling"), 700); }, { passive: true });
  t.addEventListener("pointerdown", e => {
    e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add("drag");
    const y0 = e.clientY, s0 = l.scrollTop, ratio = (l.scrollHeight - l.clientHeight) / (l.clientHeight - t.offsetHeight);
    const move = ev => { l.scrollTop = s0 + (ev.clientY - y0) * ratio; };
    const up = () => { t.classList.remove("drag"); t.removeEventListener("pointermove", move); t.removeEventListener("pointerup", up); };
    t.addEventListener("pointermove", move); t.addEventListener("pointerup", up);
  });
  paint();
}
document.getElementById("page").addEventListener("click", e => {
  const pl = e.target.closest("[data-play]"), co = e.target.closest("[data-core]"), ve = e.target.closest("[data-ver]");
  const ad = e.target.closest("[data-addon]"), un = e.target.closest("[data-unpick]"), ch = e.target.closest("[data-cat]");
  if (pl) selectPlay(+pl.dataset.play);
  else if (co) selectCore(co.dataset.core);
  else if (ve) selectVer(ve.dataset.ver);
  else if (ad) toggleAddon(ad.dataset.addon);
  else if (un) toggleAddon(un.dataset.unpick);
  else if (ch && ch.dataset.cat !== acat) { acat = ch.dataset.cat; regrid(); }
  else if (e.target.closest("[data-clear]")) { picked = []; syncAddons(); }
});
// 搜索框：停手 0.18 秒再筛
document.getElementById("page").addEventListener("input", e => {
  if (e.target.id !== "aq") return;
  clearTimeout(aqTimer); aqTimer = setTimeout(() => { aq = e.target.value.trim(); regrid(); }, 180);
});
// 换步：整页内容往走的方向滑一小段淡掉，新的一步从另一边滑进来（下一步往左走、上一步往右走），问话跟着一起换
let stepping = false;
function goStep(n) {
  if (stepping || n === step) return;
  stepping = true;
  const page = document.getElementById("page"), dir = n > step ? 1 : -1;
  const out = page.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-16 * dir}px)` }], { duration: 140, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" });
  out.onfinish = () => {
    step = n; render(); out.cancel();
    page.animate([{ opacity: 0, transform: `translateX(${16 * dir}px)` }, { opacity: 1, transform: "none" }], { duration: 260, easing: "cubic-bezier(.2, .7, .2, 1)" })
      .onfinish = () => { stepping = false; };
  };
}
document.getElementById("next").addEventListener("click", () => { if (step < STEPS().length - 1) goStep(step + 1); });
document.getElementById("back").addEventListener("click", () => {
  if (step > 0) { goStep(step - 1); return; }
  // 第一步再往回：按钮沉下去，回首页，胶囊从下面浮上来
  document.body.classList.add("hidden-nav");
  const q = new URLSearchParams(location.search); q.set("enter", "1");
  setTimeout(() => { location.href = "home.html?" + q.toString(); }, 320);
});
KIT_READY.then(() => { render(); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("hidden-nav"))); });
</script>
