<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>草图 · 新建服务器</title>
<script src="kit.js"></script>
<script src="pixel16.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }
  .tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: sticky; top: 0; z-index: 5;
        background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .tb img { width: 16px; height: 16px; image-rendering: pixelated; }
  .tb .sp { flex: 1; }
  .tb .win { display: flex; height: 40px; }
  .tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }
  /* 和首页同一套版心：1160 宽、两边 40；底边留白 86 给底下的按钮。基准 1280×800 下不滚动 */
  .page { max-width: 1160px; margin: 0 auto; padding: 24px 40px 86px; }
  .eyebrow { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  h1 { margin: 0 0 22px; font-size: 26px; line-height: 34px; font-weight: 600; letter-spacing: -.01em; }
  /* 新建页原来的另外四种方式（导入整合包、用已有地图开服、导入交接包、接管已有服务器）不再单独一页，缩成第一步标题右边一排小按钮（U05 的方向） */
  .h1row { display: flex; align-items: flex-end; gap: 16px; margin: 0 0 22px; }
  .h1row h1 { margin: 0; }
  .h1row .sp { flex: 1; }
  .alt { display: flex; gap: 6px; align-items: center; }
  .alt .k { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .alt span.b { height: 32px; padding: 0 12px; border-radius: 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted);
            background: var(--surface); border: 1px solid var(--border); cursor: pointer; }
  .alt span.b:hover { color: var(--text); }
  .alt .ico { width: 14px; height: 14px; }
  .lab { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .lab small { font-weight: 400; color: var(--faint); font-size: 12px; }
  .sec { margin-bottom: 26px; }

  /* 玩法：四块并排，图标在左、两行字在右；选中的描一圈强调色（同心：外 20、内边距 8、头像圆角 12） */
  .plays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .play { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 20px; background: var(--surface); box-shadow: var(--elev-1);
          border: 2px solid transparent; cursor: pointer; }
  .play.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .play .t { font-size: 15px; font-weight: 600; }
  .play .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .px-avatar { --c: #7a8aa0; width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 12px;
               background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
  .px-avatar svg { width: 32px; height: 32px; display: block; }

  /* 核心：只列选中的玩法下面那几个，推荐的预先选好 */
  .cores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .core { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 20px; background: color-mix(in srgb, var(--surface) 55%, var(--bg));
          border: 2px solid transparent; cursor: pointer; }
  .core.on { border-color: var(--accent); background: var(--surface); }
  .core .px-avatar { width: 40px; height: 40px; }
  .core .n { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .core .s { font-size: 12px; color: var(--muted); }
  .rec { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 8px; background: var(--accent-subtle); color: var(--accent-text); }

  /* 版本：一个下拉加一行构建，构建默认最新稳定版，要换再点 */
  .ver { display: flex; align-items: center; gap: 12px; }
  .sel { height: 40px; padding: 0 12px 0 16px; border-radius: 20px; display: inline-flex; align-items: center; gap: 10px; background: var(--field); border: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .sel .ico { color: var(--faint); }
  .ver .k { font-size: 12.5px; color: var(--muted); }
  .ver a { color: var(--accent-text); }
  .placeholder { height: 360px; border-radius: 26px; border: 1px dashed var(--border); display: grid; place-items: center; color: var(--faint); font-size: 13px; }

  /* 底部：胶囊沉下去以后，左下角「上一步」、右下角「下一步」，和版心的左右边对齐，高度和离底跟胶囊一样（52、18）；
     中间一排小点是第几步（主会话加的，不要可以去掉） */
  .wnav { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 10; pointer-events: none; }
  .wnav .in { max-width: 1160px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; }
  .wnav .sp { flex: 1; }
  .wbtn { pointer-events: auto; height: 52px; padding: 0 22px; border-radius: 26px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
          border: 1px solid var(--border); box-shadow: var(--elev-3); transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s; }
  .wbtn.back { color: var(--text); background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2); }
  .wbtn.back .ico { transform: rotate(180deg); }
  .wbtn.next { color: var(--on-accent); background: var(--accent-solid); border-color: transparent; }
  .wbtn.next:hover { background: var(--accent-solid-hov); }
  .dots { display: flex; gap: 8px; pointer-events: auto; transition: opacity .32s; }
  .dots i { width: 8px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--text) 18%, transparent); }
  .dots i.on { width: 22px; background: var(--accent); }
  body.hidden-nav .wbtn { transform: translateY(160%); opacity: 0; }
  body.hidden-nav .dots { opacity: 0; }
  .tip { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 6; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body class="hidden-nav">
<header class="tb"><img src="../../internal/web/ui/img/logo-16.png" alt=""><div class="sp"></div>
  <div class="win"><span><i data-ic="winMin"></i></span><span><i data-ic="winMax"></i></span><span><i data-ic="winClose"></i></span></div></header>
<main class="page" id="page"></main>
<div class="wnav"><div class="in">
  <button class="wbtn back" id="back"><i data-ic="chevronRight"></i>上一步</button>
  <span class="sp"></span><span class="dots" id="dots"></span><span class="sp"></span>
  <button class="wbtn next" id="next">下一步<i data-ic="chevronRight"></i></button>
</div></div>
<div class="tip">草图 · 新建服务器第一步：玩法、核心、版本放在同一页</div>
<script>
// 玩法四块（问题 U05 定的方向）：每块下面只列这一类的核心，推荐的预先选好
const PLAYS = [
  { id: "vanilla", t: "原版", s: "什么都不加，和单人一样", ico: "vanilla", cores: ["vanilla"], rec: "vanilla" },
  { id: "plugin", t: "插件", s: "领地、经济、小游戏", ico: "paper", cores: ["paper", "purpur", "leaves", "folia"], rec: "paper" },
  { id: "mod", t: "模组", s: "科技、魔法、整合包", ico: "neoforge", cores: ["fabric", "forge", "neoforge"], rec: "neoforge" },
  { id: "other", t: "其他", s: "混合服、群组代理", ico: "velocity", cores: ["mohist", "banner", "velocity", "waterfall"], rec: "" },
];
const CORE = {
  vanilla: ["原版", "Mojang 官方服务端"], paper: ["Paper", "最常用，插件最多"], purpur: ["Purpur", "Paper 加更多可调的玩法"], leaves: ["Leaves", "保留生电特性"], folia: ["Folia", "多核分区，人多才用"],
  fabric: ["Fabric", "轻，更新快"], forge: ["Forge", "老整合包多用它"], neoforge: ["NeoForge", "新版本整合包多用它"],
  mohist: ["Mohist", "混合服：模组 + 插件"], banner: ["Taiyitist", "混合服：Fabric 模组 + 插件"], velocity: ["Velocity", "群组代理：几台连成一个入口"], waterfall: ["Waterfall", "群组代理（老）"],
};
const VER = { vanilla: "1.21.4", paper: "1.21.4", purpur: "1.21.4", leaves: "1.21.4", folia: "1.21.4", fabric: "1.21.1", forge: "1.20.1", neoforge: "1.21.1", mohist: "1.20.1", banner: "1.20.1", velocity: "3.4.0", waterfall: "1.21" };
let step = 0, play = 1, core = "paper";
const STEPS = () => play === 0 ? ["玩法、核心、版本", "设置", "让朋友连进来"] : ["玩法、核心、版本", play === 2 ? "选模组" : "选插件", "设置", "让朋友连进来"];
const av = (k, cls = "") => `<span class="px-avatar ${cls}" style="--c:${MDPixel16.CORE_COLORS[k] || "#7a8aa0"}">${MDPixel16.svg(k, 32)}</span>`;
function step1() {
  const p = PLAYS[play], proxy = core === "velocity" || core === "waterfall";
  return `<div class="sec"><div class="lab">怎么玩</div><div class="plays">${PLAYS.map((x, i) => `<div class="play${i === play ? " on" : ""}" data-play="${i}">${av(x.ico)}<div><div class="t">${x.t}</div><div class="s">${x.s}</div></div></div>`).join("")}</div></div>` +
    (p.cores.length > 1 ? `<div class="sec"><div class="lab">核心</div><div class="cores">${p.cores.map(k => `<div class="core${k === core ? " on" : ""}" data-core="${k}">${av(k)}<div><div class="n">${CORE[k][0]}${k === p.rec ? `<span class="rec">推荐</span>` : ""}</div><div class="s">${CORE[k][1]}</div></div></div>`).join("")}</div></div>` : "") +
    `<div class="sec"><div class="lab">${proxy ? "版本" : "游戏版本"}</div><div class="ver"><span class="sel">${VER[core]}<i data-ic="chevronDown"></i></span>` +
    (core === "vanilla" ? `<span class="k">正式版里最新的；要快照版点开下拉</span>` : `<span class="k">构建：最新稳定版 · <a>换一个</a></span>`) + `</div></div>`;
}
function render() {
  const names = STEPS();
  const alt = step === 0 ? `<span class="sp"></span><div class="alt"><span class="k">手上有现成的？</span>` +
    [["package", "导入整合包"], ["globe", "用已有地图"], ["share", "导入交接包"], ["folder", "接管已有服务器"]].map(([i, t]) => `<span class="b"><i data-ic="${i}"></i>${t}</span>`).join("") + `</div>` : "";
  document.getElementById("page").innerHTML = `<div class="eyebrow">新建服务器 · 第 ${step + 1} 步，共 ${names.length} 步</div><div class="h1row"><h1>${names[step]}</h1>${alt}</div>` +
    (step === 0 ? step1() : `<div class="placeholder">这一步的内容还没画</div>`);
  document.getElementById("dots").innerHTML = names.map((_, i) => `<i class="${i === step ? "on" : ""}"></i>`).join("");
  document.getElementById("next").innerHTML = step === names.length - 1 ? `<i data-ic="check"></i>创建服务器` : `下一步<i data-ic="chevronRight"></i>`;
  KIT.hydrate(document.body);
}
document.getElementById("page").addEventListener("click", e => {
  const pl = e.target.closest("[data-play]"), co = e.target.closest("[data-core]");
  if (pl) { play = +pl.dataset.play; core = PLAYS[play].rec || PLAYS[play].cores[0]; render(); }
  else if (co) { core = co.dataset.core; render(); }
});
document.getElementById("next").addEventListener("click", () => { if (step < STEPS().length - 1) { step++; render(); } });
document.getElementById("back").addEventListener("click", () => {
  if (step > 0) { step--; render(); return; }
  // 第一步再往回：按钮沉下去，回首页，胶囊从下面浮上来
  document.body.classList.add("hidden-nav");
  const q = new URLSearchParams(location.search); q.set("enter", "1");
  setTimeout(() => { location.href = "home.html?" + q.toString(); }, 320);
});
KIT_READY.then(() => { render(); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("hidden-nav"))); });
</script>
</body>
</html>
