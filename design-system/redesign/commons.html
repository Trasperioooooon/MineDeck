<script>
// 程序图标里没有的：窗口三键、工具箱、星标、控制台，都照 home.html 的 EXTRA_ICONS 抄过来（home.html 里写了来历）；这一页没有新画的图标

window.EXTRA_ICONS = {

  winMin: '<path d="M4 8h8"/>', winMax: '<rect x="4" y="4" width="8" height="8" rx="1"/>', winClose: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  console: '<rect x="2" y="3" width="12" height="10" rx="1.6"/><path d="M4.8 6.5l1.8 1.5-1.8 1.5M8 10h3"/>',

<script src="kit.js"></script>
<script src="pixel16.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
/* 共用件对照页（11-26 第一稿，主会话派子代理照临时规范和首页、向导的做法画的，作者还没逐处看）：
   各页都会用到的弹窗、右上角的提示、下拉菜单、加载 / 空 / 错误三态、整页状态画在一页上。顶上一排分段切七块（也能用 ?part=confirm|form|ask|toast|menu|states|pages 直达），
   每块一屏，1280×800 不滚动。内容、文案、能做的事都照程序现在的（internal/web/ui/app.js，函数名和大约的行号写在各段注释里），只按临时规范重新排、重新画；
   程序里原有的长说明收进悬停（写在元素的 title 上，kit.js 换成自己画的浮层）。
   怎么看：
     · 三块弹窗（确认框、表单弹窗、报错与询问）底下是一块遮罩色的托盘，弹窗按真实宽度摆在上面，里面的开关、输入、分段都能点；点「取消」这类会关掉弹窗的按钮，
       托盘上的那个退场再进场一遍。每个弹窗上面那行小字右边的 ▶ 在整个窗口里真弹一次，看遮罩和弹窗的进出场。
     · ?open=<名字> 一打开就弹那一个（normal、backup、leftover、delete、delete-adopted、export、pending、errd、closeask、quit），
       ?page=<名字> 一打开就是那一种整页状态（offline、updating、quitting、missing、login、login-phone）。这两个和小字右边的 ▶、顶上的分段都是草图专用，定了就删。
   弹窗的做法（规范第三、四节）：
     · 弹窗是一块大面板（外圆角 26、内边距 8），字和要填的东西都在里面一栏（圆角 18 = 26 − 8，底色同向导的栏），按钮是底下一排 36 高的胶囊，
       左右贴着面板的内边距、等宽铺满（36 / 2 = 18 = 26 − 8：又是胶囊、又和面板的两个下角同心，同首页大卡底下那排）。
       为什么挑 36：给的三种里，40 高圆角 10 是表单控件（输入框、分段选）的样子，放在面板角上不同心；44 高是向导浮在页面上的上一步、下一步，弹窗里显大；
       36 是唯一一种既是胶囊、贴着面板的角又同心的。等宽铺满：按钮写出后果以后字长短不一，等宽才整齐，字换了宽度也不变（删除服务器那个开关一拨，按钮的字就换）。
     · 危险确认框标题前的图标块 40 见方，离栏的角 8、圆角 10（18 − 8），同向导第一步介绍里的核心图标。栏里的输入框、分段、路径框同向导第三步（40 高、圆角 10）。
     · 面板用 --surface 底（同首页大卡、向导面板），不用 MASTER 写的 --overlay：栏的底色是照 --surface 调的，换成 overlay 底时栏比面板暗，层次反过来。
       投影用 MASTER 的第四档 --elev-4，遮罩用 MASTER 的 --scrim 加 2 像素模糊（kit.css 里没有这两个，下面照 app.css 抄了深浅两套）。
     · 遮罩从标题栏下面开始，标题栏不盖：程序里遮罩盖住整个窗口，弹窗开着时拖不动窗口、点不了窗口三键，和 MASTER 红线 3「始终可用」不合。
     · 默认聚焦：危险确认框落在「取消」，别的落在主键（同程序 confirmModal）。用鼠标点开时浏览器不画焦点框，回车却照样按到它，
       所以落了焦点的那颗键画一圈 2 像素的强调色细框（离键 2 像素），一动别的就收（草图里托盘上的弹窗也画着，标出默认落在哪颗）。
   进出场（规范第七节没写到，照「快起慢停、离场比进场短」定了一套，曲线都用第七节已有的几条：进场 ease-out .2,.7,.2,1，离场 ease-in .4,0,1,1，补位 .3,.7,.2,1）：
     · 弹窗：遮罩 0.22 秒淡进，面板 0.26 秒从下面 10 像素浮上来（时长同换步的进场）；关掉时面板 0.14 秒往下 6 像素淡掉，遮罩 0.14 秒淡掉（同换步的离场）。只挪不缩放，同第七节别处。
     · 菜单（首页提示的浮层同一套）：0.22 秒从锚点那一侧 5 像素进来，收起 0.09 秒往回 5 像素淡掉（同逐项换）。
     · 右上角的提示：0.22 秒从上面 8 像素落下；走的时候 0.14 秒往右 16 像素淡掉（方向同程序）；下面的几条 0.32 秒补上去（选中框滑动那条曲线）。
     · 弹窗里一样一样变的（删除服务器的开关一拨，标题、说明、按钮的字和颜色跟着变）：同逐项换，旧的 0.09 秒淡掉，新的 0.22 秒从下面 5 像素浮上来；不重画整个弹窗。
     · 「减少动态」打开时都该关掉，草图没做。
   和程序现在不一样的地方（逐条写在各段注释里，汇总）：
     · 系统控件全换掉：程序弹窗里的单选（这个包给谁、没装上的文件怎么处理）、勾选框、<details> 折叠、浏览器自带滚动条，换成自己画的分段、开关、勾、细滚动条（规范第一节）。
     · 程序弹窗里的长说明收进悬停（每一处写在下面各段）；只留会拦住下一步或者会改变结果的那句（「无法恢复」「包里有密码」「信任这个站点的下载」）。
     · 危险确认框标题点名对象：程序「删除备份？」→「删除备份「更新模组前」？」，按钮「删除」→「删除备份」（MASTER 第 6 节「标题点名对象、按钮写出后果」）。
     · 「复制报错信息」：报错详情里原文框右上角一个复制图标（规范第九节「复制：值后面一个复制图标」），不再是一颗写着字的按钮。
     · 菜单里暂时不能点的项（服务器开着时的导出、删除）：程序是在项下面写一行「需先停止服务器」，这里照规范第九节灰掉、原因进悬停。
     · 右上角提示的停留：程序里报错的和带按钮的停 20 秒（app.js TOAST_LINGER_MS，可用性走查 R03 从 8 秒改的），任务单和 MASTER 第 11 节第 11 条写的是 8 秒；这里照程序画。
     · 整页状态：程序是把整个 body 换成一行字（标题栏也没了，原生窗口里拖不动、关不掉）；这里留着标题栏和窗口三键（MASTER 红线 3），字摆在正中。
   要后端补的：没有。这一页画的东西程序现在都有，只是换了排法；「服务器不存在」那页多了一颗「回到主页」（等同底部胶囊的主页），见那段注释。 */
:root { --elev-4: 0 28px 64px -16px rgb(var(--shadow-rgb) / .32), 0 8px 20px -4px rgb(var(--shadow-rgb) / .10); --scrim: rgb(var(--shadow-rgb) / .32); }
[data-theme="dark"] { --elev-4: 0 32px 72px -16px rgb(0 0 0 / .72), 0 8px 24px -4px rgb(0 0 0 / .40); --scrim: rgb(0 0 0 / .56); }
body { background: var(--bg); overflow: hidden; }

/* 标题栏：照 home.html（和内容同一张底，左边小图标，右边窗口三键） */
.tb { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px; position: relative; z-index: 45; background: var(--bg); }
.tb img { width: 16px; height: 16px; image-rendering: pixelated; }
.tb .sp { flex: 1; }
.tb .win { display: flex; height: 40px; }
.tb .win span { width: 46px; display: grid; place-items: center; color: var(--muted); }

/* 顶上一排：正中切换七块的分段（草图专用，定了就删），左右两段淡字说明 */
.hdr { position: absolute; top: 40px; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; }
.hdr .note { position: absolute; left: 24px; font-size: 12px; color: var(--faint); }
.hdr .note.r { left: auto; right: 24px; }
.hdr a { color: var(--accent-text); text-decoration: none; }
/* 分段：照 wizard.html 的 .seg（表单里取值的 40 高、圆角 10）和 .seg.sm（换着看什么的 32 高胶囊），选中的底色单独一块滑过去 */
.seg { position: relative; display: flex; padding: 3px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); box-sizing: border-box; height: 40px; }
.seg span { flex: 1; position: relative; z-index: 1; display: grid; place-items: center; font-size: 13px; color: var(--muted); border-radius: 6px; cursor: pointer; transition: color .2s; white-space: nowrap; }
.seg span:hover { color: var(--text); }
.seg span.on { color: var(--accent-text); font-weight: 500; }
.seg .sgl { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 6px; background: var(--accent-subtle); z-index: 0; pointer-events: none;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
            transition: transform .32s cubic-bezier(.3, .7, .2, 1), width .32s cubic-bezier(.3, .7, .2, 1); }
.seg.sm { height: 32px; border-radius: 16px; flex: none; }
.seg.sm span { flex: none; padding: 0 14px; font-size: 12.5px; border-radius: 12px; }
.seg.sm .sgl { border-radius: 12px; }
.seg.xs { height: 28px; border-radius: 14px; padding: 2px; } /* 小字那行里的草图开关：28 高胶囊，同筛选片 */
.seg.xs span { flex: none; padding: 0 10px; font-size: 12px; border-radius: 12px; }
.seg.xs .sgl { top: 2px; bottom: 2px; border-radius: 12px; }

/* 舞台：顶上那排下面的一大块。弹窗那三块是遮罩色的托盘（页面底叠一层 --scrim），弹窗摆在上面；别的几块是普通页面底 */
.stage { position: absolute; top: 100px; left: 16px; right: 16px; bottom: 16px; border-radius: 26px; }
.stage::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--scrim); opacity: 0; transition: opacity .22s cubic-bezier(.2, .7, .2, 1); }
.stage.dim::before { opacity: 1; }
.stage > .in { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 14px; box-sizing: border-box; }
.rowx { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
.rowx + .rowx { margin-top: 14px; }
.colx { display: flex; flex-direction: column; gap: 14px; }
.cell { display: flex; flex-direction: column; gap: 4px; }
/* 每样东西上面一行小字（草图里的说明，不是界面）：是什么、右边 ▶ 在窗口里真弹一次；有的还带一个草图开关切状态 */
.cap { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 2px 0 4px; font-size: 12px; color: var(--faint); white-space: nowrap; }
.stage.dim .cap { color: color-mix(in srgb, var(--text) 62%, transparent); }
.cap .sp { flex: 1; }
.ib { flex: none; width: 28px; height: 28px; border-radius: 4px; border: 0; padding: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s; }
.ib:hover { background: var(--hover); color: var(--text); }
.ib .ico { width: 15px; height: 15px; }
.ib.done { color: var(--accent-text); }
.stage.dim .cap .ib { color: color-mix(in srgb, var(--text) 70%, transparent); }

/* ---------- 弹窗（.md）：大面板 + 一栏 + 底下一排 36 高胶囊，理由见开头 ---------- */
.md { --R: 26px; --p: 8px; width: var(--w, 344px); box-sizing: border-box; border-radius: var(--R); padding: var(--p); background: var(--surface); box-shadow: var(--elev-4);
      display: flex; flex-direction: column; gap: 8px; text-align: left; }
.md .mc { border-radius: 18px; padding: 18px 20px 20px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.md .mh { display: flex; align-items: center; gap: 12px; min-height: 22px; }
.md .mh.has-ico { margin: -10px 0 0 -12px; } /* 图标块离栏的角 8：栏的内边距上 18、左 20，往上挪 10、往左挪 12 */
.md .mi { width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--danger-subtle); color: var(--danger-text); }
.md .mi .ico { width: 20px; height: 20px; }
.md h3 { flex: 1; min-width: 0; margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -.005em; display: flex; align-items: center; gap: 6px; }
.md h3 .sp { flex: 1; }
.md h3 > .ib { margin: -3px -8px -3px 0; } /* 报错信息标题这一行最右边的复制：离栏的右边 12 */
.md .mb { font-size: 13px; line-height: 21px; color: var(--muted); }
.md .mb b { color: var(--text); font-weight: 600; }
.md .mb .dg, .md .dg { color: var(--danger-text); font-weight: 600; }
.md .mono { font-family: var(--mono); font-size: 12.5px; }
.md h3 { flex-wrap: wrap; column-gap: 0; } .md h3 .nw { white-space: nowrap; } .md h3 .tipi { margin-left: 4px; } /* 标题里点名的对象不从中间断开 */
.tipi { display: inline-grid; place-items: center; width: 18px; height: 18px; vertical-align: -3px; color: var(--faint); cursor: default; }
.tipi .ico { width: 14px; height: 14px; }
.md .ma { display: flex; gap: 8px; }
/* 按钮：36 高胶囊（同首页大卡底下那排的 .btn：次要键 --control 底加细边，主键实心强调色，危险键实心危险色，危险而不是最终的那颗用浅危险底，同大卡的「停止」） */
.b { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; box-sizing: border-box;
     border: 1px solid var(--border); background: var(--control); color: var(--text); font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
     transition: background-color .2s, color .2s, border-color .2s, opacity .2s; }
.b:hover { background: var(--control-hov); }
.b .ico { width: 15px; height: 15px; }
.b.pri { background: var(--accent-solid); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.b.pri:hover { background: var(--accent-solid-hov); }
.b.dgr { background: var(--danger-solid); color: var(--on-danger); border-color: transparent; font-weight: 600; }
.b.dgr:hover { background: var(--danger-solid-hov); }
.b.sdg { background: var(--danger-subtle); color: var(--danger-text); border-color: transparent; }
.b.sdg:hover { background: color-mix(in srgb, var(--danger-text) 18%, transparent); }
.b[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.b.dgr[aria-disabled="true"]:hover { background: var(--danger-solid); }
.b.fk { outline: 2px solid var(--accent); outline-offset: 2px; }
.b.auto { flex: none; }
.b.sm { flex: none; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12px; } /* 28 高胶囊：同向导的快捷预设、筛选片 */
.b .lbl { display: inline-flex; align-items: center; gap: 6px; }
/* 栏里的表单件：照 wizard.html 第三步（.fld / .lb / .inp / .pathf / .fnote），开关、勾照 wizard.html 的 .tg / .ck */
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > .lb { font-size: 12.5px; line-height: 18px; color: var(--muted); font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
.fld > .lb .msg { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--danger-text); opacity: 0; transition: opacity .2s; }
.fld > .lb .msg.show { opacity: 1; }
.inp { height: 40px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); padding: 0 12px; box-sizing: border-box; width: 100%;
       font: inherit; font-size: 14px; color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s, opacity .2s; }
.inp::placeholder { color: var(--faint); }
.inp:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.inp.bad { border-color: color-mix(in srgb, var(--danger-text) 70%, var(--border)); }
.inp.mono { font-family: var(--mono); font-size: 13px; }
.iwrap { position: relative; }
.iwrap .inp { padding-right: 40px; }
.iwrap .ib { position: absolute; right: 6px; top: 6px; } /* 40 高框里离边 6 的小按钮 28 见方、圆角 4（10 − 6，规范第四节） */
.pathf { height: 40px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; box-sizing: border-box;
         background: var(--field); border: 1px solid var(--border); }
.pathf .ico { width: 15px; height: 15px; flex: none; color: var(--muted); }
.pathf b { display: flex; min-width: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; user-select: all; }
.pathf b .hd, .pathf b .tl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pathf b .hd { flex-shrink: 1000; min-width: 1.6ch; color: var(--muted); }
.fnote { font-size: 12px; line-height: 18px; color: var(--faint); display: flex; align-items: center; gap: 8px; min-height: 18px; }
.fnote.bad { color: var(--danger-text); }
.fnote a { color: var(--accent-text); cursor: pointer; white-space: nowrap; font-weight: 500; } /* 同 wizard.html 的 .fnote a：一行字里的动作是链接的样子，这一行不变高 */
.fnote .ico { width: 13px; height: 13px; flex: none; }
.mnote { font-size: 12.5px; line-height: 18px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.mnote .ico { width: 14px; height: 14px; flex: none; color: var(--faint); }
.mnote.warn { color: var(--warning-text); } .mnote.warn .ico { color: var(--warning-text); }
.tg { display: flex; align-items: center; gap: 12px; cursor: pointer; width: fit-content; }
.tg .m { flex: none; }
.tg .t { font-size: 13.5px; font-weight: 600; }
.sw { order: -1; width: 36px; height: 20px; border-radius: 10px; flex: none; position: relative; background: color-mix(in srgb, var(--text) 18%, transparent); transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--text); transition: transform .26s cubic-bezier(.3, .7, .2, 1); }
.tg.on .sw { background: var(--accent-solid); }
.tg.on .sw::after { transform: translateX(16px); background: var(--on-accent); }
.ck { display: inline-flex; align-items: center; gap: 8px; min-height: 26px; font-size: 12.5px; color: var(--muted); cursor: pointer; transition: color .2s; }
.ck:hover { color: var(--text); }
.ck .bx { width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box; border: 1.5px solid color-mix(in srgb, var(--text) 35%, transparent); display: grid; place-items: center; flex: none;
          color: transparent; transition: background .15s, border-color .15s, color .15s; }
.ck .bx .ico { width: 10px; height: 10px; }
.ck.on .bx { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent); }
.dconf { transition: opacity .2s; }
.dconf.off { opacity: .45; } /* 暂时用不了的整块 0.45（规范第六节）：开关关着时输名字那一块先给人看见，打开才能填 */
/* 提醒块（导出交接包「包里有玩家数据和密码」）、弹窗里提交出错（程序 .m-err）：栏里的块圆角 10，警告色、危险色的浅底 */
.wn, .merr { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 9px 12px; border-radius: 10px; box-sizing: border-box; font-size: 12.5px; line-height: 19px; }
.wn { background: var(--warning-subtle); color: var(--text); }
.wn .ico { color: var(--warning-text); width: 15px; height: 15px; flex: none; }
.merr { background: var(--danger-subtle); color: var(--danger-text); padding-right: 6px; }
.merr .ico { width: 15px; height: 15px; flex: none; }
.merr span { flex: 1; min-width: 0; }
/* 细滚动条：照 wizard.html 的 .lwrap / .list / .thumb 和 scrollbar()（系统滚动条藏掉，右边 4 像素的细条，悬停或在滚时出来，能拖；上下还有时那一头淡出 28） */
.lwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none;
        --ft: 0px; --fb: 0px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%); }
.list::-webkit-scrollbar { display: none; }
.lwrap.can-up .list { --ft: 28px; } .lwrap.can-down .list { --fb: 28px; }
.thumb { position: absolute; right: -6px; width: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text) 38%, transparent);
         opacity: 0; transition: opacity .2s, width .15s, right .15s; cursor: pointer; }
.lwrap:hover .thumb, .lwrap.scrolling .thumb, .thumb.drag { opacity: 1; }
.thumb:hover, .thumb.drag { width: 6px; right: -7px; background: color-mix(in srgb, var(--text) 55%, transparent); }
.lwrap.fits .thumb { display: none; }

/* 报错原文（程序 showErrDetail 约 247 行的 .err-detail）：等宽、可选中，像输入框那样的底和细边、圆角 10；多了在框里滚（细滚动条）。
   复制在标题那一行的最右边（原文框里放不下：细滚动条在框的右边，复制图标放框角上会和它叠在一起） */
.raw { position: relative; border-radius: 10px; background: var(--field); border: 1px solid var(--border); display: flex; min-height: 40px; }
.raw .lwrap { padding: 10px 14px 10px 12px; }
.raw .list { display: block; font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; outline: none; }
.raw .thumb { right: 4px; }

/* 没装上的文件（程序 pendingModal 约 3268 行、pendingPanel 约 3100 行）：一个文件一块（圆角 10），在栏里滚 */
.pnd { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 55%, transparent); flex: none; }
.pnd .r1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pnd .p { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pnd .why { font-size: 12px; line-height: 18px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pnd .why .host { font-family: var(--mono); color: var(--faint); }
.pnd .ib { width: 24px; height: 24px; }
.pnd .ib .ico { width: 13px; height: 13px; }
.pnd .more { transition: opacity .2s; }
.pnd.out { pointer-events: none; }
.pbar { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.pbar .sp { flex: 1; }
.pfold { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px; border: 0; background: none; border-radius: 10px; font: inherit; font-size: 12px; color: var(--faint); cursor: pointer; flex: none; }
.pfold:hover { color: var(--text); background: var(--hover); }
.pfold .ico { width: 13px; height: 13px; transition: transform .32s cubic-bezier(.3, .7, .2, 1); }
.pfold.open .ico { transform: rotate(180deg); }
.pdone { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.pdone .ico { width: 22px; height: 22px; color: var(--success-text); }

/* 弹窗真弹出来时：遮罩从标题栏下面盖到底（标题栏不盖，理由见开头），面板在剩下那块的正中 */
.mask { position: fixed; left: 0; right: 0; top: 40px; bottom: 0; z-index: 40; display: grid; place-items: center; background: var(--scrim); backdrop-filter: blur(2px); }
.mask.enter { animation: mk-in .22s cubic-bezier(.2, .7, .2, 1) both; }
.mask.enter > .md { animation: md-in .26s cubic-bezier(.2, .7, .2, 1) both; }
.mask.leave { animation: mk-out .14s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
.mask.leave > .md { animation: md-out .14s cubic-bezier(.4, 0, 1, 1) both; }
.md.out { animation: md-out .14s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
.md.in { animation: md-in .26s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes mk-in { from { opacity: 0; } }
@keyframes mk-out { to { opacity: 0; } }
@keyframes md-in { from { opacity: 0; transform: translateY(10px); } }
@keyframes md-out { to { opacity: 0; transform: translateY(6px); } }

/* ---------- 右上角的提示（程序 toast 约 123 行、placeToasts 约 200 行）----------
   位置同程序：标题栏下面 12、离窗口右边 16，360 宽，一条接一条往下排，间隔 8。
   外圆角 18、细边 1 加内边距 7（同心按外沿量，边也算：1 + 7 = 8），左上角的状态块 28 见方、圆角 10（18 − 8），右上角的关闭也是 28 见方、圆角 10；
   一行字的提示正好 44 高。按钮（详情、撤销、打开文件夹、改端口）是 28 高胶囊，排在字下面一行（程序里挤在字的右边，字长了会被挤成很窄一条）。 */
#toasts { position: fixed; right: 16px; top: 52px; z-index: 60; width: 360px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.tst { pointer-events: auto; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 6px; padding: 7px; border-radius: 18px; box-sizing: border-box;
       background: var(--overlay); border: 1px solid var(--border); box-shadow: var(--elev-3); cursor: pointer; }
.tst .ti { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: var(--success-subtle); color: var(--success-text); }
.tst.err .ti { background: var(--danger-subtle); color: var(--danger-text); }
.tst .ti .ico { width: 15px; height: 15px; }
.tst .tm { padding: 4px 0; font-size: 13px; line-height: 20px; color: var(--text); overflow-wrap: anywhere; }
.tst .tm .mono { font-family: var(--mono); font-size: 12.5px; }
.tst .tx { width: 28px; height: 28px; border-radius: 10px; }
.tst .ta { grid-column: 2 / 4; display: flex; gap: 6px; margin-bottom: 1px; }
.tst .ta .b { background: var(--control); }
.tst .ta .b:hover { background: var(--control-hov); }
.tst.enter { animation: ts-in .22s cubic-bezier(.2, .7, .2, 1) both; }
.tst.leave { animation: ts-out .14s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
@keyframes ts-in { from { opacity: 0; transform: translateY(-8px); } }
@keyframes ts-out { to { opacity: 0; transform: translateX(16px); } }

/* ---------- 下拉菜单（程序 dropMenu 约 1168 行；服务器卡片「···」的项是 folderItems 约 1392 行 + instMoreItems 约 3613 行）----------
   外圆角 16、细边 1 加内边距 5（1 + 5 = 6），项 36 高、圆角 10（16 − 6，同心）；36 同向导版本那一列的行。
   分组标题同栏的小标题（12 号 600、淡色）；分隔线左右各缩 6；危险项危险色的字和图标；暂时不能点的灰掉 0.45、原因进悬停（规范第九节；程序是在项下面写一行字）。 */
.dm { position: absolute; z-index: 50; min-width: 208px; padding: 5px; box-sizing: border-box; display: flex; flex-direction: column; gap: 1px;
      border-radius: 16px; border: 1px solid var(--border); background: var(--overlay); box-shadow: var(--elev-3); }
.dm.enter { animation: dm-in .22s cubic-bezier(.2, .7, .2, 1) both; }
.dm.leave { animation: dm-out .09s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
.dm.up.enter { animation-name: dm-in-up; } .dm.up.leave { animation-name: dm-out-up; }
@keyframes dm-in { from { opacity: 0; transform: translateY(-5px); } }
@keyframes dm-out { to { opacity: 0; transform: translateY(-5px); } }
@keyframes dm-in-up { from { opacity: 0; transform: translateY(5px); } }
@keyframes dm-out-up { to { opacity: 0; transform: translateY(5px); } }
.dm .it { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; transition: background .15s; }
.dm .it .ico { width: 16px; height: 16px; color: var(--muted); }
.dm .it:hover { background: var(--hover); }
.dm .it.dgr, .dm .it.dgr .ico { color: var(--danger-text); }
.dm .it[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.dm .it[aria-disabled="true"]:hover { background: none; }
.dm .hd { padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.dm .sep { height: 1px; margin: 4px 6px; background: var(--border); }

/* ---------- 首页的大卡：照 home.html（第九版的最终样子；home.html 里是几版样式叠出来的，这里合成一份，数值不变）---------- */
.lcs { display: grid; grid-template-columns: repeat(3, 349px); gap: 16px; width: 1079px; position: relative; }
.lc { position: relative; display: flex; flex-direction: column; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); box-sizing: border-box; }
.lc .cover { position: relative; height: 60px; border-radius: 18px; padding: 8px; display: flex; align-items: center; gap: 12px; overflow: hidden; box-sizing: border-box;
             background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.lc .cover::after { content: ""; position: absolute; inset: 0; opacity: .16; pointer-events: none;
  background-image: linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%), linear-gradient(45deg, rgb(0 0 0 / .5) 25%, transparent 25%, transparent 75%, rgb(0 0 0 / .5) 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.lc .cover > * { position: relative; z-index: 1; }
.px-avatar { --c: #7a8aa0; width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: var(--r-md);
             background: color-mix(in srgb, var(--c) 26%, var(--surface)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
.px-avatar svg { width: 24px; height: 24px; display: block; }
.lc .cover .px-avatar { width: 44px; height: 44px; border-radius: 10px; box-shadow: inset 0 1px 0 rgb(255 255 255 / .08); }
.lc .cover .px-avatar svg { width: 32px; height: 32px; }
.lc .title { flex: 1; min-width: 0; }
.lc .nm { font-size: 15px; font-weight: 600; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc .meta { font-size: 12px; color: color-mix(in srgb, var(--text) 70%, transparent); }
.lc .tools { height: 44px; padding: 0 6px; display: flex; align-items: center; border-radius: 10px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.lc .tools button { width: 30px; height: 30px; border-radius: var(--r-full); border: 0; padding: 0; background: none; display: grid; place-items: center; color: var(--muted); cursor: pointer; }
.lc .tools .pin { color: var(--faint); } .lc .tools .pin.on { color: var(--warning); }
.lc .tools button:hover, .lc .tools .mini.open { color: var(--text); background: var(--hover); }
.lc .inner { padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); height: 60px; border-radius: 18px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
.stats > div { padding: 9px 14px; } .stats > div + div { border-left: 1px solid var(--border); }
.stats .k { font-size: 11.5px; color: var(--muted); }
.stats .v { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 28px; }
.stats .v small { font-size: 12px; color: var(--faint); font-weight: 400; } .stats .v.ok { color: var(--success-text); }
.lc .acts { display: flex; gap: 8px; align-items: center; }
.lc .acts > span { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; box-sizing: border-box;
                   font-size: 13px; font-weight: 500; white-space: nowrap; background: var(--control); color: var(--text); border: 1px solid var(--border); }
.lc .acts > span.ic { flex: none; width: 36px; padding: 0; background: none; border-color: transparent; color: var(--muted); }
.lc .acts > span.stop { background: var(--danger-subtle); color: var(--danger-text); border-color: transparent; }
.lc .acts > span.go { background: var(--accent-subtle); color: var(--accent-text); border-color: transparent; }
.lc .acts > span.ok { background: var(--success-subtle); color: var(--success-text); border-color: transparent; }
.lc .acts > span.off { background: var(--surface-2); color: var(--faint); border-color: transparent; }
.lc .acts > span i.d { width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.lc .acts .ico { width: 15px; height: 15px; }

/* ---------- 三态（程序 MASTER 第 8 节；骨架 skeletonCards 约 1523 行、skeletonRows 约 1532 行，错误 errBox 约 440 行）----------
   骨架照新首页的尺寸画（大卡 349 × 188、列表的行 36 高），不照程序的旧卡片；呼吸照 wizard.html 第二步的骨架卡（透明度 .55 ↔ 1，1.1 秒来回），不用程序的扫光。
   空、错误：一块大面板里一栏（外 26 / 内边距 8 / 栏 18），中间一个图标块、一句话、一个主行动（MASTER 第 11 节第 8 条：空态只给一个主行动）。 */
.sk { background: color-mix(in srgb, var(--text) 9%, transparent); border-radius: 6px; }
.skel { animation: skel 1.1s ease-in-out infinite alternate; }
@keyframes skel { from { opacity: .55; } to { opacity: 1; } }
.lc.skc .cover { background: color-mix(in srgb, var(--text) 6%, var(--surface)); }
.lc.skc .cover::after { display: none; }
.lc.skc .cover .sk.av { width: 44px; height: 44px; border-radius: 10px; flex: none; }
.lc.skc .stats { background: color-mix(in srgb, var(--text) 5%, var(--surface)); }
.lc.skc .acts > span { background: color-mix(in srgb, var(--text) 7%, transparent); border-color: transparent; }
.pnl { width: 349px; box-sizing: border-box; border-radius: 26px; padding: 8px; background: var(--surface); box-shadow: var(--elev-1); }
.pnl .col { border-radius: 18px; padding: 12px 8px 8px; background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); display: flex; flex-direction: column; gap: 4px; }
.pnl .col h3 { margin: 0 0 6px; padding: 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.vrow { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 10px; font-family: var(--mono); font-size: 13.5px; font-weight: 500; }
.vrow .tag { margin-left: auto; font-family: var(--font); font-size: 11.5px; color: var(--faint); font-weight: 400; }
.vrow.on { background: var(--accent-subtle); color: var(--accent-text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.vrow.sk { background: none; } .vrow .sk { height: 11px; }
.state { height: 214px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 20px; text-align: center; }
.state .si { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); color: var(--muted); box-shadow: var(--elev-1); }
.state .si .ico { width: 22px; height: 22px; }
.state .si.bad { background: var(--danger-subtle); color: var(--danger-text); box-shadow: none; }
.state .st1 { font-size: 14px; font-weight: 600; line-height: 21px; }
.state .st2 { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.state .ra { display: flex; gap: 8px; align-items: center; }
.state .b.c { flex: none; width: 36px; padding: 0; } /* 复制报错信息：只放图标的 36 圆，同首页大卡右下角的链接 */
.state .b.pri, .state .b.auto { flex: none; }

/* ---------- 整页状态（程序约 670、6791、6970、3675 行，showLogin 约 31 行）：每种画成一整个 1280×800 的窗口，缩到 0.27 排成两行六格，点一格看原大 ---------- */
.thumbs { display: grid; grid-template-columns: repeat(3, 346px); gap: 14px 21px; }
.thc { display: flex; flex-direction: column; gap: 4px; }
.th { position: relative; width: 346px; height: 216px; border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: var(--elev-1), 0 0 0 1px var(--border); transition: box-shadow .2s, transform .2s; }
.th:hover { box-shadow: var(--elev-2), 0 0 0 1px color-mix(in srgb, var(--accent) 45%, var(--border)); }
.th > .pg { transform: scale(.27); transform-origin: 0 0; pointer-events: none; }
.th.phone { background: color-mix(in srgb, var(--text) 6%, var(--bg)); }
.th.phone > .pg { position: absolute; left: 123px; top: 0; transform: scale(.2559); }
.pg { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--bg); color: var(--text); font: 400 14px/22px var(--font); }
.pg.phone { width: 390px; height: 844px; }
.pg > .tb { position: absolute; top: 0; left: 0; right: 0; }
.pg .ctr { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 72px; box-sizing: border-box; }
.pg .ctr .logo { width: 64px; height: 64px; image-rendering: pixelated; margin-bottom: 6px; }
.pg .ctr .t1 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
.pg .ctr .t2 { margin-top: -6px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.pg .ctr .t2 .ico { width: 15px; height: 15px; color: var(--accent-text); animation: spin .9s linear infinite; }
.pg .ctr .si { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); color: var(--muted); box-shadow: var(--elev-1); margin-bottom: 4px; }
.pg .ctr .si .ico { width: 24px; height: 24px; }
.pg .ctr .b { flex: none; margin-top: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 底部胶囊：照 home.html（只放图标的 40 圆、间距 4，新建实心强调色在最右） */
.pg .cap2 { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: var(--r-full);
            background: color-mix(in srgb, var(--overlay) 86%, transparent); backdrop-filter: blur(16px) saturate(1.2); border: 1px solid var(--border); box-shadow: var(--elev-3); }
.pg .cap2 a { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-full); color: var(--muted); }
.pg .cap2 a .ico { width: 18px; height: 18px; }
.pg .cap2 a.on { color: var(--accent-text); background: var(--accent-subtle); }
.pg .cap2 a.home img { width: 20px; height: 20px; image-rendering: pixelated; }
.pg .cap2 a.ai { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); } .pg .cap2 a.ai .ico { color: var(--accent-text); }
.pg .cap2 a.new { background: var(--accent-solid); color: var(--on-accent); }
/* 手机远程管理的登录框：局域网里的浏览器打开，没有标题栏和窗口三键；一块大面板，宽 360（手机上左右各留 16） */
.pg .login { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); }
.pg.phone .login { top: 46%; }
.pg.phone .login .md { width: 358px; }
.login .brand { display: flex; align-items: center; gap: 12px; margin: -10px 0 4px -12px; }

<script>
"use strict";
const QS = new URLSearchParams(location.search);
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IN = "cubic-bezier(.4, 0, 1, 1)", OUT = "cubic-bezier(.2, .7, .2, 1)", SLIDE = "cubic-bezier(.3, .7, .2, 1)";
const wait = ms => new Promise(ok => setTimeout(ok, ms));
// 照 wizard.html 的 shakeEl：拦下一步时晃一下（0.36 秒，−6、5、−3 像素）
const shakeEl = el => el?.animate([{ transform: "none" }, { transform: "translateX(-6px)" }, { transform: "translateX(5px)" }, { transform: "translateX(-3px)" }, { transform: "none" }],
  { duration: 360, easing: "cubic-bezier(.3, .7, .2, 1)" });
// 照 wizard.html 的 placeSeg：分段的选中底色挪到选中的那一格
function placeSeg(el, animate) {
  const hl = el.querySelector(".sgl"), on = el.querySelector("span.on"); if (!hl || !on) return;
  if (!animate) hl.style.transition = "none";
  hl.style.transform = `translateX(${on.offsetLeft}px)`; hl.style.width = on.offsetWidth + "px";

// 照 wizard.html 的 scrollbar()：细滚动条跟着列表算长短和位置，能拖；上下有没看到的就渐隐
function scrollbar(w) {
  const l = w.querySelector(".list"), t = w.querySelector(".thumb");
  const paint = () => {
    const ch = l.clientHeight, sh = l.scrollHeight, st = l.scrollTop;
    w.classList.toggle("fits", sh <= ch + 1); w.classList.toggle("can-up", st > 2); w.classList.toggle("can-down", st + ch < sh - 2);
    const h = Math.max(28, ch * ch / sh);
    t.style.height = h + "px"; t.style.top = (sh > ch ? st / (sh - ch) * (ch - h) : 0) + (w.classList.contains("raw-w") ? 10 : 0) + "px";
  };
  if (w._paint) { w._paint(); return; }
  w._paint = paint;
  let idle = 0;
  l.addEventListener("scroll", () => { paint(); w.classList.add("scrolling"); clearTimeout(idle); idle = setTimeout(() => w.classList.remove("scrolling"), 700); }, { passive: true });
  t.addEventListener("pointerdown", e => {
    e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add("drag");
    const y0 = e.clientY, s0 = l.scrollTop, ratio = (l.scrollHeight - l.clientHeight) / (l.clientHeight - t.offsetHeight);
    const move = ev => { l.scrollTop = s0 + (ev.clientY - y0) * ratio; };

  });

}
// 逐项换（规范第七节）：旧的 0.09 秒淡掉，换上新的，0.22 秒从下面 5 像素浮上来；连着点时上一次没换完的作废
function swapHTML(el, html, cls) {
  if (!el) return;
  const tok = el._tok = (el._tok || 0) + 1;
  el.getAnimations().forEach(a => a.cancel());
  el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: IN, fill: "forwards" }).onfinish = () => {
    if (el._tok !== tok) return;
    el.innerHTML = html; if (cls != null) el.className = cls; KIT.hydrate(el);
    el.getAnimations().forEach(a => a.cancel());
    el.animate([{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: OUT });
  };
}
const segHTML = (key, opts, cur, cls = "") => `<div class="seg${cls ? " " + cls : ""}" data-seg="${key}"><i class="sgl"></i>${opts.map(([v, t, tip]) => `<span data-v="${v}"${v === cur ? ` class="on"` : ""}${tip ? ` title="${esc(tip)}"` : ""}>${t}</span>`).join("")}</div>`;
const tipi = t => `<span class="tipi" title="${esc(t)}"><i data-ic="info"></i></span>`;
const btn = (label, cls = "", attrs = "") => `<button class="b${cls ? " " + cls : ""}" ${attrs}><span class="lbl">${label}</span></button>`;

/* ================= 弹窗 =================
   md() 拼一个弹窗：标题、可选的危险图标块、说明、栏里另外的东西（extra）、底下一排按钮。程序里所有对话框（confirmModal、transferExportModal、pendingModal、
   showErrDetail、closeAskModal、showLogin）都是一个样子的 .modal，这里也一样，宽度按内容分几档：短的确认 344、删除服务器和关窗询问 440 / 460、表单 500 以上 */
function md({ id, w = 344, icon = "", title, body = "", extra = "", acts }) {
  return `<div class="md" data-md="${id}" style="--w:${w}px" role="dialog" aria-modal="true">

      ${body ? `<div class="mb" data-k="body">${body}</div>` : ""}${extra}</div>
    <div class="ma">${acts}</div></div>`;
}
// ---- 确认框（程序 confirmModal 约 468 行）。按钮写出后果；危险的默认聚焦「取消」、最终键实底红，标题前一个危险色图标块 ----
// 普通的：例子取自 modcart.js 约 648 行（装待装清单前，清单里的东西还要几个必装前置）。任务单举的「还原备份？」程序里是危险框（danger: true，图标 restore），

const M_normal = () => md({ id: "normal", title: "另外会自动装上 2 项必装前置",
  body: `清单里的模组需要它们，安装时会一起下载：<b>Fabric API</b>、<b>Cloth Config API</b>`,

// 时间和大小在正文里只写一次；文件名很长（20261126-213005.000000000-更新模组前.zip），收进悬停
const M_backup = () => md({ id: "backup", icon: "trash", title: "删除备份「更新模组前」？",

const M_leftover = () => md({ id: "leftover", icon: "trash", title: `删除没建完的文件夹<span class="nw">「survival-2」？</span>`,
  body: `位于 <span class="mono">MineDeck\\servers</span>。里面的世界文件会一起删掉，<b class="dg">无法恢复</b>${tipi("已建好的服务器和其他文件夹不会受影响。")}`,

const M_quit = () => md({ id: "quit", icon: "power", title: "退出 MineDeck？", body: "会先保存世界，停掉正在运行的服务器，然后退出程序。",

// ---- 删除服务器（程序 deleteInstance 约 1424 行）----
// 默认只移出列表：「同时删除服务器文件夹」默认关，关着时主键「移出列表」（不是红的），文件全留着；打开才是删除，主键「删除服务器和文件夹」实底红，

const DEL = {

  "delete-adopted": { name: "怀旧 1.12.2", root: "我的世界", dir: "1.12.2 服务端", adopted: true, left: ["instance.json.bak", "run.bat", "run.before-minedeck.bat"] },

const delTitle = (s, on) => on ? `删除「${esc(s.name)}」和它的文件夹？` : `把「${esc(s.name)}」移出列表？`;

const delNote = (s, on) => on ? `<i data-ic="warn"></i>这台是接管进来的，删掉的是你原来的那个文件夹`

function delToggle(m) {

      + segHTML("mode", [["handover", "交给下一任服主", "你不再开这台服务器，交给对方接着开。对方导入时，包用途写的是「服主交接（整台交给你）」"],

  const t = TOAST[kind], box = $("#toasts"), d = document.createElement("div"), linger = !!(t.err || t.acts);
  d.className = "tst enter" + (t.err ? " err" : "");
  d.title = t.err ? "点击查看详情" : linger ? "" : "点击关闭";
  d.innerHTML = `<span class="ti"><i data-ic="${t.err ? "warn" : "check"}"></i></span><span class="tm">${t.msg}</span>`
    + (linger ? `<button class="ib tx" data-tx aria-label="关闭这条提示"><i data-ic="x"></i></button>` : "<span></span>")
    + (t.err || t.acts ? `<span class="ta">${t.err ? `<button class="b sm" data-td>详情</button>` : ""}${(t.acts || []).map(([l, how], i) => `<button class="b sm" data-ta="${i}">${l}</button>`).join("")}</span>` : "");
  KIT.hydrate(d); box.appendChild(d); d._pinned = pinned;
  let left = linger ? 20000 : 3500, timer = 0, since = 0, holds = 0, gone = false;
  const kill = () => { if (gone) return; gone = true; clearTimeout(timer); leaveToast(d); };
  const run = () => { if (gone || holds || d._pinned) return; since = Date.now(); timer = setTimeout(kill, left); };
  const hold = () => { holds++; if (timer) { clearTimeout(timer); timer = 0; left = Math.max(0, left - (Date.now() - since)); } };
  const release = () => { holds = Math.max(0, holds - 1); if (!holds && !gone) { left = Math.max(left, 4000); run(); } };
  d.dismiss = kill; d.unpin = () => { d._pinned = false; run(); };
  d.addEventListener("click", e => {
    if (e.target.closest("[data-tx]")) return kill();
    const a = e.target.closest("[data-ta]");
    if (a) { const [, how] = t.acts[+a.dataset.ta]; if (how === "undo") { kill(); toast("undone"); } else if (how) kill(); return; }
    if (t.err) { hold(); const m = openLayer("errd", { raw: t.raw, fix: t.acts?.[0]?.[0] || "" }); const mk = m.closest(".mask"); const iv = setInterval(() => { if (!mk.isConnected || mk.classList.contains("leave")) { clearInterval(iv); release(); } }, 100); return; }
    if (!linger) kill();
  });
  if (linger) { d.addEventListener("mouseenter", hold); d.addEventListener("mouseleave", release); }
  run();
  return d;
}
TOAST.undone = { msg: "已换回原来的服务器存放文件夹" };
// 走的时候往右 16 像素淡掉（0.14 秒），下面的几条补上去（0.32 秒，选中框滑动那条曲线；同程序的 flipList）
function leaveToast(d) {
  if (d.classList.contains("leave")) return;
  d.classList.remove("enter"); d.classList.add("leave");
  setTimeout(() => {
    const box = $("#toasts"), sibs = [...box.children].filter(x => x !== d), before = new Map(sibs.map(x => [x, x.getBoundingClientRect().top]));
    d.remove();
    sibs.forEach(x => { const dy = before.get(x) - x.getBoundingClientRect().top; if (Math.abs(dy) > .5) x.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 320, easing: SLIDE }); });
  }, 140);
}

const FOLDERS = core => {
  const proxy = core === "velocity" || core === "waterfall", mods = ["fabric", "forge", "neoforge", "mohist", "banner"].includes(core),
    plugins = ["paper", "purpur", "leaves", "folia", "mohist", "banner", "velocity", "waterfall"].includes(core);

};
function menuHTML(s) {

  return `<div class="hd">打开文件夹</div>` + FOLDERS(s.core).map(([i, l]) => `<div class="it" role="menuitem" data-mi="dir"><i data-ic="${i}"></i>${l}</div>`).join("")

}
function openMenu(anchor, s, host, instant) {
  const old = $(`.dm[data-for="${anchor.dataset.card}"]:not(.leave)`, host);
  if (old) return closeMenu(old);

  const m = document.createElement("div"); m.className = "dm" + (instant ? "" : " enter"); m.dataset.for = anchor.dataset.card; m.setAttribute("role", "menu");
  m.innerHTML = menuHTML(s); KIT.hydrate(m); host.appendChild(m);
  const hr = host.getBoundingClientRect(), r = anchor.getBoundingClientRect(), h = m.offsetHeight, up = r.bottom + 4 + h > innerHeight - 8;
  m.classList.toggle("up", up);
  m.style.left = Math.round(r.right - hr.left - m.offsetWidth) + "px";
  m.style.top = Math.round((up ? r.top - h - 4 : r.bottom + 4) - hr.top) + "px";
  m.style.transformOrigin = `${up ? "bottom" : "top"} right`;

}
function closeMenu(m) {
  if (!m || m.classList.contains("leave")) return;

  const it = e.target.closest(".dm .it");

const skelRows = () => [62, 44, 52, 40, 48, 44].map(w => `<div class="vrow sk skel"><span class="sk" style="width:${w}%"></span><span class="sk" style="width:28px;margin-left:auto"></span></div>`).join("");
const verRows = () => [["26.2", "最新"], ["26.1", ""], ["1.21.4", ""], ["1.21.1", ""], ["1.20.6", ""], ["1.20.1", "常用"]].map(([v, t], i) => `<div class="vrow${i === 0 ? " on" : ""}">${v}${t ? `<span class="tag">${t}</span>` : ""}</div>`).join("");
// 三态：加载完的样子——骨架一起淡掉（0.09 秒），内容一张一张、一行一行淡进来（0.22 秒、从下面 5 像素、错开 22 毫秒；同规范第七节「卡片、行一批换」）
let reloadTok = 0;
async function reload(stage) {
  const tok = ++reloadTok, a = $('[data-k="ld1"]', stage), b = $('[data-k="ld2"]', stage);
  const swap = async (el, html) => { await el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: IN, fill: "forwards" }).finished; el.getAnimations().forEach(x => x.cancel()); el.innerHTML = html; KIT.hydrate(el); };
  await Promise.all([swap(a, skelCard()), swap(b, skelRows())]);
  await wait(900); if (tok !== reloadTok) return;
  await Promise.all([swap(a, bigCard(CARDS[1], 1)), swap(b, verRows())]);
  [a.firstElementChild, ...b.children].forEach((x, i) => x.animate([{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "none" }], { duration: 220, delay: i * 22, easing: OUT, fill: "backwards" }));
}

let cur = "", stageTok = 0;
const pinned = [];
function enterPart(id) {
  const p = PARTS.find(x => x.id === id), inEl = $("#stage-in");
  inEl.innerHTML = p.html();
  $$("[data-slot]", inEl).forEach(s => mount(s, s.dataset.slot));
  $$(".cap .seg", inEl).forEach(s => placeSeg(s, false));
  $$(".th", inEl).forEach(t => t.appendChild(pageEl(t.dataset.page)));
  KIT.hydrate(inEl);
  if (id === "menu") [0, 1].forEach(i => openMenu($(`.mini[data-card="${i}"]`, inEl), CARDS[i], inEl, true)); // 一进来两张卡的菜单都开着，作者一眼看全
  if (id === "toast") spawnPinned();
  return inEl;
}
// 提示那一块：右上角先钉上四条（一条接一条落下来）；草图开关关掉以后它们照真的计时走
function spawnPinned() { ["ok", "err", "undo", "open"].forEach((k, i) => setTimeout(() => { if (cur === "toast") pinned.push(toast(k, { pinned: true })); }, 120 + i * 60)); }
// 换一块（同规范第七节「卡片、行一批换」）：旧的一起往反方向挪 5 像素淡掉（0.09 秒），新的从点的那一侧挪 5 像素、一块一块淡进来（0.22 秒、错开 22 毫秒）；托盘的遮罩色 0.22 秒淡进淡出
function showPart(id, animate = true) {
  if (id === cur) return;
  const order = PARTS.map(x => x.id), dir = order.indexOf(id) > order.indexOf(cur) ? 1 : -1, tok = ++stageTok;
  $$("#parts span").forEach(s => s.classList.toggle("on", s.dataset.v === id)); placeSeg($("#parts"), animate);
  const prev = cur; cur = id;
  // 地址跟着换（作者照着地址就能回到这一块）；一打开就弹的 open、page 只在第一次进来时留着，换一块时去掉
  const q = new URLSearchParams(location.search); q.set("part", id); if (prev) { q.delete("open"); q.delete("page"); } history.replaceState(null, "", "?" + q.toString());
  $("#stage").classList.toggle("dim", !!PARTS.find(x => x.id === id).dim);
  if (prev === "toast") { pinned.splice(0).forEach(t => t.dismiss()); }
  $$(".dm").forEach(m => m.remove());
  const inEl = $("#stage-in");
  const go = () => {
    if (tok !== stageTok) return;
    inEl.getAnimations().forEach(a => a.cancel());
    enterPart(id);
    if (!animate) return;
    [...inEl.querySelectorAll(":scope > .rowx > *, :scope > .lcs > *, :scope > .thumbs > *, :scope > .cap")].forEach((x, i) =>
      x.animate([{ opacity: 0, transform: `translateX(${5 * dir}px)` }, { opacity: 1, transform: "none" }], { duration: 220, delay: i * 22, easing: OUT, fill: "backwards" }));
  };
  if (!animate || !prev) return go();
  inEl.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-5 * dir}px)` }], { duration: 90, easing: IN, fill: "forwards" }).onfinish = go;
}
$("#parts").insertAdjacentHTML("beforeend", PARTS.map(p => `<span data-v="${p.id}" role="tab">${p.t}</span>`).join(""));
$("#parts").addEventListener("click", e => { const s = e.target.closest("span"); if (s) showPart(s.dataset.v); });
// 舞台里的点击：▶ 真弹、小字右边的草图开关、提示的按钮、三态的重新加载、整页状态的缩略图
$("#stage").addEventListener("click", e => {
  const op = e.target.closest("[data-open]");
  if (op) { const slot = $(`[data-slot="${op.dataset.open}"] .md`); return openLayer(op.dataset.open, slot ? JSON.parse(JSON.stringify(slot._st, (k, v) => k === "items" || k === "skipped" ? undefined : v)) : undefined); }
  const sg = e.target.closest(".cap .seg span");
  if (sg && !sg.classList.contains("on")) {
    const box = sg.parentElement; $$("span", box).forEach(x => x.classList.toggle("on", x === sg)); placeSeg(box, true);
    const cell = box.closest(".cell"), kind = cell.dataset.cell, slot = $(".slot", cell), m = $(".md", slot);
    const st = { ...m._st }; if (box.dataset.seg === "exp") st.err = sg.dataset.v; if (box.dataset.seg === "raw") { st.long = sg.dataset.v === "long"; delete st.raw; delete st.fix; } if (box.dataset.seg === "tray") st.tray = sg.dataset.v === "1";
    m.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, easing: IN, fill: "forwards" }).onfinish = () => {
      const n = mount(slot, kind, st); n.animate([{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: OUT });
    };
    return;
  }
  const tb = e.target.closest("[data-toast]");
  if (tb) { if (tb.dataset.toast === "three") ["ok", "undo", "ok"].forEach((k, i) => setTimeout(() => toast(k), i * 260)); else toast(tb.dataset.toast); return; }
  const pin = e.target.closest('[data-act="pin"]');
  if (pin) { const on = pin.classList.toggle("on"); if (on) { pinned.splice(0).forEach(t => t.dismiss()); spawnPinned(); } else pinned.forEach(t => t.unpin()); return; }
  if (e.target.closest('[data-act="reload"]')) return reload($("#stage"));
  const cp = e.target.closest('[data-act="copy2"]');
  if (cp) { const old = cp.innerHTML; cp.innerHTML = `<span class="lbl">${KIT.icon("check")}</span>`; cp.style.color = "var(--accent-text)"; setTimeout(() => { cp.innerHTML = old; cp.style.color = ""; }, 1200); return; }
  if (e.target.closest('[data-act="retry"]')) { const i = $(".ico", e.target.closest('[data-act="retry"]')); i?.animate([{ transform: "none" }, { transform: "rotate(360deg)" }], { duration: 600, easing: "cubic-bezier(.3, .7, .2, 1)" }); return; }
  const th = e.target.closest("[data-page]");
  if (th) return openPage(th.dataset.page);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const top = layers[layers.length - 1]; if (top) return closeLayer(top);
  const m = $(".dm:not(.leave)"); if (m) closeMenu(m);
});
// 配色链接带上眼下这一块
for (const [id, th] of [["lk-light", "light"], ["lk-dark", "dark"]]) { const q = new URLSearchParams(location.search); q.set("theme", th); $("#" + id).href = "?" + q.toString(); }

KIT_READY.then(() => {
  const part = PARTS.some(p => p.id === QS.get("part")) ? QS.get("part") : "confirm";
  showPart(part, false);
  placeSeg($("#parts"), false);
  // 首页 ?notices=1 浮层里点「删除这个文件夹…」跳过来时带着 part=confirm&open=leftover
  const open = QS.get("open"); if (BUILD[open]) setTimeout(() => openLayer(open), 60);
  const page = QS.get("page"); if (PAGES[page]) setTimeout(() => openPage(page), 60);
});
</script>
</body>
</html>
