<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenFrp captcha</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; color: white; font: 14px sans-serif; }
    body { display: grid; place-items: center; }
  </style>
</head>
<body>
  <span>Loading captcha...</span>
  <script>
    const params = new URLSearchParams(location.search);
    const appId = params.get("appId") || "";
    const nonce = params.get("nonce") || "";
    const parentOrigin = params.get("parent") || "";
    let targetParent;
    let referrerOrigin;
    try { targetParent = new URL(parentOrigin); } catch {}
    try { referrerOrigin = new URL(document.referrer).origin; } catch {}
    const localParent = targetParent && ["127.0.0.1", "localhost", "[::1]"].includes(targetParent.hostname);
    const send = (type, extra = {}) => parent.postMessage({
      channel: "minedeck-openfrp-captcha", nonce, type, ...extra,
    }, parentOrigin);

    let sdk;
    try { sdk = new URL(params.get("sdk") || ""); } catch {}
    if (!sdk || sdk.protocol !== "https:" || sdk.hostname !== "cv.naids.com" ||
        !appId || !nonce || !localParent || !targetParent || targetParent.protocol !== location.protocol ||
        targetParent.port !== location.port || targetParent.origin !== parentOrigin || targetParent.origin !== referrerOrigin) {
      send("error");
    } else {
      sdk.searchParams.set("md", nonce);
      const script = document.createElement("script");
      script.src = sdk.href;
      script.async = true;
      script.dataset.appid = appId;
      script.onload = async () => {
        try {
          if (!window.CaptchaSDK || typeof window.CaptchaSDK.open !== "function") throw new Error();
          const result = await window.CaptchaSDK.open({ appId });
          const token = typeof result === "string" ? result : result && (result.token || result.data || result.value || result.result);
          if (!token || String(token).length > 8192) throw new Error();
          send("success", { token: String(token) });
        } catch (error) {
          const cancelled = window.CaptchaSDK && typeof window.CaptchaSDK.isCancelled === "function" && window.CaptchaSDK.isCancelled(error);
          send(cancelled ? "cancel" : "error");
        }
      };
      script.onerror = () => send("error");
      document.head.append(script);
    }
  </script>
</body>
</html>
