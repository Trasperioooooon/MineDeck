<!-- 亮点演示：模组购物车。光标点「加入购物车」→ 购物车里出现这个模组，三个前置跟着自己补上 → 光标点「安装全部」→ 四项依次打勾。
     默认画面即最终帧。画法和时间线见 css/motion.css 的 A10。按钮名照搬程序界面，由调用方传入；模组名是拉丁字母，直接写在图里。
     例子取自 v3.1.0-beta.1 的发布说明：往购物车里放 REI，自动带出 Fabric API、Architectury 和 Cloth Config。 -->
<svg class="anim sc-demo demo-cart" viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
 <!-- 左：搜索结果 -->
 <rect class="d-shadow" x="14" y="14" width="256" height="248" rx="10"/>
 <rect class="d-win" x="8" y="8" width="256" height="248" rx="10"/>
 <rect class="d-card" x="20" y="20" width="232" height="26" rx="13"/>
 <circle class="d-lens" cx="36" cy="32" r="5"/><path class="d-lens" d="M40 36 l4 4"/>
 <text class="t-muted" x="52" y="37">REI</text>

 <rect class="d-card" x="20" y="56" width="232" height="56" rx="7"/>
 <rect class="dc-i1" x="30" y="68" width="32" height="32" rx="5"/>
 <text class="t-b" x="72" y="80">REI</text><rect class="d-soft" x="72" y="88" width="54" height="7" rx="3"/>
 <g class="dc-add"><rect class="d-btn" x="160" y="71" width="82" height="26" rx="6"/><text class="t-b" x="201" y="89" text-anchor="middle">{{add}}</text></g>
 <g class="dc-added"><rect class="d-ok" x="160" y="71" width="82" height="26" rx="6"/><path class="d-tick-dark" d="M194 84 l5 5 l9 -11"/></g>

 <rect class="d-card" x="20" y="120" width="232" height="56" rx="7"/>
 <rect class="dc-i2" x="30" y="132" width="32" height="32" rx="5"/>
 <rect class="d-softer" x="72" y="136" width="64" height="8" rx="3"/><rect class="d-soft" x="72" y="152" width="44" height="7" rx="3"/>
 <rect class="d-btn" x="160" y="135" width="82" height="26" rx="6"/><text class="t-b" x="201" y="153" text-anchor="middle">{{add}}</text>

 <rect class="d-card" x="20" y="184" width="232" height="56" rx="7"/>
 <rect class="dc-i3" x="30" y="196" width="32" height="32" rx="5"/>
 <rect class="d-softer" x="72" y="200" width="50" height="8" rx="3"/><rect class="d-soft" x="72" y="216" width="60" height="7" rx="3"/>
 <rect class="d-btn" x="160" y="199" width="82" height="26" rx="6"/><text class="t-b" x="201" y="217" text-anchor="middle">{{add}}</text>

 <!-- 右：购物车 -->
 <rect class="d-shadow" x="284" y="14" width="188" height="248" rx="10"/>
 <rect class="d-win" x="278" y="8" width="188" height="248" rx="10"/>
 <text class="t-b t-lg" x="292" y="34">{{cart}}</text>
 <path class="d-line" d="M290 46 H454"/>

 <g class="dc-row dc-r1"><rect class="dc-i1" x="292" y="56" width="20" height="20" rx="4"/><text x="320" y="71">REI</text></g>
 <g class="dc-row dc-r2"><rect class="d-softer" x="292" y="88" width="20" height="20" rx="4"/><text x="320" y="103">Fabric API</text><rect class="d-tag" x="412" y="89" width="42" height="18" rx="9"/><text class="t-xs" x="433" y="102" text-anchor="middle">{{dep}}</text></g>
 <g class="dc-row dc-r3"><rect class="d-softer" x="292" y="120" width="20" height="20" rx="4"/><text x="320" y="135">Architectury</text><rect class="d-tag" x="412" y="121" width="42" height="18" rx="9"/><text class="t-xs" x="433" y="134" text-anchor="middle">{{dep}}</text></g>
 <g class="dc-row dc-r4"><rect class="d-softer" x="292" y="152" width="20" height="20" rx="4"/><text x="320" y="167">Cloth Config</text><rect class="d-tag" x="412" y="153" width="42" height="18" rx="9"/><text class="t-xs" x="433" y="166" text-anchor="middle">{{dep}}</text></g>

 <g class="dc-ok dc-k1"><rect class="d-okbox" x="292" y="56" width="20" height="20" rx="4"/><path class="d-tick" d="M297 66 l3.5 3.5 l6 -7.5"/></g>
 <g class="dc-ok dc-k2"><rect class="d-okbox" x="292" y="88" width="20" height="20" rx="4"/><path class="d-tick" d="M297 98 l3.5 3.5 l6 -7.5"/></g>
 <g class="dc-ok dc-k3"><rect class="d-okbox" x="292" y="120" width="20" height="20" rx="4"/><path class="d-tick" d="M297 130 l3.5 3.5 l6 -7.5"/></g>
 <g class="dc-ok dc-k4"><rect class="d-okbox" x="292" y="152" width="20" height="20" rx="4"/><path class="d-tick" d="M297 162 l3.5 3.5 l6 -7.5"/></g>

 <rect class="d-accent" x="292" y="214" width="162" height="30" rx="7"/>
 <text class="t-on" x="373" y="234" text-anchor="middle">{{install}}</text>

 <circle class="d-ring dc-ring1" cx="230" cy="88" r="13"/>
 <circle class="d-ring dc-ring2" cx="432" cy="232" r="13"/>
 <g transform="translate(432 232)"><g class="dc-cur"><path class="d-cursor" d="M0 0v14l4-4 3 6 2-1-3-6h5z"/></g></g>
</svg>
