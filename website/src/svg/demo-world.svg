<!-- 亮点演示：地图导入。左边是一个地图文件夹，光标移到「用已有地图开服」（.1–.42s）→ 点一下（.45s），按钮变成选中态（.52s）→ 中间箭头出现（.68s）→ 右边服务器列表里多出一台同名世界的服务器（.82–1.1s）。
     默认画面即最终帧。画法和时间线见 css/motion.css 的 A10。中文由调用方传入；存档里的文件名和核心版本是拉丁字母，直接写在图里。 -->
<svg class="anim sc-demo demo-world" viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg">
 <!-- 左：已有地图文件夹 -->
 <rect class="d-shadow" x="14" y="14" width="224" height="248" rx="10"/>
 <rect class="d-win" x="8" y="8" width="224" height="248" rx="10"/>
 <path class="d-folder" d="M22 26 h18 l5 5 h21 v20 h-44 Z"/>
 <text class="t-b t-lg" x="76" y="44">{{map}}</text>
 <path class="d-line" d="M20 62 H220"/>
 <g class="t-mono">
  <rect class="d-softer" x="24" y="76" width="10" height="12" rx="2"/><text class="t-mono" x="42" y="87">level.dat</text>
  <rect class="d-softer" x="24" y="100" width="12" height="10" rx="2"/><text class="t-mono" x="42" y="111">region</text>
  <rect class="d-softer" x="24" y="124" width="12" height="10" rx="2"/><text class="t-mono" x="42" y="135">DIM-1</text>
  <rect class="d-softer" x="24" y="148" width="12" height="10" rx="2"/><text class="t-mono" x="42" y="159">datapacks</text>
 </g>
 <rect class="d-btn" x="18" y="206" width="204" height="32" rx="7"/>
 <text class="t-b" x="120" y="226" text-anchor="middle">{{open}}</text>
 <g class="dw-ok"><rect class="d-ok" x="18" y="206" width="204" height="32" rx="7"/><text class="t-b" x="120" y="226" text-anchor="middle">{{open}}</text></g>

 <!-- 中：箭头 -->
 <g class="dw-arrow"><path class="d-path" d="M238 132 H254"/><path class="d-ink" d="M252 124 L264 132 L252 140 Z"/></g>

 <!-- 右：服务器列表 -->
 <rect class="d-shadow" x="274" y="14" width="198" height="248" rx="10"/>
 <rect class="d-win" x="268" y="8" width="198" height="248" rx="10"/>

 <rect class="d-card" x="280" y="24" width="174" height="62" rx="7"/>
 <rect class="d-dirt" x="292" y="42" width="26" height="26"/><rect class="d-grass" x="292" y="42" width="26" height="8"/><rect class="d-edge" x="292" y="42" width="26" height="26"/>
 <rect class="d-softer" x="328" y="45" width="62" height="8" rx="3"/><rect class="d-soft" x="328" y="59" width="42" height="7" rx="3"/>
 <circle class="d-dot-ok" cx="438" cy="55" r="5"/>

 <rect class="d-card" x="280" y="98" width="174" height="62" rx="7"/>
 <rect class="d-dirt" x="292" y="116" width="26" height="26"/><rect class="d-grass" x="292" y="116" width="26" height="8"/><rect class="d-edge" x="292" y="116" width="26" height="26"/>
 <rect class="d-softer" x="328" y="119" width="48" height="8" rx="3"/><rect class="d-soft" x="328" y="133" width="56" height="7" rx="3"/>
 <circle class="d-dot-off" cx="438" cy="129" r="5"/>

 <g class="dw-new">
  <rect class="d-newrow" x="280" y="172" width="174" height="68" rx="7"/>
  <rect class="d-dirt" x="292" y="193" width="26" height="26"/><rect class="d-grass" x="292" y="193" width="26" height="8"/><rect class="d-edge" x="292" y="193" width="26" height="26"/>
  <text class="t-b" x="328" y="203">{{map}}</text>
  <text class="t-muted" x="328" y="220">Paper 1.20.1</text>
  <circle class="d-dot-ok" cx="438" cy="206" r="5"/>
 </g>

 <circle class="d-ring dw-ring" cx="196" cy="226" r="13"/>
 <g transform="translate(196 226)"><g class="dw-cur"><path class="d-cursor" d="M0 0v14l4-4 3 6 2-1-3-6h5z"/></g></g>
</svg>